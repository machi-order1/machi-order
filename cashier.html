<!doctype html><html lang=ja><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel=manifest href=/manifest.webmanifest><title>会計｜MACHI ORDER</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#151515;font-family:-apple-system,sans-serif}.top{padding:18px;position:sticky;top:0;background:#f5f5f2eF;backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid #e5e5df}.brand{font-size:11px;letter-spacing:.14em;color:#777;font-weight:800}h1{font-size:28px;margin:4px 0}.sub{color:#666;font-size:13px}.wrap{max-width:900px;margin:auto;padding:14px 14px 90px}.card{background:#fff;border:1px solid #e5e5df;border-radius:22px;margin:12px 0;overflow:hidden}.meta{display:flex;justify-content:space-between;padding:17px}.seat{font-size:24px;font-weight:950}.total{font-size:26px;font-weight:950}.items{padding:0 17px 13px;color:#555;line-height:1.8}.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-top:1px solid #eee}.pay button{min-height:58px;border:0;border-radius:15px;font-size:17px;font-weight:900}.cash{background:#171717;color:#fff}.pp{background:#eee;color:#111}.empty{text-align:center;padding:70px 20px;color:#777}.empty b{display:block;color:#222;font-size:22px;margin-bottom:8px}.mo-appnav{position:sticky;bottom:0;z-index:40;display:flex;justify-content:space-around;background:#fffffff7;border-top:1px solid #ddd;padding:7px 6px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.mo-appnav a{min-width:58px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#666;font:700 11px sans-serif}.mo-appnav b{font-size:20px;line-height:22px}.mo-appnav a:nth-child(4){color:#111;background:#f0f0ec;border-radius:12px}</style><link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script></head><body><header class=top><div class=brand>MACHI ORDER · CASHIER</div><h1>会計</h1><div id=status class=sub>未会計を確認しています</div></header><main class=wrap><div id=app class=empty><b>読み込み中</b>少しお待ちください</div></main><nav class="mo-appnav"><a href="/store-command.html"><b>⌂</b>ホーム</a><a href="/kitchen.html"><b>🍳</b>厨房</a><a href="/today.html"><b>✓</b>今日</a><a href="/cashier.html"><b>¥</b>会計</a><a href="/staff.html"><b>☰</b>その他</a></nav><script>const API='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/cashier-api?store_id=1';let busy=new Set();const token=()=>localStorage.getItem('access_token')||localStorage.getItem('sb_access_token')||localStorage.getItem('machi_access_token')||'';const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');async function load(){if(!token()){app.innerHTML='<div class=empty><b>ログインが必要です</b>スタッフ画面からログインしてください</div>';return}try{const r=await fetch(API,{headers:{Authorization:'Bearer '+token()}}),j=await r.json();if(!r.ok)throw Error(j.error);status.textContent='未会計 '+j.orders.length+'件';app.innerHTML=j.orders.length?j.orders.map(o=>`<section class=card><div class=meta><div class=seat>${esc(o.dining_tables?.name||'注文 #'+o.id)}</div><div class=total>${yen(o.total)}</div></div><div class=items>${(o.order_items||[]).map(i=>esc(i.product_name_snapshot)+' ×'+i.quantity).join('<br>')}</div><div class=pay><button class=cash data-id=${o.id} data-method=cash>現金で会計</button><button class=pp data-id=${o.id} data-method=paypay>PayPayで会計</button></div></section>`).join(''):'<div class=empty><b>未会計はありません</b>会計待ちの注文がここに表示されます</div>';document.querySelectorAll('.pay button').forEach(b=>b.onclick=()=>pay(Number(b.dataset.id),b.dataset.method,o=>{}))}catch(e){status.textContent='再接続中';app.innerHTML='<div class=empty><b>会計情報を取得できません</b>自動で再接続します</div>'}}async function pay(id,m){if(busy.has(id))return;if(!confirm((m==='cash'?'現金':'PayPay')+'で会計を完了しますか？'))return;busy.add(id);try{const r=await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify({order_id:id,payment_method:m})}),j=await r.json();if(!r.ok)throw Error(j.error||'会計できません');await load()}catch(e){alert(e.message);await load()}finally{busy.delete(id)}}load();setInterval(load,7000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></body></html>
