<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/machi-design-system.css">
  <script src="/machi-ui-config.js"></script>
  <title>会計｜MACHI ORDER</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.top{padding:18px;position:sticky;top:0;background:#f5f5f2ef;backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid #e5e5df}.head{display:flex;align-items:end;justify-content:space-between;gap:12px}.brand{font-size:11px;letter-spacing:.14em;color:#777;font-weight:800}h1{font-size:28px;margin:4px 0}.sub{color:#666;font-size:13px}.logout{border:0;background:transparent;color:#777;text-decoration:underline;font-size:12px}.tabs{display:flex;gap:8px;margin-top:13px}.tab{border:0;border-radius:999px;padding:10px 14px;background:#fff;color:#555;font-weight:900}.tab.on{background:#171717;color:#fff}.wrap{max-width:900px;margin:auto;padding:14px 14px 90px}.tools{display:none;grid-template-columns:1fr 140px;gap:8px;margin:4px 0 12px}.tools.show{display:grid}.tools input,.tools select{width:100%;min-height:46px;border:1px solid #d8d8d2;border-radius:13px;background:#fff;padding:0 12px;font-size:16px}.card{background:#fff;border:1px solid #e5e5df;border-radius:22px;margin:12px 0;overflow:hidden}.meta{display:flex;justify-content:space-between;gap:12px;padding:17px}.seat{font-size:24px;font-weight:950}.orderid{font-size:12px;color:#777;margin-top:3px}.paidmeta{font-size:12px;color:#16733b;font-weight:850;margin-top:5px}.total{font-size:26px;font-weight:950;white-space:nowrap}.items{padding:0 17px 13px}.item{padding:9px 0;border-top:1px solid #eee;line-height:1.4}.item:first-child{border-top:0}.iname{font-weight:850}.opts{font-size:13px;color:#666;margin-top:3px}.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-top:1px solid #eee}.pay button{min-height:68px;border:0;border-radius:15px;font-size:16px;font-weight:900;line-height:1.25;padding:9px}.pay button small{display:block;font-size:11px;font-weight:750;opacity:.72;margin-top:3px}.pay button:disabled{opacity:.45}.cash{background:#171717;color:#fff}.pp{background:#eee;color:#111}.history-actions{padding:10px 14px 14px;border-top:1px solid #eee}.undo-pay{width:100%;border:1px solid #d38b8e;background:#fff5f5;color:#b71920;border-radius:13px;padding:12px;font-weight:900}.undo-pay:disabled{opacity:.45}.toast{position:fixed;z-index:100;left:50%;top:18px;transform:translate(-50%,-140%);width:min(calc(100% - 28px),560px);background:#16733b;color:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 12px 40px #0003;font-weight:900;line-height:1.45;transition:transform .22s ease}.toast.show{transform:translate(-50%,0)}.toastrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.toast button{border:0;border-radius:10px;background:#fff;color:#111;padding:10px 13px;font-weight:950;white-space:nowrap}.empty{text-align:center;padding:70px 20px;color:#777}.empty b{display:block;color:#222;font-size:22px;margin-bottom:8px}.empty a{display:inline-block;margin-top:14px;background:#171717;color:#fff;text-decoration:none;padding:13px 18px;border-radius:13px;font-weight:900}.mo-appnav{position:sticky;bottom:0;z-index:40;display:flex;justify-content:space-around;background:#fffffff7;border-top:1px solid #ddd;padding:7px 6px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.mo-appnav a{min-width:58px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#666;font:700 11px sans-serif;border-radius:12px}.mo-appnav b{font-size:20px;line-height:22px}.mo-appnav .active{color:#111;background:#f0f0ec}@media(max-width:560px){.logout{display:none}.seat{font-size:21px}.total{font-size:23px}.tools{grid-template-columns:1fr 120px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="head"><div><div class="brand">MACHI ORDER · CASHIER</div><h1>会計</h1><div id="status" class="sub">未会計を確認しています</div></div><button id="logout-button" class="logout">ログアウト</button></div>
    <div class="tabs"><button class="tab on" data-mode="pending">未会計</button><button class="tab" data-mode="history">本日会計済み</button></div>
  </header>
  <div id="toast" class="toast" role="status" aria-live="polite"><div class="toastrow"><span id="toast-message"></span><button id="toast-action" type="button" hidden>取り消す</button></div></div>
  <main class="wrap">
    <div id="history-tools" class="tools"><input id="history-search" type="search" placeholder="席・注文番号・レシート検索"><select id="payment-filter"><option value="">支払方法すべて</option><option value="cash">現金</option><option value="paypay">PayPay</option><option value="other">その他</option></select></div>
    <div id="app" class="empty"><b>読み込み中</b>少しお待ちください</div>
  </main>
  <nav class="mo-appnav"><a href="/store-command.html"><b>⌂</b>ホーム</a><a href="/kitchen.html"><b>🍳</b>厨房</a><a href="/today.html"><b>✓</b>今日</a><a class="active" href="/cashier.html"><b>¥</b>会計</a><a href="/staff.html"><b>☰</b>その他</a></nav>
  <script>
    const API='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/cashier-api?store_id=1',AUTH='https://tejglrlkaqolbghoagqj.supabase.co/auth/v1/token',KEY='sb_publishable_beZla85Y6Ngrx0hji9I9rg_FbcRSUoT';
    let busy=new Set(),orders=[],toastTimer,currentMode='pending',toastCallback=null;
    const app=document.getElementById('app'),statusNode=document.getElementById('status'),toast=document.getElementById('toast'),toastMessage=document.getElementById('toast-message'),toastAction=document.getElementById('toast-action'),historyTools=document.getElementById('history-tools'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
    function showToast(message,action=null){toastMessage.textContent=message;toastCallback=action;toastAction.hidden=!action;toastAction.disabled=false;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.classList.remove('show');toastCallback=null},action?10000:4200)}
    function rawToken(){return localStorage.getItem('machi_access_token')||localStorage.getItem('mo_staff_token')||localStorage.getItem('access_token')||localStorage.getItem('sb_access_token')||''}
    function saveSession(j){localStorage.setItem('machi_access_token',j.access_token);localStorage.setItem('mo_staff_token',j.access_token);if(j.refresh_token)localStorage.setItem('machi_refresh_token',j.refresh_token);localStorage.setItem('machi_token_expires_at',String(Date.now()+Math.max(60,Number(j.expires_in)||3600)*1000))}
    async function token(){let t=rawToken(),exp=Number(localStorage.getItem('machi_token_expires_at')||0),refresh=localStorage.getItem('machi_refresh_token')||'';if(t&&(!exp||Date.now()<exp-60000))return t;if(!refresh)return t;try{const r=await fetch(AUTH+'?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh})}),j=await r.json();if(!r.ok)throw Error();saveSession(j);return j.access_token}catch{return t}}
    function clearSession(){['machi_access_token','mo_staff_token','access_token','sb_access_token','machi_refresh_token','machi_token_expires_at'].forEach(k=>localStorage.removeItem(k))}
    function paymentLabel(method){return method==='cash'?'現金':method==='paypay'?'PayPay':'その他'}
    function paidTime(value){return value?new Date(value).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'–'}
    function withinUndo(order){return order.paid_at&&Date.now()-new Date(order.paid_at).getTime()<=5*60_000}
    function visibleHistory(){const query=document.getElementById('history-search').value.trim().toLowerCase(),method=document.getElementById('payment-filter').value;return orders.filter(order=>{const haystack=[order.id,order.receipt_number,order.dining_tables?.name].join(' ').toLowerCase();return(!query||haystack.includes(query))&&(!method||order.payment_method===method)})}
    function render(){
      historyTools.classList.toggle('show',currentMode==='history');
      const list=currentMode==='history'?visibleHistory():orders;
      statusNode.textContent=currentMode==='history'?'本日の会計済み '+list.length+'件':'未会計 '+orders.length+'件';
      if(!list.length){app.innerHTML=currentMode==='history'?'<div class="empty"><b>該当する会計履歴がありません</b>席名・注文番号・レシート番号で検索できます</div>':'<div class="empty"><b>未会計はありません</b>会計待ちの注文がここに表示されます</div>';return}
      app.innerHTML=list.map(o=>`<section class="card"><div class="meta"><div><div class="seat">${esc(o.dining_tables?.name||'注文 #'+o.id)}</div><div class="orderid">注文 #${o.id}${o.receipt_number?' · '+esc(o.receipt_number):''}</div>${currentMode==='history'?`<div class="paidmeta">${paidTime(o.paid_at)} · ${paymentLabel(o.payment_method)}</div>`:''}</div><div class="total">${yen(o.total)}</div></div><div class="items">${(o.order_items||[]).map(i=>`<div class="item"><div class="iname">${esc(i.product_name_snapshot)} ×${Number(i.quantity||0)}</div>${(i.order_item_options||[]).length?`<div class="opts">${i.order_item_options.map(z=>esc(z.option_name_snapshot)).join('・')}</div>`:''}</div>`).join('')}</div>${currentMode==='history'?(withinUndo(o)?`<div class="history-actions"><button class="undo-pay" data-undo="${o.id}" ${busy.has(o.id)?'disabled':''}>${busy.has(o.id)?'処理中…':'会計完了を取り消す'}</button></div>`:''):`<div class="pay"><button class="cash" data-id="${o.id}" data-method="cash" ${busy.has(o.id)?'disabled':''}>${busy.has(o.id)?'処理中…':'現金を受け取りました'}<small>会計完了</small></button><button class="pp" data-id="${o.id}" data-method="paypay" ${busy.has(o.id)?'disabled':''}>${busy.has(o.id)?'処理中…':'PayPay入金確認済み'}<small>会計完了</small></button></div>`}</section>`).join('');
      document.querySelectorAll('.pay button').forEach(button=>button.addEventListener('click',()=>pay(Number(button.dataset.id),button.dataset.method)));
      document.querySelectorAll('[data-undo]').forEach(button=>button.addEventListener('click',()=>undoPayment(Number(button.dataset.undo))));
    }
    async function load(){const t=await token();if(!t){statusNode.textContent='未ログイン';app.innerHTML='<div class="empty"><b>ログインが必要です</b>長浜店のスタッフアカウントでログインしてください。<br><a href="/login.html?next=/cashier.html">ログイン画面を開く</a></div>';return}try{const r=await fetch(API+'&mode='+currentMode,{headers:{Authorization:'Bearer '+t}}),j=await r.json();if(r.status===401){clearSession();location.replace('/login.html?next=/cashier.html');return}if(!r.ok)throw Error(j.error||'会計情報を取得できません');orders=j.orders||[];render()}catch(e){statusNode.textContent='再接続中';if(!orders.length)app.innerHTML='<div class="empty"><b>会計情報を取得できません</b>'+esc(e.message)+'<br>自動で再接続します</div>'}}
    async function apiPost(body){const r=await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(r.status===401){clearSession();location.replace('/login.html?next=/cashier.html');throw Error('ログインしてください')}if(!r.ok)throw Error(j.error||'会計を更新できません');return j}
    async function pay(id,method){if(busy.has(id))return;const order=orders.find(o=>Number(o.id)===id),amount=yen(order?.total),seat=order?.dining_tables?.name||'注文 #'+id;const question=method==='cash'?`${seat}：お客様から ${amount} を受け取りましたか？\n\nOK後は会計完了になります。`:`${seat}：PayPay側で ${amount} の入金を確認しましたか？\n\n支払い画面だけでなく、入金済みを確認してからOKを押してください。`;if(!confirm(question))return;busy.add(id);render();try{await apiPost({action:'complete_payment',order_id:id,payment_method:method});showToast(`${seat} ${amount}｜${paymentLabel(method)}会計を完了しました`,()=>undoPayment(id,{seat,amount,method}));await load()}catch(e){alert(e.message);await load()}finally{busy.delete(id);render()}}
    async function undoPayment(id,known=null){if(busy.has(id))return;const order=known||orders.find(o=>Number(o.id)===id)||{},seat=known?.seat||order.dining_tables?.name||'注文 #'+id,amount=known?.amount||yen(order.total),method=known?.method||order.payment_method;const note=method==='paypay'?'\n\n重要：PayPayの返金は自動では行われません。これはMACHI ORDER上の会計表示だけを未会計へ戻します。':'\n\n現金の受け渡しは別途確認してください。';if(!confirm(`${seat} ${amount} の会計完了を取り消しますか？${note}`))return;busy.add(id);render();try{const result=await apiPost({action:'undo_payment',order_id:id});toast.classList.remove('show');showToast(result.external_refund_required?'未会計へ戻しました。PayPay返金は別途必要です':'未会計へ戻しました');currentMode='pending';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.mode==='pending'));await load()}catch(e){alert(e.message);await load()}finally{busy.delete(id);render()}}
    toastAction.addEventListener('click',async()=>{if(!toastCallback)return;const action=toastCallback;toastCallback=null;toastAction.disabled=true;await action()});
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{currentMode=button.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===button));orders=[];app.innerHTML='<div class="empty"><b>読み込み中</b>少しお待ちください</div>';load()}));
    document.getElementById('history-search').addEventListener('input',render);document.getElementById('payment-filter').addEventListener('change',render);
    document.getElementById('logout-button').addEventListener('click',()=>{if(confirm('この端末からログアウトしますか？')){clearSession();location.replace('/login.html?next=/cashier.html')}});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});load();setInterval(()=>{if(document.visibilityState==='visible')load()},7000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  </script>
</body>
</html>
