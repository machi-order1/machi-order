  <style>

    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button{font:inherit}header{background:linear-gradient(145deg,var(--brand),var(--brand-dark));color:#fff;padding:20px;box-shadow:0 5px 20px #b20e1838}.brandhead{max-width:760px;margin:auto;display:flex;align-items:center;gap:17px}.brandmark{width:155px;height:auto;display:block;flex:0 0 auto}.brandcopy{min-width:0}.logo{font-size:11px;letter-spacing:.19em;color:#fff;font-weight:900;opacity:.9}h1{margin:7px 0 4px;font-size:25px}.place{color:#fff;font-size:14px;font-weight:700}.version{font-size:10px;color:#fff;margin-top:6px;letter-spacing:.12em;opacity:.7}main{max-width:760px;margin:auto;padding:0 14px 110px}.tabs{display:flex;gap:8px;overflow:auto;position:sticky;top:0;z-index:9;background:#fffaf8ed;backdrop-filter:blur(10px);padding:11px 0 12px}.tab,.choice{border:1px solid #ffd2ce;background:#fff;color:var(--brand-dark);padding:12px 16px;border-radius:22px;white-space:nowrap;font-weight:750}.tab.active{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 5px 14px #e71e2b30}.happy-banner{margin:2px 0 14px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#fff2a8,#ffd340);color:#76100f;border:2px solid #f2b500;box-shadow:0 6px 18px #bf7d002c;display:flex;align-items:center;justify-content:space-between;gap:12px}.happy-banner strong{display:block;font-size:18px;font-weight:1000}.happy-banner span{display:block;margin-top:2px;font-size:12px;font-weight:800}.happy-banner b{font-size:13px;background:#d9141f;color:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap}.card{background:#fff;border:1px solid #ffe1de;border-radius:18px;padding:16px;margin:10px 0;cursor:pointer;box-shadow:0 5px 18px #9f1a2210}.card:active{transform:scale(.99)}.card.sold{opacity:.5;cursor:default}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.product{min-width:0;flex:1}.name{font-size:18px;font-weight:850}.desc{font-size:13px;color:#706565;margin-top:5px;line-height:1.45}.pricebox{text-align:right;min-width:72px}.price{font-size:20px;font-weight:950;white-space:nowrap;color:var(--brand-dark)}.regular-price{display:block;color:#777;font-size:14px;font-weight:800;text-decoration:line-through;text-decoration-color:#d9141f;text-decoration-thickness:3px}.happy-label{display:inline-block;margin:4px 0 1px;padding:3px 6px;border-radius:6px;background:#ffe04f;color:#8a0d12;font-size:10px;font-weight:1000;white-space:nowrap}.happy-price{font-size:23px;color:#d9141f}.add,.order{border:0;background:linear-gradient(145deg,var(--brand),var(--brand-dark));color:#fff;border-radius:13px;padding:12px 15px;font-weight:900;box-shadow:0 5px 14px #d9141f32}.add{margin-top:8px}.photo{width:96px;height:96px;border-radius:15px;background:#fff0ea center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#a56f6b;font-size:11px;text-align:center;overflow:hidden;flex:0 0 auto;box-shadow:inset 0 0 0 1px #ffded9}.photo img{width:100%;height:100%;object-fit:cover}section{scroll-margin-top:72px}section>h2{color:#8e1018}.cart{position:fixed;bottom:12px;left:12px;right:12px;max-width:736px;margin:auto;background:linear-gradient(145deg,var(--brand),var(--brand-dark));color:#fff;padding:14px 18px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;z-index:10;box-shadow:0 9px 32px #9f101a55}.cart .tab{border-color:#fff;background:#fff;color:var(--brand-dark)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#3b0508aa;display:flex;align-items:flex-end;z-index:20}.sheet{background:#fffaf8;width:100%;padding:22px max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));border-radius:22px 22px 0 0;max-height:90vh;overflow:auto}.choice{display:block;width:100%;text-align:left;background:#fff;margin:8px 0;border:2px solid #ffe1de;font-size:16px}.choice.sel{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark)}.order{width:100%;font-size:18px;margin-top:14px;min-height:54px}.order:disabled{opacity:.5}.qtyrow{display:flex;align-items:center;gap:12px}.mini{border:1px solid #ffd6d2;background:#fff0ee;color:var(--brand-dark);border-radius:9px;padding:9px 13px;font-weight:900}.success{font-size:54px;text-align:center;color:var(--brand)}.net{position:fixed;top:8px;right:8px;z-index:30;font-size:11px;font-weight:900;padding:6px 9px;border-radius:999px;background:#821018;color:#fff;box-shadow:0 2px 10px #0002}.notice{background:#fff3d5;border-radius:13px;padding:12px 14px;margin:10px 0;font-size:13px;line-height:1.55}.danger{background:#fde8e5}.retry{border:0;background:var(--brand);color:#fff;border-radius:12px;padding:11px 14px;font-weight:800;margin-top:12px}
    @media(max-width:520px){header{padding:16px 18px}.brandhead{gap:12px}.brandmark{width:120px}h1{font-size:21px}.place{font-size:12px}.card{padding:12px}.row{gap:10px}.photo{width:92px;height:92px}.name{font-size:16px}.price{font-size:18px}.add{padding:11px 13px}}

  <link rel="stylesheet" href="/customer-menu.css">
  <script src="/machi-app.js"></script>
  <script src="/customer-promotions.js"></script>
  <link rel="stylesheet" href="/customer-promotions.css">

<body>
  <div id="net" class="net hidden">オフライン</div>
  <aside id="happy-offer" class="happy-offer hidden" aria-label="ハッピーアワー"></aside>
  <header>
    <div class="brandhead">
      <img class="brandmark" src="/assets/brand/151-logo-white.webp" alt="博多油そば151">
      <div class="brandcopy">
        <div class="logo">MACHI ORDER</div>
        <h1 id="brand">読み込み中…</h1>
        <div id="place" class="place"></div>
        <div class="version">V71 長浜実戦統合版</div>
      </div>
    </div>
  </header>
  <main class="customer-menu-layout"><nav id="tabs" class="tabs" aria-label="メニューのカテゴリ"></nav><div id="menu"></div></main>
  <div id="cartbar" class="cart hidden"><b id="sum"></b><button id="open-cart" class="tab">カートを見る</button></div>
  <div id="modal" class="hidden"></div>

  <script>
  (() => {
    'use strict';
    const q = new URLSearchParams(location.search);
    const seatToken = q.get('t') || '';
    const alcoholPinKey = `machi_alcohol_pin_v71:${seatToken}`;
    let alcoholPinned = false;
    try { alcoholPinned = sessionStorage.getItem(alcoholPinKey) === '1'; } catch {}
    function pinAlcoholAfterOrder(items) {
      if (!CustomerPromotions.containsAlcohol(data, items)) return;
      alcoholPinned = true;
      try { sessionStorage.setItem(alcoholPinKey, '1'); } catch {}
      // A display update must never turn a successful order into a retry warning.
      try { renderHappyOffer(); } catch {}
    }
    function syncOfferHeight() {
      const height = alcoholPinned ? $('happy-offer').getBoundingClientRect().height : 0;
      document.documentElement.style.setProperty('--pinned-offer-height', `${height}px`);
    }
    if (window.ResizeObserver) new ResizeObserver(syncOfferHeight).observe(document.getElementById('happy-offer'));
    window.addEventListener('resize', syncOfferHeight);
    const orderChannel = q.get('channel') === 'staff' ? 'staff' : 'qr';
    const testMode = q.get('test') === '1';
    const cartKey = `machi_cart_v71:${seatToken || 'missing'}`;
    const pendingKey = `machi_pending_order_v71:${seatToken || 'missing'}`;
    const $ = (id) => document.getElementById(id);
    let data = null;
    let cart = restoreCart();
    let current = null;
    let selected = {};
    let quantity = 1;
    let sending = false;

    function restoreCart() {
      try {
        const value = JSON.parse(localStorage.getItem(cartKey) || '[]');
        return Array.isArray(value) ? value : [];
      } catch { return []; }
    }
    function saveCart() { localStorage.setItem(cartKey, JSON.stringify(cart)); }
    function setNetworkState() { $('net').classList.toggle('hidden', navigator.onLine); }
    addEventListener('online', setNetworkState);
    addEventListener('offline', setNetworkState);
    setNetworkState();

    const toppingIds = new Set([9, 10, 11, 12, 13, 14]);
    const toppingCategoryId = 900001;
    const recommendedCategoryId = 900000;
    function isTopping(product) { return Number(product.category_id) === 3 && toppingIds.has(Number(product.id)); }
    function categoryProducts(category) {
      if (category.id === recommendedCategoryId) return CustomerPromotions.recommendations(data);
      if (category.id === toppingCategoryId) return (data.products || []).filter(isTopping);
      const ids = (data.categories || []).filter(item => Number(item.id) === Number(category.id) || Number(item.parent_id) === Number(category.id)).map(item => Number(item.id));
      return (data.products || []).filter(product => ids.includes(Number(product.category_id)) && !isTopping(product));
    }
    function displayCategories() {
      const categories = data.categories || [];
      const visible = categories.filter((item) => !item.parent_id).flatMap((root) => {
        const children = categories
          .filter((item) => Number(item.parent_id) === Number(root.id))
          .sort((a, b) => Number(a.sort_order || 0) - Number(b.sort_order || 0));
        return children.length ? children : [root];
      });
      visible.push({ id: recommendedCategoryId, name: 'おすすめ' }, { id: toppingCategoryId, name: 'トッピング' });
      const order = [recommendedCategoryId, 1, toppingCategoryId, 2, 3, 5, 6];
      return visible.sort((a, b) => (order.includes(Number(a.id)) ? order.indexOf(Number(a.id)) : 99) - (order.includes(Number(b.id)) ? order.indexOf(Number(b.id)) : 99));
    }
    function productGroups(product) {
      return (product.option_group_ids || []).map((id) => data.option_groups.find((group) => Number(group.id) === Number(id))).filter(Boolean);
    }
    const menuPhotos = {
      1:'hakata-aburasoba.webp', 2:'ebi-shio-aburasoba.webp', 3:'iki-beef-hakata.webp', 4:'iki-beef-ebi-shio.webp',
      5:'chashu-hakata.webp', 6:'chashu-ebi-shio.webp', 7:'double-aburasoba.webp', 8:'double-aburasoba.webp',
      9:'extra-chashu.webp', 10:'takana.webp', 11:'spicy-takana.webp', 12:'raw-egg.webp',
      13:'half-boiled-egg.webp', 14:'iki-premium-beef.webp', 15:'dashi.webp',
      16:'set-a.webp', 17:'set-b.webp', 18:'set-c.webp', 19:'set-d.webp', 20:'set-e.webp',
      21:'dumplings-3.webp', 22:'dumplings-5.webp', 23:'edamame.webp', 24:'iriko-mayo.webp', 25:'grilled-chashu.webp',
      29:'beer.webp', 30:'highball.webp', 31:'lemon-sour.webp',
      32:'shochu.webp', 33:'shochu.webp', 34:'shochu.webp',
      35:'cola.webp', 36:'ginger-ale.webp', 37:'orange-juice.webp', 38:'calpis.webp', 39:'oolong-tea.webp'
    };
    function productPhoto(product) {
      if (product.image_url) return `<div class="photo"><img src="${Machi.escapeHtml(product.image_url)}" alt="${Machi.escapeHtml(product.name)}" loading="lazy"></div>`;
      const photo = menuPhotos[Number(product.id)];
      if (!photo) return '<div class="photo">商品写真<br>準備中</div>';
      return `<div class="photo"><img src="/assets/menu-items/web/${photo}" alt="${Machi.escapeHtml(product.name)}" width="720" height="720" loading="lazy" decoding="async"></div>`;
    }
    function optionDetails(ids) {
      const found = [];
      for (const id of ids) for (const group of data.option_groups || []) {
        const option = (group.options || []).find((item) => Number(item.id) === Number(id));
        if (option) found.push(option);
      }
      return found;
    }
    function optionDelta() { return optionDetails(Object.values(selected).flat()).reduce((sum, item) => sum + Number(item.price_delta || 0), 0); }
    function orderingMessage() {
      if (data?.ordering?.enabled === false) return '現在、注文受付を一時停止しています。スタッフへお声がけください。';
      if (data?.ordering?.is_open === false) return '現在は営業時間外です。メニューはご覧いただけます。';
      return '';
    }

    async function load() {
      if (!seatToken) throw new Error('席のQRコードから開いてください。');
      data = await Machi.api('menu-api', { params: { t: seatToken }, token: '' });
      $('brand').textContent = data.brand || '博多油そば151';
      $('place').textContent = `${data.store || Machi.store().name} ／ 席 ${data.table || '-'} ／ ${(data.products || []).length}商品`;
      renderMenu();
      schedulePriceBoundaryRefresh();
      if (orderChannel === 'staff') $('menu').insertAdjacentHTML('afterbegin', '<div class="notice"><b>スタッフ口頭注文</b><br>席と注文内容をお客様と確認して送信してください。</div>');
      updateCart();
      showPendingWarning();
    }

    function renderMenu() {
      $('tabs').innerHTML = displayCategories().map((category, index) => `${index === 1 ? '<span class="nav-menu-label">通常メニュー</span>' : ''}<button type="button" class="tab ${index === 0 ? 'active' : ''}" data-cat="${Number(category.id)}" aria-controls="c${Number(category.id)}" aria-pressed="${index === 0}">${Machi.escapeHtml(category.name)}</button>`).join('');
      $('tabs').insertAdjacentHTML('beforeend', '<button type="button" id="open-takeout" class="tab takeout-tab">テイクアウト</button>');
      $('open-takeout').insertAdjacentHTML('beforebegin', '<button type="button" id="open-refill" class="tab refill-tab">おかわり</button>');
      $('tabs').insertAdjacentHTML('beforeend', '<button type="button" id="open-checkout-guide" class="tab checkout-guide-tab">会計案内</button>');
      $('open-refill').onclick = showRefill;
      $('open-checkout-guide').onclick = showCheckoutGuide;
      $('open-takeout').onclick = showTakeout;
      renderHappyOffer();
      const stopped = orderingMessage();
      const orderingNotice = stopped ? `<div class="notice danger"><b>${data.ordering?.enabled === false ? 'ただいま注文受付を停止中です' : 'ただいま営業時間外です'}</b><br>${Machi.escapeHtml(stopped)}</div>` : '';
      $('menu').innerHTML = orderingNotice + displayCategories().map((category, index) => {
        const products = categoryProducts(category);
        return `<section id="c${Number(category.id)}" class="${Number(category.id) === recommendedCategoryId ? 'recommend-section' : ''}">${index === 1 ? '<div class="regular-menu-heading">通常メニュー</div>' : ''}<h2>${Machi.escapeHtml(category.name)}</h2>${Number(category.id) === recommendedCategoryId ? '<p class="recommend-caption">迷ったときの4品</p>' + products.map(recommendationCard).join('') : products.map(productCard).join('')}</section>`;
      }).join('');
      document.querySelectorAll('[data-cat]').forEach((button) => button.onclick = () => goCategory(Number(button.dataset.cat)));
      document.querySelectorAll('[data-product]').forEach((element) => element.onclick = () => pick(Number(element.dataset.product)));
      observeSections();
    }

    function renderHappyOffer() {
      const offer = $('happy-offer');
      offer.innerHTML = CustomerPromotions.renderHappy(data, Machi.escapeHtml, Machi.yen, alcoholPinned);
      offer.classList.toggle('hidden', !offer.innerHTML);
      offer.classList.toggle('is-pinned', alcoholPinned);
      syncOfferHeight();
      document.querySelectorAll('[data-happy-product]').forEach(button => button.onclick = async () => {
        const id = Number(button.dataset.happyProduct);
        button.disabled = true;
        try {
          data = await Machi.api('menu-api', { params: { t: seatToken }, token: '' });
          renderMenu();
          const product = (alcoholPinned ? CustomerPromotions.alcoholDrinks(data) : CustomerPromotions.happyDrinks(data)).find(item => Number(item.id) === id);
          if (!product || orderingMessage()) return alert('価格・受付状況が変わりました。最新のメニューをご確認ください。');
          pick(id);
          if (!productGroups(product).length) {
            addItem();
            if ($('happy-added')) $('happy-added').textContent = `${product.name}をカートに追加しました`;
          }
        } catch {
          alert('メニューを確認できませんでした。通信状態をご確認ください。');
        } finally { if (button.isConnected) button.disabled = false; }
      });
      if ($('happy-view-all')) $('happy-view-all').onclick = () => {
        const category = displayCategories().find(item => item.name === 'アルコール');
        if (category) goCategory(Number(category.id));
      };
    }

    function showRefill() {
      const categories = displayCategories().filter(c => ['アルコール', 'ソフトドリンク'].includes(c.name));
      $('modal').className = 'modal';
      $('modal').innerHTML = `<div class="sheet"><h2>おかわりはいかがですか？</h2><p>飲みたいものを選んで、カートからご注文ください。</p>${categories.map(c => `<button type="button" class="choice" data-refill-category="${Number(c.id)}">${Machi.escapeHtml(c.name)}を見る →</button>`).join('')}<button type="button" id="close-modal" class="choice">メニューへ戻る</button></div>`;
      $('modal').querySelectorAll('[data-refill-category]').forEach(button => button.onclick = () => { closeModal(); goCategory(Number(button.dataset.refillCategory)); });
      $('close-modal').onclick = closeModal;
    }
    function showCheckoutGuide() {
      $('modal').className = 'modal';
      $('modal').innerHTML = `<div class="sheet"><h2>お会計のご案内</h2><p>お会計はスタッフへお声がけください。</p><p class="desc">この画面からのスタッフ呼び出し・決済は行われません。</p>${cart.length ? '<div class="notice">カートにまだ注文していない商品があります。お会計前に内容をご確認ください。</div><button type="button" id="checkout-review-cart" class="choice">カートを確認する</button>' : ''}<button type="button" id="close-modal" class="choice">メニューへ戻る</button></div>`;
      if ($('checkout-review-cart')) $('checkout-review-cart').onclick = showCart;
      $('close-modal').onclick = closeModal;
    }
    function showTakeout() {
      const supported = data.store === '長浜店';
      $('modal').className = 'modal';
      $('modal').innerHTML = `<div class="sheet"><h2>おうちへのおみやげに</h2><p>油そばやご飯ものを、ご家族にも。</p><div class="notice">持ち帰りは店内注文と別の注文・会計です。受取時刻を指定して注文できます。店内のカートはこの画面に残ります。</div>${supported ? '<p>商品の持ち帰り可否・容器代はスタッフにご確認ください。</p><a class="order takeout-link" href="/takeout.html?store_id=' + Number(data.store.id) + '" target="_blank" rel="noopener">持ち帰りメニューを開く（別画面）</a>' : '<div class="notice">この店舗の持ち帰り注文は、スタッフへお声がけください。</div>'}<button id="close-modal" class="choice">店内メニューへ戻る</button></div>`;
      $('close-modal').onclick = closeModal;
    }
    function recommendationCard(product) {
      const sold = product.sale_status !== 'available' || Boolean(orderingMessage());
      return `<button type="button" class="recommend-item" ${sold ? 'disabled' : `data-product="${Number(product.id)}"`}>${productPhoto(product)}<span class="recommend-copy"><b>${Machi.escapeHtml(product.name)}</b><span>${Machi.yen(product.price)}${sold ? '・現在注文できません' : ''}</span></span><span aria-hidden="true">›</span></button>`;
    }
    function productCard(product) {
      const sold = product.sale_status !== 'available';
      return `<article class="card ${sold ? 'sold' : ''}" ${sold ? '' : `data-product="${Number(product.id)}"`}><div class="row">${productPhoto(product)}<div class="product"><div class="name">${Machi.escapeHtml(product.name)}</div>${product.description ? `<div class="desc">${Machi.escapeHtml(product.description)}</div>` : ''}<div class="desc">${sold ? '本日売り切れ' : 'タップして選択'}</div></div><div class="pricebox">${priceDisplay(product)}<button class="add" ${sold ? 'disabled' : ''}>${sold ? '売切' : '選ぶ'}</button></div></div></article>`;
    }

    function priceDisplay(product) {
      if (product.price_type !== 'happy_hour' || Number(product.regular_price) <= Number(product.price)) return `<div class="price">${Machi.yen(product.price)}</div>`;
      return `<s class="regular-price">通常 ${Machi.yen(product.regular_price)}</s><span class="happy-label">HAPPY HOUR</span><div class="price happy-price">${Machi.yen(product.price)}</div>`;
    }

    function schedulePriceBoundaryRefresh() {
      const parts = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).formatToParts(new Date()).filter((part) => part.type !== 'literal').map((part) => [part.type, Number(part.value)]));
      const seconds = parts.hour * 3600 + parts.minute * 60 + parts.second;
      const times = (data.price_schedules || []).flatMap(rule => [rule.start_time, rule.end_time]).filter(Boolean);
      const edges = times.length ? times.map(time => Number(time.slice(0, 2)) * 3600 + Number(time.slice(3, 5)) * 60) : [11 * 3600, 22 * 3600];
      const boundaries = [...new Set([...edges, ...edges.map(edge => edge + 24 * 3600), 24 * 3600])].sort((a, b) => a - b);
      const next = boundaries.find((boundary) => boundary > seconds);
      setTimeout(() => location.reload(), Math.max(1000, (next - seconds) * 1000 + 1500));
    }

    function setActiveCategory(id) {
      document.querySelectorAll('[data-cat]').forEach((button) => {
        const active = Number(button.dataset.cat) === id;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
    }
    function goCategory(id) {
      setActiveCategory(id);
      const target = $(`c${id}`);
      const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
      if (target) window.scrollTo({ top: Math.max(0, scrollY + target.getBoundingClientRect().top - 12 - (alcoholPinned ? $('happy-offer').getBoundingClientRect().height : 0)), behavior: reducedMotion ? 'auto' : 'smooth' });
    }
    let stopObservingSections = null;
    function observeSections() {
      if (stopObservingSections) stopObservingSections();
      const sections = [...document.querySelectorAll('#menu > section[id^="c"]')];
      let frame = null;
      const update = () => {
        frame = null;
        if (!sections.length) return;
        let active = sections[0];
        for (const section of sections) {
          if (section.getBoundingClientRect().top <= 24) active = section;
        }
        if (scrollY > 0 && scrollY + innerHeight >= document.documentElement.scrollHeight - 2) {
          active = sections[sections.length - 1];
        }
        setActiveCategory(Number(active.id.slice(1)));
      };
      const schedule = () => { if (frame === null) frame = requestAnimationFrame(update); };
      addEventListener('scroll', schedule, { passive: true });
      addEventListener('resize', schedule);
      stopObservingSections = () => {
        removeEventListener('scroll', schedule);
        removeEventListener('resize', schedule);
        if (frame !== null) cancelAnimationFrame(frame);
      };
      update();
    }

    function pick(id) {
      current = data.products.find((product) => Number(product.id) === id);
      if (!current) return;
      if (isTopping(current)) return showToppingTargets(current);
      selected = {};
      productGroups(current).forEach((group) => selected[group.id] = []);
      quantity = 1;
      drawProduct();
    }
    function linkedTopping(product, topping) {
      for (const group of productGroups(product)) {
        const option = (group.options || []).find(item => Number(item.source_product_id) === Number(topping.id) ||
          (Number(topping.id) === 10 && group.name === '高菜の量' && item.name === '高菜大盛り'));
        if (option && option.available !== false) return { group, option };
      }
      return null;
    }
    function showToppingTargets(topping) {
      const bowls = (data.products || []).filter(product => Number(product.category_id) === 1 && product.sale_status === 'available' && linkedTopping(product, topping));
      const targets = cart.map((item, index) => ({ item, index, product: bowls.find(product => Number(product.id) === Number(item.product_id)) })).filter(target => target.product);
      $('modal').className = 'modal';
      $('modal').innerHTML = `<div class="sheet"><h2>${Machi.escapeHtml(topping.name)}</h2><p>追加する油そばを選んでください。</p>${targets.length ? '<h3>カートの一杯に追加</h3>' : ''}${targets.map(({ item, index, product }) => {
        const link = linkedTopping(product, topping);
        const exists = item.option_ids.includes(Number(link.option.id));
        return `<button class="choice" data-target-cart="${index}" ${exists ? 'disabled' : ''}>${Machi.escapeHtml(item.name)}<span class="desc">${item.option_names.map(Machi.escapeHtml).join(' ／ ')}</span><br>${exists ? '追加済み' : `1杯に追加 ＋${Machi.yen(link.option.price_delta)}`}</button>`;
      }).join('')}<h3>油そばを新しく選ぶ</h3>${bowls.map(product => `<button class="choice" data-target-new="${Number(product.id)}">${Machi.escapeHtml(product.name)}</button>`).join('')}<p class="desc">注文済みの油そばへの追加は、スタッフへお声がけください。</p><button id="close-modal" class="choice">戻る</button></div>`;
      document.querySelectorAll('[data-target-cart]').forEach(button => button.onclick = () => {
        addToppingToCart(Number(button.dataset.targetCart), topping);
      });
      document.querySelectorAll('[data-target-new]').forEach(button => button.onclick = () => {
        pick(Number(button.dataset.targetNew));
        const { group, option } = linkedTopping(current, topping);
        CustomerOptions.toggle(productGroups(current), selected, Number(group.id), Number(option.id));
        drawProduct();
      });
      $('close-modal').onclick = closeModal;
    }
    function addToppingToCart(index, topping) {
      const item = cart[index];
      const product = data.products.find(value => Number(value.id) === Number(item?.product_id));
      if (!item || !product || product.sale_status !== 'available' || topping.sale_status !== 'available') return;
      const link = linkedTopping(product, topping);
      if (!link || item.option_ids.includes(Number(link.option.id))) return;
      const groups = productGroups(product);
      const choices = Object.fromEntries(groups.map(group => [group.id, (item.option_ids || []).filter(id => (group.options || []).some(option => Number(option.id) === Number(id))).map(Number)]));
      if (!CustomerOptions.toggle(groups, choices, Number(link.group.id), Number(link.option.id))) return;
      const error = CustomerOptions.validate(groups, choices);
      if (error) return alert(error);
      const optionIds = Object.values(choices).flat();
      const changed = { ...item, quantity: 1, option_ids: optionIds, option_names: optionDetails(optionIds).map(option => option.name), price: Number(product.price) + optionDetails(optionIds).reduce((sum, option) => sum + Number(option.price_delta || 0), 0) };
      if (Number(item.quantity) > 1) { item.quantity = Number(item.quantity) - 1; cart.push(changed); }
      else cart[index] = changed;
      saveCart(); updateCart(); showCart();
    }
    function drawProduct() {
      const top = $('modal').querySelector('.product-scroll')?.scrollTop || 0;
      const left = $('modal').querySelector('.topping-strip')?.scrollLeft || 0;
      const unit = Number(current.price) + optionDelta();
      $('modal').className = 'modal';
      $('modal').innerHTML = `<div class="sheet product-sheet"><div class="product-heading"><h2>${Machi.escapeHtml(current.name)}</h2><button id="close-modal" class="product-dismiss" aria-label="商品選択を閉じる">×</button></div><div class="product-scroll">${CustomerOptions.render(productGroups(current), selected, Machi.escapeHtml, Machi.yen)}<p class="desc">変更内容はこの一杯に反映します。数量を増やすとすべて同じ内容です。内容を変える場合は別々に追加してください。</p></div><div class="product-actions"><div class="qtyrow" aria-label="数量"><button class="mini" data-qty="-1" aria-label="数量を減らす">−</button><b>${quantity}</b><button class="mini" data-qty="1" aria-label="数量を増やす">＋</button></div><button id="add-item" class="order product-add"><span>${Machi.yen(unit * quantity)}</span><span>カートに追加</span></button></div></div>`;
      document.querySelectorAll('[data-group]').forEach((button) => button.onclick = () => toggleOption(Number(button.dataset.group), Number(button.dataset.option), Number(button.dataset.max)));
      document.querySelectorAll('[data-qty]').forEach((button) => button.onclick = () => { quantity = Math.max(1, Math.min(20, quantity + Number(button.dataset.qty))); drawProduct(); });
      $('modal').querySelector('.product-scroll').scrollTop = top;
      const strip = $('modal').querySelector('.topping-strip');
      if (strip) strip.scrollLeft = left;
      const ingredient = $('modal').querySelector('.ingredient-options');
      if (ingredient) {
        $('modal').querySelector('.product-actions').insertAdjacentHTML('beforebegin', '<button type="button" class="ingredient-jump">ネギ・キクラゲ・高菜の量／抜きを選ぶ <span aria-hidden="true">↓</span></button>');
        $('modal').querySelector('.ingredient-jump').onclick = () => ingredient.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      $('add-item').onclick = addItem;
      $('close-modal').onclick = closeModal;
    }
    function toggleOption(groupId, optionId) {
      const top = $('modal').querySelector('.product-scroll').scrollTop;
      const left = $('modal').querySelector('.topping-strip')?.scrollLeft || 0;
      if (!CustomerOptions.toggle(productGroups(current), selected, groupId, optionId)) return;
      drawProduct();
      $('modal').querySelector('.product-scroll').scrollTop = top;
      const strip = $('modal').querySelector('.topping-strip');
      if (strip) strip.scrollLeft = left;
    }
    function addItem() {
      const error = CustomerOptions.validate(productGroups(current), selected);
      if (error) return alert(error);
      const optionIds = Object.values(selected).flat();
      cart.push({ product_id: current.id, quantity, option_ids: optionIds, option_names: optionDetails(optionIds).map((item) => item.name), name: current.name, price: Number(current.price) + optionDelta() });
      saveCart();
      updateCart();
      closeModal();
      showAddedNotice(current);
    }

    let addedNoticeTimer;
    function showAddedNotice(product) {
      clearTimeout(addedNoticeTimer);
      $('added-notice')?.remove();
      const notice = document.createElement('aside');
      notice.id = 'added-notice';
      notice.className = 'added-notice';
      notice.innerHTML = `<p role="status">✓ ${Machi.escapeHtml(product.name)}を追加しました</p><button type="button" class="added-review">カートを見る</button><button type="button" class="added-dismiss" aria-label="追加のお知らせを閉じる">×</button>`;
      document.querySelector('main').insertAdjacentElement('beforebegin', notice);
      notice.querySelector('.added-dismiss').onclick = () => notice.remove();
      notice.querySelector('.added-review').onclick = showCart;
      addedNoticeTimer = setTimeout(() => notice.remove(), 4000);
    }
    function updateCart() {
      const count = cart.reduce((sum, item) => sum + Number(item.quantity), 0);
      const total = cart.reduce((sum, item) => sum + Number(item.price) * Number(item.quantity), 0);
      $('cartbar').classList.toggle('hidden', !count);
      $('sum').textContent = `${count}点　${Machi.yen(total)}`;
    }
    function showCart() {
      $('added-notice')?.remove();
      const total = cart.reduce((sum, item) => sum + Number(item.price) * Number(item.quantity), 0);
      $('modal').className = 'modal';
      const stopped = orderingMessage();
      $('modal').innerHTML = `<div class="sheet"><h2>ご注文内容</h2>${cart.map((item, index) => `<div class="card row"><div><b>${Machi.escapeHtml(item.name)}</b>${item.option_names?.length ? `<div class="desc">${item.option_names.map(Machi.escapeHtml).join(' / ')}</div>` : ''}<div>${item.quantity}点 × ${Machi.yen(item.price)}</div><div class="qtyrow"><button class="mini" data-cart-qty="${index}:-1">−</button><b>${item.quantity}</b><button class="mini" data-cart-qty="${index}:1">＋</button></div></div><button class="mini" data-remove="${index}">削除</button></div>`).join('')}<h2>合計 ${Machi.yen(total)}</h2>${stopped ? `<div class="notice danger">${Machi.escapeHtml(stopped)}</div>` : ''}<button id="send-order" class="order" ${stopped ? 'disabled' : ''}>${stopped ? '現在は注文できません' : 'この内容で注文する'}</button><button id="close-modal" class="choice">戻る</button></div>`;
      document.querySelectorAll('[data-cart-qty]').forEach((button) => button.onclick = () => { const [index, delta] = button.dataset.cartQty.split(':').map(Number); cart[index].quantity = Math.max(0, Number(cart[index].quantity) + delta); if (!cart[index].quantity) cart.splice(index, 1); saveCart(); updateCart(); showCart(); });
      document.querySelectorAll('[data-remove]').forEach((button) => button.onclick = () => { cart.splice(Number(button.dataset.remove), 1); saveCart(); updateCart(); showCart(); });
      $('send-order').onclick = order;
      $('close-modal').onclick = closeModal;
    }

    async function order() {
      if (!cart.length || sending) return;
      if (orderingMessage()) return alert(orderingMessage());
      if (testMode) return showSuccess({ test: true });
      if (!navigator.onLine) return alert('オフラインです。通信が戻ってから注文してください。');
      if (localStorage.getItem(pendingKey)) return showPendingWarning(true);
      if (!confirm('この内容で注文を確定しますか？')) return;
      sending = true;
      const button = $('send-order');
      button.disabled = true;
      button.textContent = '送信中…';
      const requestId = Machi.createId('customer');
      localStorage.setItem(pendingKey, JSON.stringify({ request_id: requestId, created_at: new Date().toISOString(), items: cart }));
      try {
        const payload = { token: seatToken, table_id: data.table_id, request_id: requestId, items: cart.map((item) => ({ product_id: item.product_id, quantity: item.quantity, option_ids: item.option_ids })) };
        const result = orderChannel === 'staff'
          ? await Machi.api('staff-order-api', { method: 'POST', body: payload })
          : await Machi.api('menu-api', { method: 'POST', token: '', body: payload });
        pinAlcoholAfterOrder(cart);
        localStorage.removeItem(pendingKey);
        cart = [];
        saveCart();
        updateCart();
        showSuccess(result);
      } catch (error) {
        showAmbiguousFailure(error);
      } finally { sending = false; }
    }
    function showSuccess(result) {
      $('modal').className = 'modal';
      $('modal').innerHTML = `<div class="sheet"><div class="success">✓</div><h2 style="text-align:center">${result.test ? 'テスト確認OK' : 'ご注文ありがとうございます！'}</h2><div class="card">${result.test ? '実注文は送信していません。' : `注文番号 #${Machi.escapeHtml(result.order_id || '-')}${result.total !== undefined ? `<br><b>合計 ${Machi.yen(result.total)}</b>` : ''}<br>厨房へ注文を送信しました。`}</div><button id="close-modal" class="order">メニューへ戻る</button></div>`;
      $('close-modal').onclick = closeModal;
    }
    function showAmbiguousFailure(error) {
      $('modal').className = 'modal';
      $('modal').innerHTML = `<div class="sheet"><div class="notice danger"><b>注文状況を確認しています</b><br>二重注文防止のため、自動で再送信はしません。店員に画面を見せて、厨房へ届いているか確認してください。</div><div class="desc">${Machi.escapeHtml(error.message)}</div><button id="checked-order" class="order">店員と確認した</button></div>`;
      $('checked-order').onclick = () => { localStorage.removeItem(pendingKey); closeModal(); showCart(); };
    }
    function showPendingWarning(force) {
      if (!localStorage.getItem(pendingKey)) return;
      if (force) alert('直前の注文が厨房へ届いている可能性があります。店員に確認してください。');
      $('menu').insertAdjacentHTML('afterbegin', '<div class="notice danger"><b>直前の注文を確認中です。</b><br>二重送信を防ぐため、店員へお声がけください。</div>');
    }
    function closeModal() { $('modal').className = 'hidden'; $('modal').innerHTML = ''; }
    $('open-cart').onclick = showCart;
    load().catch((error) => {
      $('brand').textContent = '読み込みできませんでした';
      $('menu').innerHTML = `<div class="card"><div class="name">${Machi.escapeHtml(error.message)}</div><button class="retry" onclick="location.reload()">再読み込み</button></div>`;
    });
    Machi.registerServiceWorker();
  })();
  </script>
</body>
</html>
