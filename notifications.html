=d.toISOString().slice(0,10),e=new Date(d);e.setDate(e.getDate()+30);let r=await fetch(A+'&from='+f+'&to='+e.toISOString().slice(0,10),{headers:{Authorization:'Bearer '+localStorage.mo_staff_token}}),j=await r.json(),ns=j.planning?.notifications||[];l.innerHTML=ns.map(n=>`<div class=c><b>${n.title}</b><p>${n.body||''}</p><button onclick="read(${n.id})">確認した</button></div>`).join('')||'<div class=c>新しいお知らせはありません</div>'}async function read(id){await post({action:'notification_read',notification_id:id});load()}load()</script></html>
