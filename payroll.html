<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <title>シフト・勤怠・給与｜MACHI ORDER</title>
    <link rel="stylesheet" href="/machi-design-system.css" />
    <script src="/machi-ui-config.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f2ed;
        color: #171717;
        font-family:
          -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      }
      .top {
        background: #171717;
        color: #fff;
        padding: 22px 18px;
      }
      .top a {
        color: #fff;
        text-decoration: none;
      }
      .top h1 {
        margin: 12px 0 3px;
        font-size: 28px;
      }
      .wrap {
        max-width: 900px;
        margin: auto;
        padding: 14px 14px 100px;
      }
      .panel,
      .card,
      .modalbox {
        background: #fff;
        border: 1px solid #e5dfd8;
        border-radius: 20px;
        padding: 16px;
        margin: 10px 0;
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .controls input,
      .controls select,
      .field input,
      .field select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 12px;
        font-size: 16px;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .stat {
        background: #fff;
        border-radius: 16px;
        padding: 13px;
      }
      .stat small {
        display: block;
        color: #777;
        font-weight: 700;
      }
      .stat b {
        display: block;
        font-size: 22px;
        margin-top: 4px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .name {
        font-size: 20px;
        font-weight: 900;
      }
      .pay {
        font-size: 21px;
        font-weight: 950;
      }
      .muted {
        color: #777;
        font-size: 13px;
      }
      .shift {
        background: #f6f3ef;
        border-radius: 12px;
        padding: 10px;
        margin-top: 8px;
      }
      .btn {
        border: 0;
        border-radius: 12px;
        padding: 11px 14px;
        font-weight: 900;
      }
      .primary {
        background: #171717;
        color: #fff;
      }
      .red {
        background: #d92d2d;
        color: #fff;
      }
      .full {
        width: 100%;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: #0008;
        z-index: 30;
        padding: 18px;
        overflow: auto;
      }
      .modal.open {
        display: block;
      }
      .modalbox {
        max-width: 540px;
        margin: 25px auto;
      }
      .field {
        margin: 12px 0;
      }
      .field label {
        display: block;
        font-weight: 800;
        margin-bottom: 5px;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .actions .btn {
        flex: 1;
      }
      .msg {
        min-height: 24px;
        color: #b42318;
        font-weight: 800;
      }
      .badge {
        display: inline-block;
        border-radius: 999px;
        background: #eee;
        padding: 4px 8px;
        font-size: 12px;
        font-weight: 800;
      }
      @media (max-width: 600px) {
        .summary {
          grid-template-columns: 1fr 1fr;
        }
        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <a href="/staff-management.html">← スタッフ名簿</a>
      <h1>シフト・勤怠・給与</h1>
      <div>予定と実働を分けて、月の人件費を確認</div>
    </header>
    <main class="wrap">
      <section class="panel">
        <div class="controls">
          <input id="month" type="month" /><select id="store"></select>
        </div>
        <button class="btn red full" id="newShift" style="margin-top: 10px">
          ＋ シフトを追加
        </button>
      </section>
      <section class="summary">
        <div class="stat"><small>給与実績</small><b id="actualPay">—</b></div>
        <div class="stat">
          <small>予定人件費</small><b id="scheduledPay">—</b>
        </div>
        <div class="stat"><small>実働</small><b id="actualHours">—</b></div>
        <div class="stat">
          <small>予定時間</small><b id="scheduledHours">—</b>
        </div>
      </section>
      <div id="msg" class="msg"></div>
      <div id="list"></div>
    </main>
    <div class="modal" id="shiftModal">
      <div class="modalbox">
        <h2>シフト登録</h2>
        <input type="hidden" id="shiftId" />
        <div class="field">
          <label>スタッフ</label
          ><select id="staff"></select>
        </div>
        <div class="field">
          <label>店舗</label
          ><select id="shiftStore"></select>
        </div>
        <div class="field">
          <label>日付</label><input id="date" type="date" />
        </div>
        <div class="controls">
          <div class="field">
            <label>開始</label><input id="start" type="time" />
          </div>
          <div class="field">
            <label>終了</label><input id="end" type="time" />
          </div>
        </div>
        <div class="msg" id="shiftMsg"></div>
        <div class="actions">
          <button class="btn close">閉じる</button
          ><button class="btn primary" id="saveShift">保存</button>
        </div>
      </div>
    </div>
    <div class="modal" id="attendanceModal">
      <div class="modalbox">
        <h2>勤怠を確定</h2>
        <input type="hidden" id="attendanceId" />
        <div class="field">
          <label>出勤</label><input id="clockIn" type="datetime-local" />
        </div>
        <div class="field">
          <label>退勤</label><input id="clockOut" type="datetime-local" />
        </div>
        <div class="field">
          <label>休憩（分）</label
          ><input id="breakMinutes" type="number" min="0" value="0" />
        </div>
        <div class="msg" id="attendanceMsg"></div>
        <div class="actions">
          <button class="btn close">閉じる</button
          ><button class="btn primary" id="saveAttendance">確定</button>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const API =
            "https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/payroll-api",
          $ = (s) => document.querySelector(s),
          tok = () =>
            localStorage.machi_access_token ||
            localStorage.mo_staff_token ||
            "",
          yen = (n) => "¥" + Number(n || 0).toLocaleString(),
          hours = (n) => (Number(n || 0) / 60).toFixed(1) + "h",
          esc = (s) =>
            String(s ?? "").replace(
              /[&<>"']/g,
              (c) =>
                ({
                  "&": "&amp;",
                  "<": "&lt;",
                  ">": "&gt;",
                  '"': "&quot;",
                  "'": "&#39;",
                })[c],
            );
        let data = { staff: [], stores: [], summary: {} },
          loadedStores = false;
        if (!tok()) {
          location.replace("/login.html?next=/payroll.html");
          return;
        }
        $("#month").value = new Date().toISOString().slice(0, 7);
        async function api(method = "GET", body) {
          let url = API;
          if (method === "GET")
            url +=
              "?month=" +
              $("#month").value +
              "&store_id=" +
              ($("#store").value || "");
          const r = await fetch(url, {
              method,
              headers: {
                Authorization: "Bearer " + tok(),
                "Content-Type": "application/json",
              },
              body: body ? JSON.stringify(body) : undefined,
            }),
            j = await r.json().catch(() => ({}));
          if (r.status === 401) {
            location.replace("/login.html?next=/payroll.html");
            return;
          }
          if (!r.ok) throw Error(j.error || "処理できません");
          return j;
        }
        function dt(v) {
          return v
            ? new Date(v).toLocaleString("ja-JP", {
                month: "numeric",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit",
              })
            : "未入力";
        }
        function localInput(v) {
          if (!v) return "";
          let d = new Date(v),
            z = (n) => String(n).padStart(2, "0");
          return (
            d.getFullYear() +
            "-" +
            z(d.getMonth() + 1) +
            "-" +
            z(d.getDate()) +
            "T" +
            z(d.getHours()) +
            ":" +
            z(d.getMinutes())
          );
        }
        function render() {
          let s = data.summary || {};
          $("#actualPay").textContent = yen(s.actual_pay);
          $("#scheduledPay").textContent = yen(s.scheduled_pay);
          $("#actualHours").textContent = hours(s.actual_minutes);
          $("#scheduledHours").textContent = hours(s.scheduled_minutes);
          $("#list").innerHTML =
            (data.staff || [])
              .map(
                (p) =>
                  `<article class="card"><div class="row"><div><div class="name">${esc(p.display_name)}</div><span class="badge">${p.employment_type === "fixed_salary" ? "固定給" : "時給 " + yen(p.hourly_wage)}</span></div><div style="text-align:right"><div class="pay">${yen(p.actual_pay)}</div><div class="muted">予定 ${yen(p.scheduled_pay)}</div></div></div><div class="muted" style="margin-top:8px">実働 ${hours(p.actual_minutes)} ／ 予定 ${hours(p.scheduled_minutes)}</div>${(p.shifts || []).map((x) => `<div class="shift"><div class="row"><b>${x.shift_date}　${String(x.scheduled_start || "").slice(0, 5)}〜${String(x.scheduled_end || "").slice(0, 5)}</b><span>${esc(data.stores.find((s) => s.id === x.store_id)?.name || "")}</span></div><div class="muted">${x.status === "completed" ? "確定 " + dt(x.clock_in) + "〜" + dt(x.clock_out) : "勤怠未確定"}</div><button class="btn" data-att="${x.id}" style="margin-top:7px">${x.status === "completed" ? "勤怠を修正" : "出退勤を入力"}</button></div>`).join("")}</article>`,
              )
              .join("") ||
            '<div class="panel muted">対象スタッフがいません</div>';
          document
            .querySelectorAll("[data-att]")
            .forEach(
              (b) => (b.onclick = () => openAttendance(Number(b.dataset.att))),
            );
        }
        async function load() {
          try {
            data = await api();
            if (!loadedStores) {
              $("#store").innerHTML =
                '<option value="">全店舗（会社合計）</option>' +
                data.stores
                  .map((s) => `<option value="${s.id}">${esc(s.name)}</option>`)
                  .join("");
              $("#shiftStore").innerHTML = data.stores
                .map((s) => `<option value="${s.id}">${esc(s.name)}</option>`)
                .join("");
              loadedStores = true;
            }
            $("#staff").innerHTML = data.staff
              .map(
                (p) =>
                  `<option value="${p.id}">${esc(p.display_name)}</option>`,
              )
              .join("");
            $("#msg").textContent = "";
            render();
          } catch (e) {
            $("#msg").textContent = e.message;
          }
        }
        function openShift() {
          if (!data.staff.length) return;
          $("#shiftId").value = "";
          $("#date").value = new Date().toISOString().slice(0, 10);
          $("#start").value = "11:00";
          $("#end").value = "15:00";
          $("#shiftMsg").textContent = "";
          $("#shiftModal").classList.add("open");
        }
        async function saveShift() {
          try {
            await api("POST", {
              action: "shift_create",
              staff_id: Number($("#staff").value),
              store_id: Number($("#shiftStore").value),
              shift_date: $("#date").value,
              scheduled_start: $("#start").value,
              scheduled_end: $("#end").value,
            });
            $("#shiftModal").classList.remove("open");
            await load();
          } catch (e) {
            $("#shiftMsg").textContent = e.message;
          }
        }
        function openAttendance(id) {
          const x = data.staff
            .flatMap((p) => p.shifts || [])
            .find((x) => x.id === id);
          if (!x) return;
          $("#attendanceId").value = id;
          $("#clockIn").value =
            localInput(x.clock_in) ||
            x.shift_date + "T" + String(x.scheduled_start).slice(0, 5);
          $("#clockOut").value =
            localInput(x.clock_out) ||
            x.shift_date + "T" + String(x.scheduled_end).slice(0, 5);
          $("#breakMinutes").value = x.break_minutes || 0;
          $("#attendanceMsg").textContent = "";
          $("#attendanceModal").classList.add("open");
        }
        async function saveAttendance() {
          try {
            await api("POST", {
              action: "attendance_save",
              shift_id: Number($("#attendanceId").value),
              clock_in: new Date($("#clockIn").value).toISOString(),
              clock_out: new Date($("#clockOut").value).toISOString(),
              break_minutes: Number($("#breakMinutes").value),
            });
            $("#attendanceModal").classList.remove("open");
            await load();
          } catch (e) {
            $("#attendanceMsg").textContent = e.message;
          }
        }
        $("#newShift").onclick = openShift;
        $("#saveShift").onclick = saveShift;
        $("#saveAttendance").onclick = saveAttendance;
        $("#month").onchange = load;
        $("#store").onchange = load;
        document
          .querySelectorAll(".close")
          .forEach(
            (b) =>
              (b.onclick = () => b.closest(".modal").classList.remove("open")),
          );
        load();
      })();
    </script>
  </body>
</html>
