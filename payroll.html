<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <title>シフト・勤怠・給与｜MACHI ORDER</title>
    <link rel="stylesheet" href="/machi-design-system.css" />
    <script src="/machi-ui-config.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f2ed;
        color: #171717;
        font-family:
          -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      }
      .top {
        background: #171717;
        color: #fff;
        padding: 22px 18px;
      }
      .top a {
        color: #fff;
        text-decoration: none;
      }
      .top h1 {
        margin: 12px 0 3px;
        font-size: 28px;
      }
      .wrap {
        max-width: 900px;
        margin: auto;
        padding: 14px 14px 100px;
      }
      .panel,
      .card,
      .modalbox {
        background: #fff;
        border: 1px solid #e5dfd8;
        border-radius: 20px;
        padding: 16px;
        margin: 10px 0;
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .controls input,
      .controls select,
      .field input,
      .field select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 12px;
        font-size: 16px;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .stat {
        background: #fff;
        border-radius: 16px;
        padding: 13px;
      }
      .stat small {
        display: block;
        color: #777;
        font-weight: 700;
      }
      .stat b {
        display: block;
        font-size: 22px;
        margin-top: 4px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .name {
        font-size: 20px;
        font-weight: 900;
      }
      .pay {
        font-size: 21px;
        font-weight: 950;
      }
      .muted {
        color: #777;
        font-size: 13px;
      }
      .shift {
        background: #f6f3ef;
        border-radius: 12px;
        padding: 10px;
        margin-top: 8px;
      }
      .btn {
        border: 0;
        border-radius: 12px;
        padding: 11px 14px;
        font-weight: 900;
      }
      .primary {
        background: #171717;
        color: #fff;
      }
      .red {
        background: #d92d2d;
        color: #fff;
      }
      .full {
        width: 100%;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: #0008;
        z-index: 30;
        padding: 18px;
        overflow: auto;
      }
      .modal.open {
        display: block;
      }
      .modalbox {
        max-width: 540px;
        margin: 25px auto;
      }
      .field {
        margin: 12px 0;
      }
      .field label {
        display: block;
        font-weight: 800;
        margin-bottom: 5px;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .actions .btn {
        flex: 1;
      }
      .msg {
        min-height: 24px;
        color: #b42318;
        font-weight: 800;
      }
      .badge {
        display: inline-block;
        border-radius: 999px;
        background: #eee;
        padding: 4px 8px;
        font-size: 12px;
        font-weight: 800;
      }
      @media (max-width: 600px) {
        .summary {
          grid-template-columns: 1fr 1fr;
        }
        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <a href="/staff-management.html">← スタッフ名簿</a>
      <h1>シフト・勤怠・給与</h1>
      <p><a href="/shift-review.html">シフト希望を確認・確定する →</a></p>
      <div>予定と実働を分けて、月の人件費を確認</div>
    </header>
    <main class="wrap">
      <section class="panel">
        <div class="controls">
          <input id="month" type="month" /><select id="store"></select>
        </div>
        <button class="btn red full" id="newShift" style="margin-top: 10px">
          ＋ シフトを追加
        </button>
      </section>
      <section class="summary">
        <div class="stat"><small>基本給概算</small><b id="actualPay">—</b></div>
        <div class="stat">
          <small>予定人件費</small><b id="scheduledPay">—</b>
        </div>
        <div class="stat"><small>実働</small><b id="actualHours">—</b></div>
        <div class="stat">
          <small>予定時間</small><b id="scheduledHours">—</b>
        </div>
      </section>
      <p class="muted">
        金額は登録時給・固定給による概算です。割増・控除などを含む最終給与ではありません。
      </p>
      <div id="msg" class="msg"></div>
      <div id="attendanceAlerts" class="panel" role="status" hidden></div>
      <section class="panel">
        <label for="viewMode">表示方法</label>
        <select id="viewMode">
          <option value="staff">スタッフ別</option>
          <option value="date">日付別・店舗別</option></select
        ><button class="btn" id="exportAttendance" disabled>
          勤怠CSVを保存
        </button>
        <p class="muted">
          CSVは選択中の月・店舗の勤怠明細です。個人情報を含むため、管理用に保管してください。
        </p>
      </section>
      <div id="dateList" hidden></div>
      <div id="list"></div>
    </main>
    <div class="modal" id="shiftModal">
      <div class="modalbox">
        <h2>シフト登録</h2>
        <input type="hidden" id="shiftId" />
        <div class="field">
          <label>スタッフ</label
          ><select id="staff"></select>
        </div>
        <div class="field">
          <label>店舗</label
          ><select id="shiftStore"></select>
        </div>
        <div class="field">
          <label>日付</label><input id="date" type="date" />
        </div>
        <div class="controls">
          <div class="field">
            <label>開始</label><input id="start" type="time" />
          </div>
          <div class="field">
            <label>終了</label><input id="end" type="time" />
          </div>
        </div>
        <div class="msg" id="shiftMsg"></div>
        <div class="actions">
          <button class="btn close">閉じる</button
          ><button class="btn primary" id="saveShift">保存</button>
        </div>
      </div>
    </div>
    <div class="modal" id="attendanceModal">
      <div class="modalbox">
        <h2>勤怠を確定</h2>
        <input type="hidden" id="attendanceId" />
        <div class="field">
          <label for="reason">入力・修正の理由</label
          ><input
            id="reason"
            maxlength="300"
            placeholder="退勤の打刻忘れなど"
          />
        </div>
        <div class="field">
          <label>出勤</label><input id="clockIn" type="datetime-local" />
        </div>
        <div class="field">
          <label>退勤</label><input id="clockOut" type="datetime-local" />
        </div>
        <div class="field">
          <label>休憩（分）</label
          ><input id="breakMinutes" type="number" min="0" value="0" />
        </div>
        <div class="msg" id="attendanceMsg"></div>
        <div class="actions">
          <button class="btn close">閉じる</button
          ><button class="btn primary" id="saveAttendance">確定</button>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const API =
            "https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/payroll-api",
          $ = (s) => document.querySelector(s),
          tok = () =>
            localStorage.machi_access_token ||
            localStorage.mo_staff_token ||
            "",
          yen = (n) => "¥" + Number(n || 0).toLocaleString(),
          hours = (n) => (Number(n || 0) / 60).toFixed(1) + "h",
          esc = (s) =>
            String(s ?? "").replace(
              /[&<>"']/g,
              (c) =>
                ({
                  "&": "&amp;",
                  "<": "&lt;",
                  ">": "&gt;",
                  '"': "&quot;",
                  "'": "&#39;",
                })[c],
            );
        let data = { staff: [], stores: [], summary: {} },
          loadedStores = false,
          loadVersion = 0;
        if (!tok()) {
          location.replace("/login.html?next=/payroll.html");
          return;
        }
        $("#month").value = new Date(Date.now() + 9 * 3600000)
          .toISOString()
          .slice(0, 7);
        async function api(method = "GET", body) {
          let url = API;
          if (method === "GET")
            url +=
              "?month=" +
              $("#month").value +
              "&store_id=" +
              ($("#store").value || "");
          const r = await fetch(url, {
              method,
              headers: {
                Authorization: "Bearer " + tok(),
                "Content-Type": "application/json",
              },
              body: body ? JSON.stringify(body) : undefined,
            }),
            j = await r.json().catch(() => ({}));
          if (r.status === 401) {
            location.replace("/login.html?next=/payroll.html");
            return;
          }
          if (!r.ok) throw Error(j.error || "処理できません");
          return j;
        }
        function dt(v) {
          return v
            ? new Date(v).toLocaleString("ja-JP", {
                timeZone: "Asia/Tokyo",
                month: "numeric",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit",
              })
            : "未入力";
        }
        function localInput(v) {
          return v
            ? new Date(new Date(v).getTime() + 9 * 3600000)
                .toISOString()
                .slice(0, 16)
            : "";
        }
        function findShift(id) {
          return data.staff
            .flatMap((p) => p.shifts || [])
            .find((x) => x.id === id);
        }
        function editShift(id) {
          const x = findShift(id);
          if (!x) return;
          openShift();
          $("#shiftId").value = x.id;
          $("#staff").value =
            x.roster_staff_id ||
            data.staff.find((p) => p.shifts.some((s) => s.id === id))?.id;
          $("#shiftStore").value = x.store_id;
          $("#staff").disabled = true;
          $("#shiftStore").disabled = true;
          $("#date").value = x.shift_date;
          $("#start").value = x.scheduled_start?.slice(0, 5) || "";
          $("#end").value = x.scheduled_end?.slice(0, 5) || "";
        }
        async function cancelShift(id) {
          const x = findShift(id);
          if (!x) return;
          const reason = prompt(
            "この勤務予定を取り消す理由を入力してください（2〜300文字）",
          );
          if (reason === null) return;
          try {
            await api("POST", {
              action: "shift_cancel",
              shift_id: id,
              expected_updated_at: x.updated_at,
              reason,
            });
            await load();
          } catch (e) {
            $("#msg").textContent = e.message;
          }
        }
        function render() {
          const today = new Date(Date.now() + 9 * 3600000)
            .toISOString()
            .slice(0, 10);
          const unfinished = data.staff.flatMap((p) =>
            (p.shifts || [])
              .filter((x) => x.shift_date < today && x.status !== "completed")
              .map((x) => ({
                name: p.display_name,
                date: x.shift_date,
                working: !!x.clock_in,
              })),
          );
          $("#attendanceAlerts").hidden = !unfinished.length;
          $("#attendanceAlerts").innerHTML =
            "<b>過去の勤怠を確認：" +
            unfinished.length +
            "件</b>" +
            unfinished
              .map(
                (x) =>
                  "<p>" +
                  esc(x.date) +
                  " " +
                  esc(x.name) +
                  "：" +
                  (x.working ? "退勤が未入力" : "実績が未入力") +
                  "</p>",
              )
              .join("");
          let s = data.summary || {};
          $("#actualPay").textContent = yen(s.actual_pay);
          $("#scheduledPay").textContent = yen(s.scheduled_pay);
          $("#actualHours").textContent = hours(s.actual_minutes);
          $("#scheduledHours").textContent = hours(s.scheduled_minutes);
          $("#list").innerHTML =
            (data.staff || [])
              .map(
                (p) =>
                  `<article class="card"><div class="row"><div><div class="name">${esc(p.display_name)}</div><span class="badge">${p.employment_type === "fixed_salary" ? "固定給" : "時給 " + yen(p.hourly_wage)}</span></div><div style="text-align:right"><div class="pay">${yen(p.actual_pay)}</div><div class="muted">予定 ${yen(p.scheduled_pay)}</div></div></div><div class="muted" style="margin-top:8px">実働 ${hours(p.actual_minutes)} ／ 予定 ${hours(p.scheduled_minutes)}</div>${(p.shifts || []).map((x) => `<div class="shift"><div class="row"><b>${x.shift_date}　${String(x.scheduled_start || "").slice(0, 5)}〜${String(x.scheduled_end || "").slice(0, 5)}</b><span>${esc(data.stores.find((s) => s.id === x.store_id)?.name || "")}</span></div><div class="muted">${x.status === "completed" ? "確定 " + dt(x.clock_in) + "〜" + dt(x.clock_out) : "勤怠未確定"}</div><button class="btn" data-att="${x.id}" style="margin-top:7px">${x.status === "completed" ? "勤怠を修正" : "出退勤を入力"}</button>${x.status === "scheduled" && !x.clock_in ? ` <button class="btn" data-edit="${x.id}">予定を変更</button> <button class="btn" data-cancel="${x.id}">取消</button>` : ""}</div>`).join("")}</article>`,
              )
              .join("") ||
            '<div class="panel muted">対象スタッフがいません</div>';
          document
            .querySelectorAll("[data-att]")
            .forEach(
              (b) => (b.onclick = () => openAttendance(Number(b.dataset.att))),
            );
        }
        async function load() {
          const version = ++loadVersion;
          $("#exportAttendance").disabled = true;
          $("#list").innerHTML = "";
          $("#dateList").innerHTML = "";
          $("#attendanceAlerts").hidden = true;
          try {
            const fresh = await api();
            if (version !== loadVersion || !fresh) return;
            data = fresh;
            if (!loadedStores) {
              $("#store").innerHTML =
                '<option value="">全店舗（会社合計）</option>' +
                data.stores
                  .map((s) => `<option value="${s.id}">${esc(s.name)}</option>`)
                  .join("");
              $("#shiftStore").innerHTML = data.stores
                .map((s) => `<option value="${s.id}">${esc(s.name)}</option>`)
                .join("");
              loadedStores = true;
            }
            $("#staff").innerHTML = data.staff
              .map(
                (p) =>
                  `<option value="${p.id}">${esc(p.display_name)}</option>`,
              )
              .join("");
            $("#msg").textContent = "";
            render();
            renderDates();
            $("#exportAttendance").disabled = false;
          } catch (e) {
            if (version !== loadVersion) return;
            $("#msg").textContent = e.message;
          }
        }
        function openShift() {
          $("#staff").disabled = false;
          $("#shiftStore").disabled = false;
          if (!data.staff.length) return;
          $("#shiftId").value = "";
          $("#date").value = new Date(Date.now() + 9 * 3600000)
            .toISOString()
            .slice(0, 10);
          $("#start").value = "11:00";
          $("#end").value = "15:00";
          $("#shiftMsg").textContent = "";
          $("#shiftModal").classList.add("open");
        }
        async function saveShift() {
          $("#saveShift").disabled = true;
          try {
            await api("POST", {
              action: $("#shiftId").value ? "shift_update" : "shift_create",
              shift_id: Number($("#shiftId").value) || undefined,
              expected_updated_at: findShift(Number($("#shiftId").value))
                ?.updated_at,
              staff_id: Number($("#staff").value),
              store_id: Number($("#shiftStore").value),
              shift_date: $("#date").value,
              scheduled_start: $("#start").value,
              scheduled_end: $("#end").value,
            });
            $("#shiftModal").classList.remove("open");
            await load();
          } catch (e) {
            $("#shiftMsg").textContent = e.message;
          } finally {
            $("#saveShift").disabled = false;
          }
        }
        function openAttendance(id) {
          const x = data.staff
            .flatMap((p) => p.shifts || [])
            .find((x) => x.id === id);
          if (!x) return;
          $("#attendanceId").value = id;
          $("#reason").value = "";
          $("#clockIn").value =
            localInput(x.clock_in) ||
            x.shift_date + "T" + String(x.scheduled_start).slice(0, 5);
          $("#clockOut").value =
            localInput(x.clock_out) ||
            x.shift_date + "T" + String(x.scheduled_end).slice(0, 5);
          $("#breakMinutes").value = x.break_minutes || 0;
          $("#attendanceMsg").textContent = "";
          $("#attendanceModal").classList.add("open");
        }
        async function saveAttendance() {
          $("#saveAttendance").disabled = true;
          try {
            await api("POST", {
              action: "attendance_save",
              shift_id: Number($("#attendanceId").value),
              expected_updated_at: findShift(Number($("#attendanceId").value))
                ?.updated_at,
              reason: $("#reason").value,
              clock_in: new Date($("#clockIn").value + "+09:00").toISOString(),
              clock_out: new Date(
                $("#clockOut").value + "+09:00",
              ).toISOString(),
              break_minutes: Number($("#breakMinutes").value),
            });
            $("#attendanceModal").classList.remove("open");
            await load();
          } catch (e) {
            $("#attendanceMsg").textContent = e.message;
          } finally {
            $("#saveAttendance").disabled = false;
          }
        }
        $("#list").addEventListener("click", (e) => {
          const edit = e.target.closest("[data-edit]"),
            cancel = e.target.closest("[data-cancel]");
          if (edit) editShift(Number(edit.dataset.edit));
          if (cancel) cancelShift(Number(cancel.dataset.cancel));
        });

        function shiftRows() {
          return (data.staff || [])
            .flatMap((p) =>
              (p.shifts || []).map((x) => ({
                ...x,
                staff_name: p.display_name,
              })),
            )
            .sort(
              (a, b) =>
                a.shift_date.localeCompare(b.shift_date) ||
                a.store_id - b.store_id ||
                String(a.scheduled_start || "").localeCompare(
                  String(b.scheduled_start || ""),
                ) ||
                a.staff_name.localeCompare(b.staff_name, "ja"),
            );
        }
        const stateLabel = (x) =>
          ({
            scheduled: "勤務予定",
            working: "勤務中",
            completed: "勤怠確定",
            cancelled: "取消",
          })[x.status] || x.status;
        function renderDates() {
          const rows = shiftRows(),
            groups = new Map();
          for (const x of rows) {
            const key = x.shift_date + "|" + x.store_id;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(x);
          }
          $("#dateList").innerHTML =
            Array.from(groups.values())
              .map((xs) => {
                const x = xs[0],
                  weekday = new Date(
                    x.shift_date + "T12:00:00+09:00",
                  ).toLocaleDateString("ja-JP", {
                    timeZone: "Asia/Tokyo",
                    weekday: "short",
                  });
                return (
                  '<article class="card"><h2>' +
                  esc(x.shift_date) +
                  "（" +
                  esc(weekday) +
                  "） " +
                  esc(
                    data.stores.find((s) => s.id === x.store_id)?.name || "",
                  ) +
                  '</h2><div class="muted">登録 ' +
                  new Set(
                    xs.map((s) => s.staff_id || s.roster_staff_id || s.user_id),
                  ).size +
                  "人・" +
                  xs.length +
                  "枠</div>" +
                  xs
                    .map(
                      (s) =>
                        '<div class="shift"><b>' +
                        esc(s.staff_name) +
                        "</b> " +
                        esc(
                          (s.scheduled_start || "").slice(0, 5) +
                            "〜" +
                            (s.scheduled_end || "").slice(0, 5),
                        ) +
                        ' <span class="badge">' +
                        esc(stateLabel(s)) +
                        "</span></div>",
                    )
                    .join("") +
                  "</article>"
                );
              })
              .join("") ||
            '<div class="panel">この月・店舗に登録されたシフトはありません。</div>';
          $("#dateList").hidden = $("#viewMode").value !== "date";
          $("#list").hidden = $("#viewMode").value === "date";
        }
        function csvCell(value) {
          let s = String(value ?? "");
          if (/^[\s]*[=+@-]/.test(s) || /^[\t\r\n]/.test(s)) s = "'" + s;
          return '"' + s.replace(/"/g, '""') + '"';
        }
        function exportAttendance() {
          const rows = shiftRows();
          const table = [
            [
              "勤務日",
              "店舗",
              "スタッフ",
              "予定開始",
              "予定終了",
              "出勤（日本時間）",
              "退勤（日本時間）",
              "休憩分",
              "実働分",
              "状態",
            ],
          ];
          for (const x of rows) {
            const complete = x.clock_in && x.clock_out;
            const minutes = complete
              ? Math.max(
                  0,
                  Math.round(
                    (new Date(x.clock_out) - new Date(x.clock_in)) / 60000,
                  ) - Number(x.break_minutes || 0),
                )
              : "";
            table.push([
              x.shift_date,
              data.stores.find((s) => s.id === x.store_id)?.name || "",
              x.staff_name,
              (x.scheduled_start || "").slice(0, 5),
              (x.scheduled_end || "").slice(0, 5),
              localInput(x.clock_in).replace("T", " "),
              localInput(x.clock_out).replace("T", " "),
              x.break_minutes,
              minutes,
              stateLabel(x),
            ]);
          }
          const blob = new Blob(
            [
              "\uFEFF" +
                table.map((row) => row.map(csvCell).join(",")).join("\r\n"),
            ],
            { type: "text/csv;charset=utf-8" },
          );
          const url = URL.createObjectURL(blob),
            a = document.createElement("a");
          a.href = url;
          a.download =
            "machi-attendance-" +
            data.month +
            "-" +
            (data.store_id || "all") +
            ".csv";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        }
        $("#exportAttendance").onclick = exportAttendance;
        $("#viewMode").onchange = renderDates;

        $("#newShift").onclick = openShift;
        $("#saveShift").onclick = saveShift;
        $("#saveAttendance").onclick = saveAttendance;
        $("#month").onchange = load;
        $("#store").onchange = load;
        document
          .querySelectorAll(".close")
          .forEach(
            (b) =>
              (b.onclick = () => b.closest(".modal").classList.remove("open")),
          );
        load();
      })();
    </script>
  </body>
</html>
