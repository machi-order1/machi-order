<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/machi-design-system.css"><title>口頭注文｜MACHI ORDER</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.top{background:#111;color:#fff;padding:22px 18px}.brand{font-size:11px;letter-spacing:.15em;color:#aaa;font-weight:800}.top h1{font-size:28px;margin:6px 0}.top p{margin:0;color:#ccc}.wrap{max-width:720px;margin:auto;padding:16px 14px 90px}.card{background:#fff;border:1px solid #e5e5df;border-radius:20px;padding:17px;margin:12px 0}.seat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.seat{min-height:82px;border:2px solid #171717;background:#fff;border-radius:16px;padding:13px;font-size:18px;font-weight:900;text-align:left}.seat small{display:block;color:#666;font-size:11px;margin-top:5px}.primary,.secondary{width:100%;min-height:50px;border:0;border-radius:13px;padding:12px 14px;font-weight:900;font-size:16px}.primary{background:#111;color:#fff}.secondary{background:#eee;color:#222}label{display:block;font-weight:800;margin:12px 0 5px}input{width:100%;border:1px solid #ccc;border-radius:12px;padding:13px;font-size:16px}.help{color:#666;font-size:13px;line-height:1.6}.error{color:#a32018;font-weight:800}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.hidden{display:none!important}.mo-appnav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:space-around;background:#fffffff7;border-top:1px solid #ddd;padding:7px 6px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.mo-appnav a{min-width:58px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#666;font:700 11px sans-serif;border-radius:12px}.mo-appnav b{font-size:20px}.mo-appnav .active{color:#111;background:#f0f0ec}
</style><script src="/machi-app.js"></script></head><body>
<header class="top"><div class="brand">MACHI ORDER · V71</div><h1>口頭注文</h1><p>席を選んで、QR注文と同じ厨房へ送ります。</p></header>
<main class="wrap"><section class="card"><h2>席を選ぶ</h2><div id="seats" class="seat-grid"></div><p id="empty" class="help">まだ席が登録されていません。最初の1回だけ、各席のQRのURLを登録します。</p></section>
<section class="card"><h2>席QRを登録</h2><p class="help">席QRをカメラで開き、ブラウザのURLをコピーして貼り付けます。QRトークンはこの端末内だけに保存します。</p><label for="seat-name">席名</label><input id="seat-name" placeholder="例：カウンター1番"><label for="seat-url">QRのURL</label><input id="seat-url" inputmode="url" placeholder="https://.../index.html?t=..."><p id="message" class="error"></p><button id="save" class="primary">この席を登録</button></section>
<section class="card"><button id="manage-button" class="secondary">登録した席を編集・削除</button><div id="manage"></div></section></main>
<nav class="mo-appnav"><a href="/store-command.html"><b>⌂</b>ホーム</a><a class="active" href="/staff-order.html"><b>＋</b>口頭注文</a><a href="/kitchen.html"><b>🍳</b>厨房</a><a href="/cashier.html"><b>¥</b>会計</a></nav>
<script>(()=>{'use strict';const key=`machi_staff_seats_v71:${Machi.store().id}`,$=id=>document.getElementById(id);let editMode=false;function loadSeats(){try{const value=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(value)?value:[]}catch{return[]}}function tokenFrom(value){const raw=String(value||'').trim();if(!raw)return'';try{return new URL(raw).searchParams.get('t')||''}catch{return/^[0-9a-f-]{20,}$/i.test(raw)?raw:''}}function render(){const values=loadSeats();$('empty').classList.toggle('hidden',values.length>0);$('seats').innerHTML=values.map((seat,index)=>`<button class="seat" data-open="${index}">${Machi.escapeHtml(seat.name)}<small>この席の注文を入力</small></button>`).join('');document.querySelectorAll('[data-open]').forEach(button=>button.onclick=()=>{const seat=values[Number(button.dataset.open)];location.href=`/index.html?t=${encodeURIComponent(seat.token)}&channel=staff`});$('manage').innerHTML=editMode?values.map((seat,index)=>`<div class="row" style="margin-top:10px"><div><b>${Machi.escapeHtml(seat.name)}</b></div><button class="secondary" data-delete="${index}">削除</button></div>`).join(''):'';document.querySelectorAll('[data-delete]').forEach(button=>button.onclick=()=>{const next=loadSeats();next.splice(Number(button.dataset.delete),1);localStorage.setItem(key,JSON.stringify(next));render()})}$('save').onclick=()=>{const name=$('seat-name').value.trim(),token=tokenFrom($('seat-url').value);if(!name||!token){$('message').textContent='席名と正しいQRのURLを入力してください。';return}const values=loadSeats(),duplicate=values.findIndex(seat=>seat.name===name||seat.token===token),item={name,token};if(duplicate>=0)values[duplicate]=item;else values.push(item);localStorage.setItem(key,JSON.stringify(values));$('seat-name').value='';$('seat-url').value='';$('message').textContent='';render()};$('manage-button').onclick=()=>{editMode=!editMode;render()};const incoming=new URLSearchParams(location.search).get('t');if(incoming)$('seat-url').value=incoming;render();Machi.registerServiceWorker()})();</script></body></html>
