<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/machi-design-system.css"><title>口頭注文｜MACHI ORDER</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.top{background:#111;color:#fff;padding:22px 18px}.brand{font-size:11px;letter-spacing:.15em;color:#aaa;font-weight:800}.top h1{font-size:28px;margin:6px 0}.top p{margin:0;color:#ccc}.wrap{max-width:720px;margin:auto;padding:16px 14px 90px}.card{background:#fff;border:1px solid #e5e5df;border-radius:20px;padding:17px;margin:12px 0}.seat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.seat{min-height:92px;border:2px solid #171717;background:#fff;border-radius:16px;padding:13px;font-size:18px;font-weight:900;text-align:left}.seat small{display:block;color:#666;font-size:11px;margin-top:5px}.help{color:#666;font-size:13px;line-height:1.6}.error{color:#a32018;font-weight:800}.mo-appnav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:space-around;background:#fffffff7;border-top:1px solid #ddd;padding:7px 6px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.mo-appnav a{min-width:72px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#666;font:700 11px sans-serif;border-radius:12px}.mo-appnav b{font-size:20px}.mo-appnav .active{color:#111;background:#f0f0ec}.loading{text-align:center;padding:28px 10px;color:#666}@media(min-width:620px){.seat-grid{grid-template-columns:repeat(3,1fr)}}
</style><script src="/machi-app.js"></script></head><body>
<header class="top"><div id="brand" class="brand">MACHI ORDER · STAFF</div><h1>口頭注文</h1><p>席を選んで、QR注文と同じ厨房へ送ります。</p></header>
<main class="wrap"><section class="card"><h2 id="store-name">店舗を確認しています</h2><p class="help">スタッフが口頭で受けた注文を入力します。席と注文内容をお客様と確認してから送信してください。</p><div id="seats" class="seat-grid"><div class="loading">席を読み込んでいます…</div></div><p id="message" class="error"></p></section></main>
<nav class="mo-appnav"><a href="/kitchen-apps.html"><b>⌂</b>店舗選択</a><a class="active" id="oral" href="/staff-order.html"><b>＋</b>口頭注文</a><a id="kitchen" href="/kitchen.html"><b>🍳</b>厨房</a><a id="cashier" href="/cashier.html"><b>¥</b>会計</a></nav>
<script>(()=>{'use strict';const $=id=>document.getElementById(id),store=Machi.store();$('brand').textContent=`MACHI ORDER · ${store.name}`;$('store-name').textContent=store.name;$('oral').href=`/staff-order.html?store_id=${store.id}`;$('cashier').href=`/cashier.html?store_id=${store.id}`;$('kitchen').href=store.id===2?'/kitchen.html?store=shirakibaru':'/kitchen.html';async function load(){if(!Machi.getToken()){location.replace('/login.html?next='+encodeURIComponent(`/staff-order.html?store_id=${store.id}`));return}try{const data=await Machi.api('staff-order-api');$('store-name').textContent=data.store?.name||store.name;const tables=data.tables||[];$('seats').innerHTML=tables.map(table=>`<button class="seat" data-id="${Number(table.id)}" data-token="${Machi.escapeHtml(table.qr_token)}">${Machi.escapeHtml(table.name)}<small>${table.seat_type==='counter'?'カウンター1席':`${Number(table.capacity||1)}人席`} · 注文を入力</small></button>`).join('')||'<div class="loading">利用できる席がありません</div>';document.querySelectorAll('.seat').forEach(button=>button.onclick=()=>{location.href=`/index.html?t=${encodeURIComponent(button.dataset.token)}&channel=staff&store_id=${store.id}`})}catch(error){if(error.status===401){location.replace('/login.html?next='+encodeURIComponent(`/staff-order.html?store_id=${store.id}`));return}$('seats').innerHTML='';$('message').textContent=error.message||'席を取得できませんでした'}}load();Machi.registerServiceWorker()})();</script></body></html>
