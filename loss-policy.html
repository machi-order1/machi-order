<!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>食材ロス運用</title><style>body{font-family:-apple-system,sans-serif;background:#f5f5f5;margin:0}main{max-width:700px;margin:auto;padding:16px}.c{background:#fff;border-radius:16px;padding:16px;margin:10px 0}h2{margin-top:0}</style><main><h1>🍜 食材ロス・賄い</h1><div class=c><h2>基本方針</h2><p>長浜店は日常的な廃棄入力を必須にしません。廃棄が発生した時だけ記録します。</p></div><div class=c><h2>🗑️ 廃棄</h2><p>例：暑い時期にネギの臭い・傷みが出て廃棄した場合。</p></div><div class=c><h2>🥚 スタッフ消費</h2><p>ゆで卵の仕込み失敗をスタッフが食べた場合は、通常廃棄と分けて記録できます。</p></div><div class=c><h2>🍜 賄い</h2><p>スタッフが油そばを賄いで食べた分は「賄い」として売上とは分け、原価管理に反映できる設計です。</p></div></main>
