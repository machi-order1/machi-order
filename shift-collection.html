<!doctype html><div class=c><b>⚡ かんたんモード：翌週1週間をすぐ作る</b><p>金曜〜土曜に、次の月曜〜日曜を決める時はこれ。</p><div class=r><input id=week type=date><input id=fastdl type=datetime-local><button id=fastopen class=primary>翌週の希望回収を開始</button></div><p id=fastmsg></p></div><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>シフト回収</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f5;margin:0;color:#222}header{background:#111;color:#fff;padding:18px}.w{max-width:850px;margin:auto;padding:12px}.c{background:#fff;border-radius:16px;padding:15px;margin:10px 0}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.k{font-size:28px;font-weight:800}.red{color:#c33}.green{color:#198754}.pill{background:#eee;border-radius:99px;padding:5px 9px}input,button{padding:10px;border:1px solid #ddd;border-radius:9px}button{font-weight:700}.primary{background:#111;color:#fff}.person{padding:10px 0;border-bottom:1px solid #eee}</style>
<header><b>MACHI ORDER</b><div>希望シフト回収 · V34</div></header><main class=w><div class=c><b>長浜店</b><div class=r><input id=f type=date><span>〜</span><input id=e type=date><input id=t type=password placeholder=アクセストークン><button onclick=sv()>保存・更新</button></div></div>
<div class=c><div class=r><div><small>提出済み</small><div id=done class="k green">-</div></div><div><small>未提出</small><div id=miss class="k red">-</div></div></div><div id=status></div></div>
<div class=c><b>未提出スタッフ</b><p>ここに残っている人だけ催促すればOK。</p><div id=people></div></div>
<div class=c><a href="shift-builder.html">→ シフト作成へ進む</a>　<a href="shift-request.html">→ スタッフ提出画面</a></div><div class=c><b>自由設定モード：好きな期間で募集</b><p>1週間以外・開始日変更・締切変更・臨時募集はこちら。</p><div class=r><input id=deadline type=datetime-local><button id=openp class=primary>この期間で募集開始</button></div><p id=pm></p></div><div class=c><button id=rem>未提出者だけ催促対象にする</button><p><small>※現在はMACHI ORDER内の通知データを作成。LINE等への外部送信は未接続。</small></p></div></main>
<script>const A='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/workforce-api?store_id=1',$=x=>document.getElementById(x);$('t').value=localStorage.mo_staff_token||'';let d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));$('f').value=d.toISOString().slice(0,10);let z=new Date(d);z.setDate(z.getDate()+6);$('e').value=z.toISOString().slice(0,10);function sv(){localStorage.mo_staff_token=$('t').value;load()}async function load(){let r=await fetch(A+'&from='+$('f').value+'&to='+$('e').value,{headers:{Authorization:'Bearer '+localStorage.mo_staff_token}}),j=await r.json();if(!r.ok||!j.planning){$('status').textContent=j.error||'店長権限が必要です';return}let mids=new Set(j.planning.members.map(x=>x.user_id)),staff=j.planning.profiles.filter(x=>mids.has(x.user_id)),av=j.availability||[],submitted=new Set(av.map(x=>x.user_id)),missing=staff.filter(x=>!submitted.has(x.user_id));$('done').textContent=(staff.length-missing.length)+'/'+staff.length;$('miss').textContent=missing.length;$('status').innerHTML=missing.length?'<span class=red>⚠ 希望待ちがあります</span>':'<span class=green>✓ 全員提出済み。シフト作成できます</span>';$('people').innerHTML=missing.length?missing.map(x=>`<div class=person><b>${x.display_name||'スタッフ'}</b> <span class=pill>未提出</span><br><small>提出画面のリンクを送って催促</small></div>`).join(''):'<div class=green>全員提出済みです 🎉</div>'}let period=null;async function post(b){let r=await fetch(A,{method:'POST',headers:{Authorization:'Bearer '+localStorage.mo_staff_token,'Content-Type':'application/json'},body:JSON.stringify(b)});return [r,await r.json()]}document.getElementById('openp').onclick=async()=>{sv();let [r,j]=await post({action:'submission_period_open',period_start:$('f').value,period_end:$('e').value,deadline_at:$('deadline').value});$('pm').textContent=r.ok?'✓ 希望募集を開始しました':j.error;period=j.period||period;load()};document.getElementById('rem').onclick=async()=>{if(!period){$('pm').textContent='先に募集期間を開始してください';return}let[r,j]=await post({action:'queue_missing_reminders',period_id:period.id});$('pm').textContent=r.ok?'✓ 未提出 '+j.missing+'人を催促対象にしました':j.error};function nextMon(){let d=new Date(),day=d.getDay(),add=(8-day)%7||7;d.setDate(d.getDate()+add);return d.toISOString().slice(0,10)}$('week').value=nextMon();$('fastopen').onclick=async()=>{sv();let[r,j]=await post({action:'weekly_cycle_open',week_start:$('week').value,deadline_at:$('fastdl').value});$('fastmsg').textContent=r.ok?'✓ 翌週7日分の回収を開始しました':j.error;period=j.period||period;load()};load()</script>
