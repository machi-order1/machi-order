name: V71 quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: v71-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check machi-app.js && node --check machi-ui-config.js && node --check financial-analysis.js && node --check receipt-capture.js && node --check invoice-management.js && node --check sw.js
      - name: Audit store routing
        run: node scripts/audit-store-routing.mjs
      - name: Verify Cloudflare Pages bundle
        run: node scripts/build-cloudflare-pages.mjs
      - name: Check financial report calculations
        run: node --experimental-strip-types scripts/test-financial-report.mjs
      - name: Check external channel CSV import
        run: node scripts/test-external-channel-csv.cjs
      - name: Check daily review classification
        run: node scripts/test-daily-check.cjs
      - name: Check filing readiness classification
        run: node scripts/test-filing-readiness.cjs && node --check filing-readiness.js
      - name: Check accounting source viewer syntax
        run: node --check journal-sources.js && node --experimental-strip-types --check supabase/functions/accounting-sources-api/index.ts
      - name: Check cash reconciliation labels
        run: node scripts/test-cash-reconciliation.cjs
      - name: Check receipt and invoice OCR suggestions
        run: node --experimental-strip-types scripts/test-receipt-parser.mjs && node --experimental-strip-types scripts/test-invoice-parser.mjs
      - name: Run V71 regression checks
        run: node scripts/qa-v71.mjs
