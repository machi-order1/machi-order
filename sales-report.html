<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>売上管理｜MACHI ORDER</title>
<link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#161616;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:820px;margin:auto;padding:20px 16px 90px}h1{font-size:25px;margin:10px 0 4px}.muted{color:#62656a;font-size:13px;line-height:1.6}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.top a{color:#333;text-decoration:none}.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 1px 8px #0000000a}.tabs{display:flex;gap:8px}.tabs button{flex:1}.tabs button,.action{border:0;border-radius:11px;padding:12px;font-size:15px;font-weight:700;background:#e9eaed;color:#222;cursor:pointer}.tabs button[aria-selected="true"],.action{background:#171717;color:white}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.controls label{flex:1;min-width:165px;font-size:13px;font-weight:700}.controls input,.controls select{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #d4d6da;border-radius:10px;background:white;font-size:16px}.action{min-height:44px}.hero{font-size:40px;letter-spacing:-.04em;font-weight:800;margin:6px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#f6f7f8;border-radius:12px;padding:12px}.metric small{display:block;color:#666}.metric b{display:block;font-size:20px;margin-top:4px}.row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.row b{white-space:nowrap}.error{color:#a71920}.days{width:100%;border-collapse:collapse}.days th,.days td{text-align:right;padding:11px 4px;border-bottom:1px solid #eee}.days th:first-child,.days td:first-child{text-align:left}.days button{border:0;background:none;text-decoration:underline;color:#175b9c;font:inherit;cursor:pointer}.notice{background:#fff8e8}
@media(max-width:420px){.hero{font-size:34px}.metric b{font-size:18px}}
</style>
</head>
<body><main>
<div class="top"><a id="back" href="/manager.html">← 店長ホーム</a><a href="/financial-analysis.html" id="analysis-link">年間・複数年の分析 →</a><span id="store-name" class="muted"></span></div>
<h1>売上管理</h1><div class="muted">会計済み注文を営業日で集計します。</div>
<section class="card"><div class="tabs" role="tablist" aria-label="集計期間"><button id="tab-day" type="button" role="tab" aria-selected="true">日別</button><button id="tab-month" type="button" role="tab" aria-selected="false">月別</button></div><div class="controls" style="margin-top:16px"><label>店舗<select id="store"><option value="1">151 長浜店</option><option value="2">151 白木原店</option></select></label><label id="date-wrap">営業日<input id="date" type="date"></label><label id="month-wrap" hidden>対象月<input id="month" type="month"></label><button id="refresh" class="action" type="button">表示</button></div><p id="status" class="muted" role="status" aria-live="polite"></p></section>
<div id="result" hidden>
<section class="card"><div id="period-label" class="muted"></div><div class="hero" id="sales"></div><div class="muted">売上（税込・会計済み）</div><div class="grid" style="margin-top:18px"><div class="metric"><small>注文数</small><b id="orders"></b></div><div class="metric"><small>来店組数</small><b id="visits"></b></div><div class="metric"><small>客数</small><b id="guests"></b></div><div class="metric"><small>客単価</small><b id="ticket"></b></div></div></section>
<section class="card"><h2>決済内訳</h2><div id="payments"></div></section>
<section class="card"><h2>参考利益</h2><div id="profit"></div><p class="muted">原価・人件費・経費の入力状況により変動します。税務・会計上の確定利益ではありません。</p></section>
<section id="daily-section" class="card" hidden><h2>日別売上</h2><div style="overflow-x:auto"><table class="days"><thead><tr><th>営業日</th><th>売上</th><th>注文</th><th>客数</th></tr></thead><tbody id="daily-rows"></tbody></table></div></section>
<section id="quality" class="card notice"></section>
</div>
</main><script>
const $=id=>document.getElementById(id), yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'), params=new URLSearchParams(location.search);
const token=()=>localStorage.machi_access_token||localStorage.mo_staff_token||localStorage.access_token||localStorage.sb_access_token||'';
let mode=params.get('month')?'month':'day';
$('store').value=String(window.MACHI_STORE_ID||1);
$('date').value=params.get('date')||new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
$('month').value=params.get('month')||$('date').value.slice(0,7);
function setMode(value){mode=value;for(const name of ['day','month'])$('tab-'+name).setAttribute('aria-selected',String(name===mode));$('date-wrap').hidden=mode!=='day';$('month-wrap').hidden=mode!=='month';$('daily-section').hidden=mode!=='month'}
function row(label,value){const item=document.createElement('div');item.className='row';const name=document.createElement('span'),amount=document.createElement('b');name.textContent=label;amount.textContent=value;item.append(name,amount);return item}
function rows(id,pairs){const container=$(id);container.replaceChildren(...pairs.map(pair=>row(pair[0],pair[1])))}
function render(d){$('result').hidden=false;$('daily-section').hidden=mode!=='month';$('period-label').textContent=mode==='day'?d.period+' の売上':d.period+' の売上';$('sales').textContent=yen(d.sales);$('orders').textContent=Number(d.order_count||0).toLocaleString()+'件';$('visits').textContent=Number(d.visit_count||0).toLocaleString()+'組';$('guests').textContent=Number(d.guest_count||0).toLocaleString()+'人';$('ticket').textContent=yen(d.average_ticket);
rows('payments',[['現金',yen(d.cash_sales)],['PayPay',yen(d.paypay_sales)],['その他',yen(d.other_sales)]]);
rows('profit',[['売上',yen(d.sales)],['商品原価','−'+yen(d.cogs)],['粗利益',yen(d.gross_profit)],['実働人件費','−'+yen(d.labor_cost)],['廃棄','−'+yen(d.waste_cost)],['賄い・スタッフ消費','−'+yen(d.staff_consumption_cost)],['販売チャネル手数料','−'+yen(d.channel_fees)],['その他経費','−'+yen(d.expenses)],['参考利益',yen(d.operating_profit)],['FL比率',Number(d.ratios?.fl||0).toLocaleString()+'%']]);
const q=d.data_quality||{};$('quality').textContent=`利益精度：商品原価 ${q.costed_products||0}/${q.active_products||0}件登録、原価未登録 ${q.uncosted_products||0}件、原価未確定の賄い・消費 ${q.uncosted_staff_consumption||0}件。`;
const body=$('daily-rows');body.replaceChildren();const values=new Map((d.daily_sales||[]).map(item=>[item.date,item]));if(mode==='month'){const [year,month]=d.month.split('-').map(Number),count=new Date(year,month,0).getDate();for(let i=1;i<=count;i++){const date=d.month+'-'+String(i).padStart(2,'0'),item=values.get(date)||{};const tr=document.createElement('tr'),cell=document.createElement('td'),button=document.createElement('button');button.type='button';button.textContent=date;button.addEventListener('click',()=>{$('date').value=date;setMode('day');load()});cell.append(button);tr.append(cell);for(const v of [yen(item.sales),String(item.orders||0),String(item.guests||0)]){const td=document.createElement('td');td.textContent=v;tr.append(td)}body.append(tr)}}}
async function load(){const access=token();if(!access){location.replace('/login.html?next='+encodeURIComponent(location.pathname+location.search));return}const period=mode==='day'?$('date').value:$('month').value;if(!period){$('status').textContent='日付を選択してください';return}const store=$('store').value;$('result').hidden=true;$('status').className='muted';$('status').textContent='読み込み中…';$('refresh').disabled=true;try{const query=new URLSearchParams({store_id:store,[mode==='day'?'date':'month']:period});const response=await fetch('https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/pl-api?'+query,{headers:{Authorization:'Bearer '+access}});const data=await response.json().catch(()=>({}));if(response.status===401){location.replace('/login.html?next='+encodeURIComponent(location.pathname+location.search));return}if(!response.ok)throw Error(data.error||'売上を読み込めませんでした');render(data);$('status').textContent='更新 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});const url=new URL(location.href);url.searchParams.set('store_id',store);url.searchParams.delete('date');url.searchParams.delete('month');url.searchParams.set(mode==='day'?'date':'month',period);history.replaceState(null,'',url);$('back').href='/manager.html?store_id='+store;$('analysis-link').href='/financial-analysis.html?store_id='+store;$('store-name').textContent=store==='2'?'151 白木原店':'151 長浜店'}catch(error){$('status').className='muted error';$('status').textContent=error.message}finally{$('refresh').disabled=false}}
$('tab-day').addEventListener('click',()=>{setMode('day');load()});$('tab-month').addEventListener('click',()=>{setMode('month');load()});$('refresh').addEventListener('click',load);$('store').addEventListener('change',()=>{localStorage.setItem('machi_store_id',$('store').value);load()});setMode(mode);load();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
