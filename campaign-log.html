<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>施策の記録｜博多油そば151</title><link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#1b2830;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.55}main{max-width:900px;margin:auto;padding:18px 15px 80px}h1{font-size:26px;margin:12px 0 3px}h2{font-size:19px;margin:0 0 10px}.muted{color:#53636b;font-size:13px}.card{background:#fff;border:1px solid #e3e8eb;border-radius:16px;padding:17px;margin:13px 0}.notice{background:#fff9ea;border-color:#e6d6ac}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:11px}label{font-weight:700;font-size:13px}input,select,textarea{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #cbd3d7;border-radius:9px;font:inherit;font-size:16px}textarea{min-height:85px}button{border:0;border-radius:9px;background:#153b46;color:#fff;padding:10px 16px;min-height:44px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.result{margin:12px 0;padding:12px;background:#f3f6f7;border-radius:10px}.entry{border-top:1px solid #e8ebed;padding:14px 0}.entry:first-child{border-top:0}.error{color:#a71920}
</style></head><body><main><a id="back" href="/manager.html">← 店長ホーム</a><h1>施策の記録</h1><p class="muted">広告・サービス券・イベントの狙いと結果を、店舗ごとに残します。</p>
<section class="card notice"><b>売上への効果はまだ推定しません</b><p>同じ時期に天候・価格・営業時間なども変わります。ここでは計画、実費、現場の結果メモを記録します。売上・客数と比べる機能は、この記録を元に追加します。</p></section>
<section class="card"><div class="grid"><label>店舗<select id="store"><option value="1">151 長浜店</option><option value="2">151 白木原店</option></select></label><label>表示する年<input id="year" type="number" min="2000" max="2100"></label></div><p><button id="refresh" type="button">一覧を表示</button></p><p id="status" class="muted" role="status" aria-live="polite"></p></section>
<section class="card"><h2>新しい施策を記録</h2><form id="plan-form"><div class="grid"><label>施策名<input name="title" maxlength="120" required placeholder="例：火曜夜の再来店券"></label><label>種類<select name="campaign_type"><option value="coupon">サービス券</option><option value="ad">広告</option><option value="event">イベント</option><option value="other">その他</option></select></label><label>開始日<input name="start_on" type="date" required></label><label>終了日<input name="end_on" type="date" required></label><label>対象の曜日<select name="weekday_target"><option value="0">すべて</option><option value="1">月曜</option><option value="2">火曜</option><option value="3">水曜</option><option value="4">木曜</option><option value="5">金曜</option><option value="6">土曜</option><option value="7">日曜</option></select></label><label>対象の営業<select name="slot_target"><option value="all">昼・夜</option><option value="lunch">昼</option><option value="dinner">夜</option></select></label><label>予定費用（円）<input name="planned_budget_yen" type="number" min="0" max="100000000" step="1" value="0" required></label></div><p><label>何を改善したいか<textarea name="hypothesis" maxlength="500" minlength="5" required placeholder="例：火曜夜の来店組数を増やす"></textarea></label></p><button type="submit">施策を記録する</button><p id="plan-status" class="muted" role="status" aria-live="polite"></p></form></section>
<section class="card"><h2>記録した施策</h2><p class="muted">結果は後から追記できます。訂正は新しい結果として残り、一覧には最新の結果を表示します。</p><div id="entries" role="status" aria-live="polite">読み込み中…</div><p><a id="analysis" href="/financial-analysis.html">同じ年の経営分析を見る →</a></p></section>
</main><script src="/campaign-log.js" defer></script></body></html>
