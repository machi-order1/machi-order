<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e51b23"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/machi-design-system.css"><title>日次締め｜MACHI ORDER</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f3ee;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:760px;margin:auto;padding:22px 16px 100px}.back{color:#555;text-decoration:none;font-weight:800}.ey{margin-top:20px;color:#8a8179;font-size:11px;font-weight:950;letter-spacing:.16em}h1{margin:7px 0 18px;font-size:31px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0000000a}.summary{border-top:6px solid #e51b23}.sales{font-size:32px;font-weight:950;margin:5px 0 12px}.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:11px;background:#f7f3ee;border-radius:12px}.metric span{display:block;color:#777;font-size:12px}.metric b{font-size:17px}.date{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1ede8;font-size:12px;font-weight:850}.status{padding:13px;border-radius:13px;font-weight:850;margin-top:12px}.status.ok{background:#e8f7ec;color:#196d35}.status.warn{background:#fff0df;color:#9b4700}.status.closed{background:#ececec;color:#555}label{display:block;font-weight:900;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #d8d1c9;border-radius:13px;padding:13px;font:inherit;background:#fff}textarea{min-height:88px;resize:vertical}.difference{font-size:22px;font-weight:950;padding:12px 0}.difference.zero{color:#19723a}.difference.ng{color:#bd1e26}.btn{width:100%;min-height:56px;border:0;border-radius:15px;background:#171717;color:#fff;font-size:17px;font-weight:950;margin-top:12px}.btn.red{background:#e51b23}.btn:disabled{opacity:.4}.check{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid #eee}.check:first-of-type{border:0}.check input{width:25px;height:25px;margin:0;accent-color:#e51b23}.check b{display:block}.check small{color:#777}.msg{min-height:25px;margin:12px 2px;font-weight:800;color:#b71920}.msg.ok{color:#19723a}.links{display:grid;grid-template-columns:1fr 1fr;gap:9px}.links a{text-align:center;padding:13px;border:1px solid #ddd;border-radius:13px;color:#171717;text-decoration:none;font-weight:850}</style></head>
<body><main><a class="back" href="/store-command.html">← 店舗ホーム</a><div class="ey">博多油そば151 · 長浜店</div><h1>引継ぎ・日次締め</h1>
<section class="card summary"><span class="date" id="business-date">確認中</span><div class="sales" id="sales">—</div><div class="breakdown" id="breakdown"></div><div id="closing-status"></div></section>
<section class="card"><h2>閉店チェック</h2><label class="check"><input type="checkbox" data-close-check><span><b>未会計・未提供の注文なし</b><small>厨房と会計を確認</small></span></label><label class="check"><input type="checkbox" data-close-check><span><b>注文受付を停止</b><small>閉店後の誤注文を防止</small></span></label><label class="check"><input type="checkbox" data-close-check><span><b>PayPay売上を確認</b><small>PayPay側の入金履歴と照合</small></span></label><label class="check"><input type="checkbox" data-close-check><span><b>在庫・売切・引継ぎを確認</b><small>翌営業へ残す内容を記録</small></span></label></section>
<section class="card"><h2>現金締め</h2><div id="expected" class="status warn">レジ期待現金を確認中…</div><label for="actual">レジ内の実際の現金</label><input id="actual" inputmode="numeric" pattern="[0-9]*" placeholder="例：32500"><div class="difference" id="difference">差額 —</div><label for="note">締めメモ</label><textarea id="note" maxlength="500" placeholder="差額理由や翌日への注意点"></textarea><button class="btn red" id="close-button" disabled>本日の締めを記録</button></section>
<section class="card"><h2>引継ぎ</h2><textarea id="handover" maxlength="500" placeholder="夜スタッフ・翌日スタッフへの引継ぎ"></textarea><select id="priority"><option value="normal">通常</option><option value="high">重要</option></select><button class="btn" id="handoff-button">引継ぎを保存</button></section><div class="links"><a href="/cashier.html">会計を確認</a><a href="/inventory.html">在庫を確認</a></div><p class="msg" id="msg" role="alert"></p></main>
<script>
const BASE='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1',$=id=>document.getElementById(id);let summary={},closed=false,busy=false;const token=()=>localStorage.machi_access_token||localStorage.mo_staff_token||'';
function login(){location.replace('/login.html?next='+encodeURIComponent('/closing.html'))}function yen(n){return '¥'+Number(n||0).toLocaleString()}
async function api(name,method='GET',body){if(!token())return login();const r=await fetch(BASE+'/'+name+'?store_id=1',{method,headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}),j=await r.json().catch(()=>({}));if(r.status===401)return login();if(!r.ok)throw Error(j.error||'処理できません');return j}
function checksDone(){return [...document.querySelectorAll('[data-close-check]')].every(x=>x.checked)}function updateButton(){const v=$('actual').value.trim();$('close-button').disabled=closed||busy||!/^\d+$/.test(v)||!checksDone()}
function updateDifference(){const v=$('actual').value.trim();if(!/^\d+$/.test(v)){$('difference').textContent='差額 —';$('difference').className='difference';return updateButton()}const d=Number(v)-Number(summary.cash_expected||0);$('difference').textContent='差額 '+(d>0?'+':'')+yen(d);$('difference').className='difference '+(d===0?'zero':'ng');updateButton()}
async function load(){try{const j=await api('closing-api'),s=j.summary||{};summary=s;closed=Boolean(j.closing);$('business-date').textContent=s.business_date||'本日';$('sales').textContent=yen(s.net_sales);$('breakdown').innerHTML=[['現金',s.cash_sales],['PayPay',s.paypay_sales],['注文',String(s.order_count||0)+'件'],['客数',String(s.guest_count||0)+'人']].map(([k,v])=>`<div class="metric"><span>${k}</span><b>${typeof v==='number'?yen(v):v}</b></div>`).join('');$('expected').innerHTML='レジ期待現金 <b>'+yen(s.cash_expected)+'</b><br><small>開始時 '+yen(s.opening_cash)+' ＋ 現金売上 '+yen(s.cash_sales)+'</small>';if(closed){$('actual').value=j.closing.cash_actual??'';$('note').value=j.closing.note||'';$('closing-status').innerHTML='<div class="status closed">✓ 本日は締め済み（'+new Date(j.closing.closed_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'）</div>';$('close-button').textContent='本日は締め済み';document.querySelectorAll('[data-close-check],#actual,#note').forEach(x=>x.disabled=true)}else $('closing-status').innerHTML='<div class="status ok">未締め｜閉店チェック後に記録してください</div>';updateDifference();updateButton();$('msg').textContent=''}catch(e){$('msg').textContent=e.message}}
async function closeDay(){if(busy||closed||!checksDone())return;const actual=Number($('actual').value),diff=actual-Number(summary.cash_expected||0),text=diff===0?'現金差額は0円です。本日の締めを記録しますか？':'現金差額が'+(diff>0?'+':'')+diff.toLocaleString()+'円あります。理由をメモしましたか？';if(!confirm(text))return;busy=true;updateButton();try{const j=await api('closing-api','POST',{cash_actual:actual,note:$('note').value.trim()});$('msg').className='msg ok';$('msg').textContent='✓ 締めを記録しました。現金差額 '+yen(j.closing?.cash_difference||0);await load()}catch(e){$('msg').className='msg';$('msg').textContent=e.message}finally{busy=false;updateButton()}}
async function handoff(){const message=$('handover').value.trim();if(!message)return alert('引継ぎ内容を入力してください');$('handoff-button').disabled=true;try{await api('operations-api','POST',{action:'handoff',message,priority:$('priority').value});$('handover').value='';$('msg').className='msg ok';$('msg').textContent='✓ 引継ぎを保存しました'}catch(e){$('msg').className='msg';$('msg').textContent=e.message}finally{$('handoff-button').disabled=false}}
document.querySelectorAll('[data-close-check]').forEach(x=>x.addEventListener('change',updateButton));$('actual').addEventListener('input',updateDifference);$('close-button').addEventListener('click',closeDay);$('handoff-button').addEventListener('click',handoff);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load();
</script></body></html>
