<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>引継ぎ・締め作業</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#f5f5f7;color:#111}header{position:sticky;top:0;background:#111;color:#fff;padding:14px 16px;z-index:5}h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.7;margin-top:4px}.wrap{max-width:980px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 5px #0001}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.big{font-size:24px;font-weight:800}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#eee;font-size:12px}.muted{color:#666;font-size:13px}input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin:5px 0}a.btn{display:inline-block;text-decoration:none;color:#111;background:#eee}.warn{background:#fff4d8}.ok{background:#e8f8ec}</style></head><body><header><h1>引継ぎ・締め作業</h1><div class='sub'>MACHI ORDER V31 · 長浜店 Store OS</div></header><main class='wrap'><div class='card'><b>引継ぎ・日次締め</b><input id='tok' type='password' placeholder='アクセストークン'><button class='btn' onclick='saveToken();load()'>保存して更新</button><p id='msg' class='muted'></p></div><div class='grid'><div class='card'><b>売上集計</b><div id='summary'></div></div><div class='card'><b>現金締め</b><input id='actual' inputmode='numeric' placeholder='レジ内の実際の現金'><textarea id='note' placeholder='締めメモ'></textarea><button class='btn' onclick='closeDay()'>締めを記録</button></div><div class='card'><b>引継ぎ</b><textarea id='handover' placeholder='夜スタッフ・翌日スタッフへの引継ぎ'></textarea><select id='priority'><option value='normal'>通常</option><option value='high'>重要</option></select><button class='btn' onclick='handoff()'>引継ぎを保存</button></div></div></main><script>
const API_BASE='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1';
const $=x=>document.getElementById(x);
function token(){return localStorage.mo_staff_token||''}
function initToken(){let e=$('tok');if(e)e.value=token()}
function saveToken(){let e=$('tok');if(e)localStorage.mo_staff_token=e.value.trim();}
async function api(name,method='GET',body=null){
 const r=await fetch(API_BASE+'/'+name+'?store_id=1',{method,headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({})); if(!r.ok) throw Error(j.error||'処理できません'); return j;
}
initToken();
async function load(){try{let j=await api('closing-api');let s=j.summary||{};$('summary').innerHTML=`<div class="big">¥${Number(s.net_sales||0).toLocaleString()}</div><p>現金 ¥${Number(s.cash_sales||0).toLocaleString()}<br>PayPay ¥${Number(s.paypay_sales||0).toLocaleString()}<br>その他 ¥${Number(s.other_sales||0).toLocaleString()}<br>注文 ${s.order_count||0}件 / 客数 ${s.guest_count||0}人<br>レジ期待現金 ¥${Number(s.cash_expected||0).toLocaleString()}</p>`;if(j.closing?.cash_actual!=null)$('actual').value=j.closing.cash_actual;if(j.closing?.note)$('note').value=j.closing.note}catch(e){$('msg').textContent=e.message}}
async function closeDay(){if(!confirm('本日の締めを記録しますか？'))return;try{let v=$('actual').value;let j=await api('closing-api','POST',{cash_actual:v===''?null:Number(v),note:$('note').value});$('msg').textContent='締めを記録しました。現金差額 '+(j.closing?.cash_difference??'-')+'円';load()}catch(e){alert(e.message)}}
async function handoff(){let m=$('handover').value.trim();if(!m)return alert('引継ぎ内容を入力してください');try{await api('operations-api','POST',{action:'handoff',message:m,priority:$('priority').value});$('handover').value='';$('msg').textContent='引継ぎを保存しました'}catch(e){alert(e.message)}}load();</script></body></html>
