<!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>原価設計</title><style>body{font-family:-apple-system,sans-serif;background:#f5f5f5;margin:0}main{max-width:760px;margin:auto;padding:16px}.c{background:#fff;border-radius:16px;padding:16px;margin:10px 0}.flow{font-size:19px;font-weight:800;line-height:1.8}.warn{background:#fff8df}</style><main><h1>🧮 レシピ原価</h1><div class=c><div class=flow>材料の仕入原価<br>↓<br>使用量・レシピ<br>↓<br>1杯あたり原価<br>↓<br>商品原価<br>↓<br>利益速報</div></div><div class="c warn"><b>⚠️ 原価は推測しません</b><p>単価と使用量が確定した材料だけ計算対象にします。未登録材料を0円のまま「正しい原価」と扱わない設計です。</p></div><div class=c><h2>151で登録する材料</h2><p>麺／タレ／油／チャーシュー／卵／青ねぎ／白ねぎ／キクラゲ／海苔／高菜／糸唐辛子などを、実際の仕入単位と使用量で登録していきます。</p></div><div class=c><h2>セット・トッピングにも対応</h2><p>油そば単品だけでなく、大盛・トッピング・セット商品まで同じ材料原価から計算できる土台です。</p></div><div class="card"><a href="cost-editor.html">✍️ 実原価・レシピを入力する</a></div></main>
