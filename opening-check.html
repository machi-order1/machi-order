const BASE='https://tejglrlkaqolbghoagqj.supabase.co',KEY='sb_publishable_beZla85Y6Ngrx0hji9I9rg_FbcRSUoT',AUTH=BASE+'/auth/v1/token',APIS={admin:BASE+'/functions/v1/menu-admin-api?store_id=1',kitchen:BASE+'/functions/v1/kitchen-api?store_id=1',cashier:BASE+'/functions/v1/cashier-api?store_id=1'};const $=id=>document.getElementById(id);let autoPass=0;function rawToken(){return localStorage.machi_access_token||localStorage.mo_staff_token||''}async function token(){let t=rawToken(),exp=Number(localStorage.machi_token_expires_at||0),rt=localStorage.machi_refresh_token||'';if(t&&(!exp||Date.now()<exp-60000))return t;if(!rt)return t;try{const r=await fetch(AUTH+'?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})}),j=await r.json();if(!r.ok)return t;localStorage.machi_access_token=j.access_token;localStorage.mo_staff_token=j.access_token;localStorage.machi_refresh_token=j.refresh_token||rt;localStorage.machi_token_expires_at=String(Date.now()+Number(j.expires_in||3600)*1000);return j.access_token}catch{return t}}function row(ok,icon,title,detail,result){return `<div class="check ${ok?'ok':'ng'}"><div class="icon">${icon}</div><div class="body"><b>${title}</b><small>${detail}</small></div><div class="result">${result}</div></div>`}function manualDone(key){return localStorage.getItem('opening_'+key+'_'+new Date().toLocaleDateString('ja-JP'))==='1'}function setManual(key,el){localStorage.setItem('opening_'+key+'_'+new Date().toLocaleDateString('ja-JP'),'1');el.classList.remove('manual');el.classList.add('ok');el.querySelector('.icon').textContent='✓';el.querySelector('button')?.remove();updateScore()}function updateScore(){const manual=(manualDone('sound')?1:0)+(manualDone('paypay')?1:0),total=autoPass+manual;$('score').textContent=total+'/8';$('summary-title').textContent=total===8?'開店準備OK':autoPass<6?'要確認あり':'あと端末確認だけ';$('summary-sub').textContent=total===8?'この端末の本日チェックは完了です':autoPass<6?'赤い項目を確認してください':'通知音とPayPay・釣銭を確認してください'}async function api(url,t){const r=await fetch(url,{headers:{apikey:KEY,Authorization:'Bearer '+t}}),j=await r.json().catch(()=>({}));return{ok:r.ok,status:r.status,data:j}}async function run(){const t=await token();let html='',pass=0;if(!t){html+=row(false,'🔒','スタッフログイン','厨房・会計を使うにはログインが必要です','未ログイン');$('automatic').innerHTML=html;$('score').textContent='0/8';$('summary-title').textContent='ログインが必要';$('summary-sub').innerHTML='<a href="/login.html?next=/opening-check.html" style="color:#fff">ログイン画面を開く</a>';return}const [a,k,c]=await Promise.all([api(APIS.admin,t),api(APIS.kitchen,t),api(APIS.cashier,t)]);const authOk=a.status!==401&&k.status!==401&&c.status!==401;html+=row(authOk,'🔐','スタッフ認証','厨房・会計・管理画面の認証','OK');if(authOk)pass++;const adminOk=a.ok,diag=a.data.diagnostics||{};html+=row(adminOk,'☁️','管理システム接続',adminOk?'商品設定を取得できました':'接続できません','接続');if(adminOk)pass++;const qrOk=diag.active_table_count===14;html+=row(qrOk,'▦','席QRコード',`有効な席QR ${diag.active_table_count??'–'}件／必要14件`,qrOk?'14/14':'確認');if(qrOk)pass++;const menuOk=diag.customer_visible_product_count===40;html+=row(menuOk,'🍜','お客様メニュー',`公開商品 ${diag.customer_visible_product_count??'–'}件`,menuOk?'40商品':'確認');if(menuOk)pass++;const serviceOk=k.ok&&c.ok;html+=row(serviceOk,'↔️','厨房・会計連動',serviceOk?'両方の受付APIが応答しています':`厨房 ${k.status}／会計 ${c.status}`,serviceOk?'正常':'異常');if(serviceOk)pass++;const orderingOk=a.data.ordering_enabled!==false;html+=row(orderingOk,'🟢','注文受付スイッチ',orderingOk?'注文受付はONです':'注文受付が停止中です',orderingOk?'受付中':'停止中');if(orderingOk)pass++;autoPass=pass;$('automatic').innerHTML=html;$('updated').textContent='最終確認 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});updateScore()}function beep(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ctx=new A();[0,.17,.34].forEach((d,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),at=ctx.currentTime+d;o.connect(g);g.connect(ctx.destination);o.frequency.value=i===1?1040:880;g.gain.setValueAtTime(.16,at);g.gain.exponentialRampToValueAtTime(.001,at+.14);o.start(at);o.stop(at+.15)});setTimeout(()=>{if(confirm('通知音は聞こえましたか？'))setManual('sound',$('sound-check'))},650)}$('sound-test').addEventListener('click',beep);document.querySelector('[data-manual=paypay]').addEventListener('click',e=>setManual('paypay',$('paypay-check')));$('refresh').addEventListener('click',run);if(manualDone('sound'))setManual('sound',$('sound-check'));if(manualDone('paypay'))setManual('paypay',$('paypay-check'));if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});run();

(()=>{let sending=false,done=false;async function record(){if(done||sending||document.getElementById('score').textContent!=='8/8')return;sending=true;try{const access=await token();const response=await fetch(APIS.admin,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({action:'record_opening_check',store_id:1,score:8,total:8})});const result=await response.json();if(!response.ok)throw Error(result.error||'記録できません');done=true;localStorage.setItem('opening_recorded_'+new Date().toLocaleDateString('ja-JP'),'1');document.getElementById('updated').textContent='✓ 本日の営業前チェック完了を記録しました'}catch(error){console.error(error)}finally{sending=false}}setInterval(record,700);record()})();
