<!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>人件費</title><style>body{font-family:-apple-system,sans-serif;background:#f5f5f5;margin:0}main{max-width:760px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c{background:#fff;border-radius:15px;padding:16px}.n{font-size:27px;font-weight:800}.muted{color:#666}button,input{width:100%;box-sizing:border-box;padding:11px;font-size:16px}</style><main><h1>💰 売上 × 人件費</h1><div class=c><input id=t placeholder="ログイントークン"><button onclick=load()>今日を更新</button></div><div class=grid><div class=c><div class=muted>売上</div><div id=s class=n>—</div></div><div class=c><div class=muted>実働人件費</div><div id=l class=n>—</div></div><div class=c><div class=muted>人件費率</div><div id=r class=n>—</div></div><div class=c><div class=muted>実働時間</div><div id=h class=n>—</div></div><div class=c><div class=muted>1人時売上</div><div id=p class=n>—</div></div></div><p>※打刻済み勤務は「退勤−休憩」で実働を計算。時給スナップショットを掛けて概算人件費を表示。</p></main><script>const A='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/dashboard-api?store_id=1&range=today';t.value=localStorage.mo_staff_token||'';async function load(){localStorage.mo_staff_token=t.value.trim();let q=await fetch(A,{headers:{Authorization:'Bearer '+localStorage.mo_staff_token}}),j=await q.json(),x=j.summary;if(!q.ok||!x){alert(j.error||'読込失敗');return}s.textContent='¥'+x.sales.toLocaleString();l.textContent='¥'+x.labor_cost.toLocaleString();r.textContent=x.labor_ratio+'%';h.textContent=x.worked_hours+'h';p.textContent='¥'+x.sales_per_labor_hour.toLocaleString()}</script></html>
