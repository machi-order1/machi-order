<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/machi-design-system.css">
  <script src="/machi-ui-config.js"></script>
  <title>公式サイト問い合わせ｜MACHI ORDER</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:var(--mo-bg,#f5f5f2);color:var(--mo-ink,#171717);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.top{background:#111;color:#fff;padding:24px 18px}.top a{color:#fff;text-decoration:none;font-size:13px}.ey{font-size:11px;letter-spacing:.15em;color:#aaa;font-weight:900;margin-top:16px}.top h1{font-size:30px;line-height:1.2;margin:6px 0}.top p{color:#bbb;margin:0}.wrap{max-width:780px;margin:auto;padding:16px 14px 96px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 16px}.sum{background:#fff;border:1px solid var(--mo-line,#e2dfda);border-radius:16px;padding:14px}.sum:first-child{background:#e51b23;color:#fff;border-color:#e51b23}.sum span{display:block;font-size:11px;font-weight:800;opacity:.7}.sum b{font-size:29px}.filters{display:grid;grid-template-columns:150px 1fr;gap:8px;margin-bottom:14px}input,select{width:100%;min-height:48px;border:1px solid #d8d2cc;border-radius:13px;padding:0 12px;background:#fff;font-size:15px}.msg{min-height:28px;color:#666;font-size:13px}.list{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--mo-line,#e2dfda);border-radius:20px;padding:18px}.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.chip{border-radius:999px;padding:4px 8px;background:#eee;font-size:11px;font-weight:900}.chip.new{background:#ffe1e3;color:#b71920}.chip.in_progress{background:#fff0c2;color:#765500}.chip.closed{background:#dff3e6;color:#176633}.date{font-size:11px;color:#777}.card h2{font-size:22px;margin:10px 0 0}.company{color:#666;font-size:13px;margin:2px 0 12px}.links{display:flex;gap:10px;flex-wrap:wrap}.links a{color:#b71920;font-weight:800;overflow-wrap:anywhere}.detail{display:grid;grid-template-columns:130px 1fr;gap:5px 14px;border-top:1px solid #eee;border-bottom:1px solid #eee;padding:14px 0;margin:14px 0}.detail dt{font-size:11px;color:#777;font-weight:800}.detail dd{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.status{display:flex;align-items:center;justify-content:space-between;gap:12px}.status label{font-size:12px;font-weight:900}.status select{width:auto;min-width:130px}.empty{text-align:center;padding:55px 20px;background:#fff;border-radius:20px;color:#666}.refresh{width:100%;min-height:50px;border:0;border-radius:14px;background:#111;color:#fff;font-size:15px;font-weight:900;margin:10px 0 18px}.refresh:disabled{opacity:.55}.mo-appnav{position:sticky;bottom:0;z-index:40;display:flex;justify-content:space-around;background:#fffffff5;border-top:1px solid var(--mo-line,#ddd);padding:7px 6px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.mo-appnav a{min-width:58px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#666;font:700 11px sans-serif}.mo-appnav b{font-size:20px}.mo-appnav a:first-child{color:#111;background:#f0f0ec;border-radius:12px}@media(max-width:560px){.filters{grid-template-columns:1fr}.detail{grid-template-columns:1fr;gap:2px}.detail dd{margin-bottom:8px}.status{align-items:flex-start;flex-direction:column}.status select{width:100%}}
  </style>
</head>
<body>
  <header class="top"><a href="/store-command.html">← 店舗ホーム</a><div class="ey">MACHI ORDER · WEBSITE</div><h1>公式サイト問い合わせ</h1><p>FC・出店・事業提携などの相談を確認できます。</p></header>
  <main class="wrap">
    <div class="summary"><div class="sum"><span>未対応</span><b id="new-count">0</b></div><div class="sum"><span>対応中</span><b id="progress-count">0</b></div><div class="sum"><span>完了</span><b id="closed-count">0</b></div></div>
    <button class="refresh" id="reload" type="button">最新の問い合わせを確認</button>
    <div class="filters"><select id="filter" aria-label="対応状況"><option value="">すべて表示</option><option value="new">未対応</option><option value="in_progress">対応中</option><option value="closed">完了</option><option value="spam">迷惑</option></select><input id="search" type="search" placeholder="名前・会社・内容を検索" aria-label="問い合わせを検索"></div>
    <p class="msg" id="msg" aria-live="polite"></p><div class="list" id="list"></div>
  </main>
  <nav class="mo-appnav"><a href="/store-command.html"><b>⌂</b>ホーム</a><a href="/kitchen.html"><b>🍳</b>厨房</a><a href="/today.html"><b>✓</b>今日</a><a href="/cashier.html"><b>¥</b>会計</a><a href="/staff.html"><b>☰</b>その他</a></nav>
  <script>
  (()=>{'use strict';
    const S='https://tejglrlkaqolbghoagqj.supabase.co',K='sb_publishable_beZla85Y6Ngrx0hji9I9rg_FbcRSUoT',labels={new:'未対応',in_progress:'対応中',closed:'完了',spam:'迷惑'},statuses=Object.keys(labels),$=id=>document.getElementById(id);let rows=[];
    const token=()=>localStorage.machi_access_token||localStorage.mo_staff_token||'';
    async function refresh(){const rt=localStorage.machi_refresh_token;if(!rt)throw Error('login');const r=await fetch(S+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})}),j=await r.json();if(!r.ok)throw Error('login');localStorage.machi_access_token=j.access_token;localStorage.mo_staff_token=j.access_token;localStorage.machi_refresh_token=j.refresh_token||rt;return j.access_token}
    async function api(path,opt={},retry=true){let t=token();if(!t){location.replace('/login.html?next='+encodeURIComponent(location.pathname));throw Error('login')}let r=await fetch(S+'/rest/v1/'+path,{...opt,headers:{...(opt.headers||{}),apikey:K,Authorization:'Bearer '+t}});if(r.status===401&&retry){await refresh();return api(path,opt,false)}if(!r.ok)throw Error('取得できません');return r}
    const text=(p,t,v,c)=>{const e=document.createElement(t);if(c)e.className=c;e.textContent=v||'';p.appendChild(e);return e};
    const date=v=>new Intl.DateTimeFormat('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v));
    function card(x){const c=document.createElement('article');c.className='card';const m=text(c,'div','', 'meta');text(m,'span',labels[x.status]||x.status,'chip '+x.status);text(m,'span',date(x.created_at),'date');text(c,'h2',x.name);text(c,'p',x.company||'会社名なし','company');const links=text(c,'div','', 'links'),em=text(links,'a',x.email);em.href='mailto:'+x.email;if(x.phone){const ph=text(links,'a',x.phone);ph.href='tel:'+x.phone.replace(/[^+\d]/g,'')}const dl=text(c,'dl','', 'detail');[['ご相談内容',x.inquiry_type],['希望エリア・国',x.preferred_area||'—'],['メッセージ',x.message]].forEach(([a,b])=>{text(dl,'dt',a);text(dl,'dd',b)});const sc=text(c,'div','', 'status');text(sc,'label','対応状況');const sel=document.createElement('select');statuses.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=labels[s];o.selected=s===x.status;sel.appendChild(o)});sel.onchange=()=>save(x,sel);sc.appendChild(sel);return c}
    function render(){const f=$('filter').value,q=$('search').value.trim().toLowerCase(),show=rows.filter(x=>(!f||x.status===f)&&(!q||[x.name,x.company,x.email,x.phone,x.inquiry_type,x.preferred_area,x.message].filter(Boolean).join(' ').toLowerCase().includes(q)));$('new-count').textContent=rows.filter(x=>x.status==='new').length;$('progress-count').textContent=rows.filter(x=>x.status==='in_progress').length;$('closed-count').textContent=rows.filter(x=>x.status==='closed').length;$('list').replaceChildren(...(show.length?show.map(card):[text(document.createDocumentFragment(),'div',rows.length?'条件に一致するお問い合わせはありません。':'お問い合わせはまだありません。','empty')]))}
    async function load(){$('reload').disabled=true;$('msg').textContent='確認しています…';try{const fields='id,created_at,name,company,email,phone,inquiry_type,preferred_area,message,status',r=await api('website_inquiries?select='+fields+'&order=created_at.desc&limit=200');rows=await r.json();$('msg').textContent=rows.length+'件を表示しています。';render()}catch(e){if(e.message!=='login')$('msg').textContent='表示できません。管理アカウントでログインし直してください。'}finally{$('reload').disabled=false}}
    async function save(x,sel){const old=x.status;sel.disabled=true;$('msg').textContent='保存しています…';try{await api('website_inquiries?id=eq.'+encodeURIComponent(x.id),{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({status:sel.value})});x.status=sel.value;$('msg').textContent='対応状況を保存しました。';render()}catch{sel.value=old;$('msg').textContent='保存できませんでした。'}finally{sel.disabled=false}}
    $('reload').onclick=load;$('filter').onchange=render;$('search').oninput=render;load();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  })();
  </script>
</body>
</html>
