<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仕訳の元データ確認｜博多油そば151</title><link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#17252c;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.55}main{max-width:920px;margin:auto;padding:18px 15px 80px}h1{font-size:26px;margin:12px 0 3px}h2{font-size:19px;margin:0 0 10px}.muted{color:#53636b;font-size:13px}.card{background:#fff;border:1px solid #e5e9eb;border-radius:16px;padding:17px;margin:13px 0}.notice{background:#fff8e9;border-color:#eadbb3}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.controls label{flex:1;min-width:160px;font-weight:700;font-size:13px}.controls input,.controls select{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #cbd3d7;border-radius:9px;font-size:16px}.controls button{border:0;border-radius:9px;background:#173a45;color:#fff;padding:10px 17px;min-height:44px;font:inherit;font-weight:700}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid #e7ebed;padding:10px 7px;text-align:left}td.amount{text-align:right;white-space:nowrap}.error{color:#a71920}
</style></head><body><main><a id="back" href="/filing-readiness.html">← 申告準備の確認</a><h1>仕訳の元データを確認</h1><p class="muted">日次締めと登録経費を、仕訳にする前に店舗・月ごとに並べます。</p>
<section class="card notice"><b>現在は確認のみ</b><p>申告者と開始残高が未確認のため、仕訳へ自動転記しません。売上と経費を合算した利益を確定額として扱わず、請求書との重複・税区分・証憑を確認してください。</p></section>
<section class="card"><div class="controls"><label>店舗<select id="store"><option value="1">151 長浜店</option><option value="2">151 白木原店</option></select></label><label>対象月<input id="month" type="month"></label><button id="refresh" type="button">表示</button></div><p id="status" class="muted" role="status" aria-live="polite"></p></section>
<section class="card"><h2>日次締めの売上</h2><p id="sales-summary" class="muted"></p><div id="sales" class="tablewrap"></div><p class="muted">ここには締め済みの日だけを表示します。未締めの日は店長ホームで確認してください。</p></section>
<section class="card"><h2>現金差額と決済内訳</h2><p id="cash-summary" class="muted"></p><div id="cash" class="tablewrap"></div><p class="muted">PayPay・その他の金額はPOSの売上内訳です。実際の振込や銀行入金との照合はまだ行っていません。</p></section>
<section class="card"><h2>登録経費</h2><p id="expenses-summary" class="muted"></p><div id="expenses" class="tablewrap"></div></section>
</main><script src="/cash-reconciliation.js"></script><script src="/journal-sources.js" defer></script></body></html>
