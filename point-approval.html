<script src="/machi-ui-config.js"></script>
<!doctype html><html lang=ja><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=/machi-design-system.css><title>ポイント承認</title><style>body{margin:0;background:var(--mo-bg);color:var(--mo-ink)}main{max-width:760px;margin:auto;padding:28px 16px}.ey{font-size:11px;letter-spacing:.15em;color:var(--mo-muted);font-weight:900}.card{padding:17px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:12px}.pts{font-size:22px;font-weight:950}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1}.empty{text-align:center;color:var(--mo-muted);padding:50px}</style></head><body><main><div class=ey>MACHI ORDER · POINT APPROVAL</div><h1>ポイント承認</h1><p>自動判定・店長GOODを、給与反映前に確認。</p><div id=list class=empty>確認しています…</div></main><script>
const API='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/points-api?store_id=1',tok=()=>localStorage.getItem('access_token')||localStorage.getItem('sb_access_token')||localStorage.getItem('machi_access_token')||'',esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function load(){const r=await fetch(API,{headers:{Authorization:'Bearer '+tok()}}),j=await r.json();if(!r.ok){list.innerHTML=esc(j.error||'取得できません');return}const a=(j.ledger||[]).filter(x=>x.status==='pending');list.className='';list.innerHTML=a.length?a.map(x=>`<section class="mo-card card"><div class=row><b>${esc(x.reason)}</b><span class=pts>+${x.points}pt</span></div><small>${new Date(x.earned_at).toLocaleString('ja-JP')}</small><div class=actions><button class="mo-btn mo-btn-secondary" onclick="act('reject',${x.id})">見送る</button><button class="mo-btn mo-btn-primary" onclick="act('approve',${x.id})">承認する</button></div></section>`).join(''):'<div class=empty>承認待ちはありません ✓</div>'}async function act(action,id){const r=await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+tok(),'Content-Type':'application/json'},body:JSON.stringify({action,id})});if(r.ok)load();else alert((await r.json()).error||'更新できません')}load();
</script></body></html>
