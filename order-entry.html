<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>博多油そば151｜注文</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f4ef;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:520px;margin:auto;padding:22px 18px 40px}.brand{font-size:12px;letter-spacing:.14em;font-weight:800;margin-top:14px}.hero{font-size:30px;line-height:1.25;font-weight:900;margin:12px 0 8px}.help{color:#666;line-height:1.6;margin-bottom:24px}.choice{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e7e4de;border-radius:22px;padding:21px 18px;margin:12px 0;min-height:112px}.choice strong{display:block;font-size:20px;margin-bottom:7px}.choice span{color:#666;font-size:14px;line-height:1.55}.primary{border:2px solid #171717}.badge{display:inline-block!important;width:auto!important;margin-top:10px;padding:5px 9px;border-radius:999px;background:#f0efe9;color:#333!important;font-size:12px!important;font-weight:800}.langs{display:flex;gap:7px;overflow:auto;padding:5px 0 14px}.langs button{border:0;background:#fff;border-radius:999px;padding:10px 12px;min-height:44px;white-space:nowrap}.foot{text-align:center;color:#888;font-size:12px;line-height:1.6;margin-top:20px}</style><main><div class="brand">HAKATA ABURASOBA 151</div><div class="langs"><button>日本語</button><button>English</button><button>한국어</button><button>简体中文</button><button>繁體中文</button></div><div class="hero">注文方法を<br>選んでください</div><div class="help">どちらを選んでも、同じメニュー・同じ価格で注文できます。</div><a id="line" class="choice primary"><strong>LINEで注文する</strong><span>公式LINEを追加して注文。クーポンやお得な情報も受け取れます。</span></a><a id="direct" class="choice"><strong>そのまま注文する</strong><span>LINE登録なしで、すぐに注文できます。</span><span class="badge">登録不要・最短</span></a><div class="foot">LINEの友だち追加は必須ではありません。<br>外国語メニューも順次対応します。</div><script>const q=new URLSearchParams(location.search);const token=q.get('t');const direct=document.getElementById('direct');direct.href=token?'index.html?t='+encodeURIComponent(token)+'&entry=direct_qr':'index.html?entry=direct_qr';const line=document.getElementById('line');const lu=localStorage.getItem('mo_line_entry_url');if(lu){line.href=lu+(lu.includes('?')?'&':'?')+(token?'t='+encodeURIComponent(token):'')}else{line.addEventListener('click',e=>{e.preventDefault();alert('LINE連携は準備中です。今は「そのまま注文する」をご利用ください。')})}</script></main></html>
