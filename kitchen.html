<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f2"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><title>厨房｜MACHI ORDER</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.top{position:sticky;top:0;z-index:20;background:rgba(245,245,242,.96);backdrop-filter:blur(14px);border-bottom:1px solid #e4e4df;padding:16px 18px 12px}.brand{font-size:11px;letter-spacing:.14em;color:#777;font-weight:800}.head{display:flex;align-items:end;justify-content:space-between;gap:12px}.head h1{font-size:27px;margin:4px 0 0}.sync{font-size:12px;color:#666}.tabs{display:flex;gap:8px;margin-top:13px}.tab{border:0;border-radius:999px;padding:10px 14px;font-weight:850;background:#fff;color:#555}.tab.on{background:#171717;color:#fff}.wrap{padding:14px 14px 92px;max-width:1180px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:13px}.card{background:#fff;border:1px solid #e7e7e2;border-radius:22px;overflow:hidden}.card.urgent{border:2px solid #171717}.meta{display:flex;justify-content:space-between;align-items:center;padding:15px 16px 10px}.seat{font-size:25px;font-weight:950}.age{font-size:13px;font-weight:850;padding:7px 9px;background:#f0f0ec;border-radius:999px}.items{padding:0 16px 12px}.item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid #efefeb}.item:first-child{border-top:0}.iname{font-size:17px;font-weight:850}.qty{font-size:21px;font-weight:950;white-space:nowrap}.opts{font-size:13px;color:#666;margin-top:4px}.note{margin:0 16px 13px;padding:11px 12px;background:#f6f4ef;border-radius:12px;font-size:14px;font-weight:700}.act{width:100%;border:0;border-top:1px solid #eee;padding:17px;font-size:17px;font-weight:950;background:#171717;color:#fff;min-height:58px}.cooking .act{background:#fff;color:#171717}.empty{text-align:center;padding:70px 20px;color:#777}.empty b{display:block;color:#222;font-size:22px;margin-bottom:8px}.error{max-width:600px;margin:20px auto;background:#fff;padding:20px;border-radius:18px}.mo-appnav{position:sticky;bottom:0;z-index:40;display:flex;justify-content:space-around;background:rgba(255,255,255,.97);border-top:1px solid #ddd;padding:7px 6px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.mo-appnav a{min-width:58px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#666;font:700 11px -apple-system,sans-serif;border-radius:12px}.mo-appnav b{font-size:20px;line-height:22px}.mo-appnav .active{color:#111;background:#f0f0ec}@media(min-width:800px){.wrap{padding:18px 20px 92px}.grid{grid-template-columns:repeat(3,1fr)}}
</style><link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script></head><body><header class="top"><div class="brand">MACHI ORDER · KITCHEN</div><div class="head"><h1>厨房</h1><div id="sync" class="sync">接続中…</div></div><div class="tabs"><button class="tab on" data-filter="all">すべて <span id="nall">0</span></button><button class="tab" data-filter="new">新規 <span id="nnew">0</span></button><button class="tab" data-filter="cooking">調理中 <span id="ncook">0</span></button></div></header><main class="wrap"><div id="app" class="empty"><b>注文を確認しています</b>少しお待ちください</div></main><nav class="mo-appnav"><a href="/store-command.html"><b>⌂</b>ホーム</a><a class="active" href="/kitchen.html"><b>🍳</b>厨房</a><a href="/today.html"><b>✓</b>今日</a><a href="/cashier.html"><b>¥</b>会計</a><a href="/staff.html"><b>☰</b>その他</a></nav><script>
const BASE='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/kitchen-api?store_id=1';let orders=[],filter='all',busy=new Set(),seen=new Set(),first=true;const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function token(){return localStorage.getItem('access_token')||localStorage.getItem('sb_access_token')||localStorage.getItem('machi_access_token')||''}function age(t){const m=Math.max(0,Math.floor((Date.now()-new Date(t))/60000));return m<1?'今':m+'分'}function seat(o){const t=o.dining_tables;return t?.name||t?.seat_code||('注文 #'+o.id)}function sound(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),osc=c.createOscillator(),g=c.createGain();osc.connect(g);g.connect(c.destination);osc.frequency.value=880;g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);osc.start();osc.stop(c.currentTime+.18)}catch{}}function render(){const xs=orders.filter(o=>filter==='all'||o.status===filter);nall.textContent=orders.length;nnew.textContent=orders.filter(o=>o.status==='new').length;ncook.textContent=orders.filter(o=>o.status==='cooking').length;if(!xs.length){app.innerHTML='<div class="empty"><b>いま対応する注文はありません</b>新しい注文が入るとここに表示されます</div>';return}app.innerHTML='<div class="grid">'+xs.map(o=>`<article class="card ${o.status==='cooking'?'cooking':''} ${Date.now()-new Date(o.ordered_at)>10*60000?'urgent':''}"><div class="meta"><div class="seat">${esc(seat(o))}</div><div class="age">${age(o.ordered_at)}</div></div><div class="items">${(o.order_items||[]).map(i=>`<div class="item"><div><div class="iname">${esc(i.product_name_snapshot)}</div>${(i.order_item_options||[]).length?`<div class="opts">${i.order_item_options.map(z=>esc(z.option_name_snapshot)).join('・')}</div>`:''}${i.customer_note?`<div class="opts">${esc(i.customer_note)}</div>`:''}</div><div class="qty">×${i.quantity}</div></div>`).join('')}</div>${o.customer_note?`<div class="note">📝 ${esc(o.customer_note)}</div>`:''}<button class="act" data-id="${o.id}" data-next="${o.status==='new'?'cooking':'served'}" ${busy.has(o.id)?'disabled':''}>${busy.has(o.id)?'更新中…':o.status==='new'?'調理する':'できた・提供へ'}</button></article>`).join('')+'</div>';document.querySelectorAll('.act').forEach(b=>b.addEventListener('click',()=>move(Number(b.dataset.id),b.dataset.next)))}async function load(){const t=token();if(!t){app.innerHTML='<div class="error"><b>ログインが必要です</b><br>スタッフ画面からログインしてください。</div>';sync.textContent='未ログイン';return}try{const r=await fetch(BASE,{headers:{Authorization:'Bearer '+t}}),j=await r.json();if(!r.ok)throw Error(j.error||'注文を取得できません');const ids=new Set((j.orders||[]).filter(o=>o.status==='new').map(o=>o.id));if(!first&&[...ids].some(id=>!seen.has(id)))sound();seen=ids;first=false;orders=j.orders||[];sync.textContent='更新 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});render()}catch(e){sync.textContent='再接続中';if(!orders.length)app.innerHTML='<div class="error"><b>注文を取得できません</b><br>'+esc(e.message)+'<br>自動で再接続します。</div>'}}async function move(id,next){if(busy.has(id))return;busy.add(id);render();try{const r=await fetch(BASE,{method:'PATCH',headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify({order_id:id,status:next})}),j=await r.json();if(!r.ok)throw Error(j.error||'更新できません');await load()}catch(e){alert(e.message);await load()}finally{busy.delete(id);render()}}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()}));load();setInterval(load,5000);setInterval(render,30000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
