const BASE='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/kitchen-api?store_id=1',AUTH='https://tejglrlkaqolbghoagqj.supabase.co/auth/v1/token',KEY='sb_publishable_beZla85Y6Ngrx0hji9I9rg_FbcRSUoT';let orders=[],filter='all',busy=new Set(),seen=new Set(),first=true,audioContext=null,soundReady=false,wakeLock=null;const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function rawToken(){return localStorage.getItem('machi_access_token')||localStorage.getItem('mo_staff_token')||localStorage.getItem('access_token')||localStorage.getItem('sb_access_token')||''}function saveSession(j){localStorage.setItem('machi_access_token',j.access_token);localStorage.setItem('mo_staff_token',j.access_token);if(j.refresh_token)localStorage.setItem('machi_refresh_token',j.refresh_token);localStorage.setItem('machi_token_expires_at',String(Date.now()+Math.max(60,Number(j.expires_in)||3600)*1000))}async function token(){let t=rawToken(),exp=Number(localStorage.getItem('machi_token_expires_at')||0),refresh=localStorage.getItem('machi_refresh_token')||'';if(t&&(!exp||Date.now()<exp-60000))return t;if(!refresh)return t;try{const r=await fetch(AUTH+'?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh})}),j=await r.json();if(!r.ok)throw Error();saveSession(j);return j.access_token}catch{return t}}function clearSession(){['machi_access_token','mo_staff_token','access_token','sb_access_token','machi_refresh_token','machi_token_expires_at'].forEach(k=>localStorage.removeItem(k))}function age(t){const m=Math.max(0,Math.floor((Date.now()-new Date(t))/60000));return m<1?'今':m+'分'}function seat(o){const t=o.dining_tables;return t?.name||t?.seat_code||('注文 #'+o.id)}function sound(){if(!soundReady||!audioContext)return;try{[0,.16,.32].forEach((delay,i)=>{const osc=audioContext.createOscillator(),g=audioContext.createGain(),at=audioContext.currentTime+delay;osc.connect(g);g.connect(audioContext.destination);osc.frequency.value=i===1?1040:880;g.gain.setValueAtTime(.12,at);g.gain.exponentialRampToValueAtTime(.001,at+.13);osc.start(at);osc.stop(at+.14)})}catch{}}async function keepAwake(){try{if('wakeLock'in navigator&&!wakeLock)wakeLock=await navigator.wakeLock.request('screen')}catch{}}async function enableSound(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)throw Error();audioContext=audioContext||new A();await audioContext.resume();soundReady=true;soundButton.textContent='🔔 通知音ON済み';soundButton.classList.add('on');sound();await keepAwake()}catch{alert('通知音を有効にできませんでした。端末の音量と消音設定を確認してください。')}}function render(){const xs=orders.filter(o=>filter==='all'||o.status===filter);nall.textContent=orders.length;nnew.textContent=orders.filter(o=>o.status==='new').length;ncook.textContent=orders.filter(o=>o.status==='cooking').length;if(!xs.length){app.innerHTML='<div class="empty"><b>いま対応する注文はありません</b>新しい注文が入るとここに表示されます</div>';return}app.innerHTML='<div class="grid">'+xs.map(o=>`<article class="card ${o.status==='cooking'?'cooking':''} ${Date.now()-new Date(o.ordered_at)>10*60000?'urgent':''}"><div class="meta"><div class="seat">${esc(seat(o))}</div><div class="age">${age(o.ordered_at)}</div></div><div class="items">${(o.order_items||[]).map(i=>`<div class="item"><div><div class="iname">${esc(i.product_name_snapshot)}</div>${(i.order_item_options||[]).length?`<div class="opts">${i.order_item_options.map(z=>esc(z.option_name_snapshot)).join('・')}</div>`:''}${i.customer_note?`<div class="opts">${esc(i.customer_note)}</div>`:''}</div><div class="qty">×${i.quantity}</div></div>`).join('')}</div>${o.customer_note?`<div class="note">📝 ${esc(o.customer_note)}</div>`:''}<button class="act" data-id="${o.id}" data-next="${o.status==='new'?'cooking':'served'}" ${busy.has(o.id)?'disabled':''}>${busy.has(o.id)?'更新中…':o.status==='new'?'調理する':'できた・提供へ'}</button></article>`).join('')+'</div>';document.querySelectorAll('.act').forE erval(render,30000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});

(()=>{const bar=document.createElement('div');bar.className='undo';bar.id='undo-bar';bar.innerHTML='<b id="undo-message">提供完了にしました</b><button id="undo-button" type="button">取り消す</button>';document.body.appendChild(bar);let undoOrderId=null,undoTimer=null;function hideUndo(){bar.classList.remove('show');undoOrderId=null;clearTimeout(undoTimer)}function showUndo(order){undoOrderId=Number(order.id);document.getElementById('undo-message').textContent=seat(order)+'を提供完了にしました';bar.classList.add('show');clearTimeout(undoTimer);undoTimer=setTimeout(hideUndo,10000)}const originalMove=move;move=async function(id,next){if(next!=='served')return originalMove(id,next);if(busy.has(id))return;const order=orders.find(x=>Number(x.id)===Number(id));busy.add(id);render();try{const response=await fetch(BASE,{method:'PATCH',headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:JSON.stringify({order_id:id,status:next})}),result=await response.json();if(!response.ok)throw Error(result.error||'更新できません');if(order)showUndo(order);await load()}catch(error){alert(error.message);await load()}finally{busy.delete(id);render()}};document.getElementById('undo-button').addEventListener('click',async()=>{if(!undoOrderId)return;const id=undoOrderId;document.getElementById('undo-button').disabled=true;try{const response=await fetch(BASE,{method:'PATCH',headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:JSON.stringify({order_id:id,status:'cooking',undo:true})}),result=await response.json();if(!response.ok)throw Error(result.error||'取り消しできません');hideUndo();await load()}catch(error){alert(error.message)}finally{document.getElementById('undo-button').disabled=false}});function networkState(){sync.classList.toggle('offline',!navigator.onLine);if(!navigator.onLine)sync.textContent='オフライン・再接続待ち'}addEventListener('offline',networkState);addEventListener('online',()=>{networkState();load()});networkState()})();

(()=>{const style=document.createElement('style');style.textContent='@keyframes moPulse{50%{transform:scale(1.06);box-shadow:0 0 0 8px #e51b2322}}.sound.attention{animation:moPulse 1s infinite;background:#b71920}';document.head.appendChild(style);const originalRender=render;render=function(){originalRender();const count=orders.filter(order=>order.status==='new').length;document.title=count?'● 新規'+count+'件｜厨房':'厨房｜MACHI ORDER';soundButton.classList.toggle('attention',count>0&&!soundReady);if(count>0&&!soundReady)soundButton.textContent='🔕 タップで通知音ON'};const originalSound=sound;sound=function(){if('vibrate'in navigator)navigator.vibrate([250,120,250,120,500]);originalSound()};soundButton.addEventListener('click',()=>setTimeout(()=>{if(soundReady)localStorage.setItem('machi_kitchen_sound','on')},100));if(localStorage.getItem('machi_kitchen_sound')==='on'){const resume=()=>{enableSound();document.removeEventListener('pointerdown',resume)};document.addEventListener('pointerdown',resume,{once:true});soundButton.textContent='🔔 画面をタップして通知ON'}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&audioContext?.state==='suspended')audioContext.resume().catch(()=>{})})})();
