<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e51b23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="151白木原厨房">
  <link rel="manifest" href="/kitchen-shirakibaru.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.svg">
  <title>白木原店 厨房｜MACHI ORDER</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px;background:#f5f5f2;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.card{width:min(100%,560px);background:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 60px #0001}.ey{font-size:12px;font-weight:900;letter-spacing:.14em;color:#e51b23}h1{margin:8px 0 18px;font-size:31px}.status{padding:15px;border-radius:14px;background:#fff1d6;border:1px solid #efc164;font-weight:900}.text{line-height:1.75;color:#555}.safe{padding:14px;border-radius:14px;background:#edf7ef;color:#12662c;font-weight:800}.back{display:block;margin-top:18px;padding:15px;border-radius:14px;background:#171717;color:#fff;text-decoration:none;text-align:center;font-weight:900}
  </style>
</head>
<body>
  <main class="card">
    <div class="ey">MACHI ORDER · KITCHEN</div>
    <h1>白木原店 厨房</h1>
    <div class="status">白木原店専用画面を開きます</div>
    <p class="text">店舗別の権限確認後、白木原店の注文だけを表示します。</p>
    <p class="safe">長浜店の注文は表示されません。</p>
    <a class="back" href="/kitchen.html?store=shirakibaru">白木原店の厨房を開く</a>
  </main>
  <script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});location.replace('/kitchen.html?store=shirakibaru');</script>
</body>
</html>
