<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e51b23">
  <title>新しいパスワード｜MACHI ORDER</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f7f3ee;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;display:grid;place-items:center;padding:20px}.box{width:min(100%,440px);background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 18px 60px #3a0b0b20}.brand{background:#e51b23;color:#fff;padding:28px 24px}.brand small{font-weight:900;letter-spacing:.16em}.brand h1{font-size:28px;margin:8px 0 0}.form{padding:24px}.lead{margin:0 0 18px;color:#555;line-height:1.6}.field{display:block;font-size:13px;font-weight:900;margin:14px 0 6px}input{width:100%;min-height:54px;border:1px solid #d8d2cc;border-radius:14px;padding:0 14px;font-size:16px;background:#fff}button{width:100%;min-height:56px;border:0;border-radius:15px;background:#171717;color:#fff;font-size:17px;font-weight:950;margin-top:18px}button:disabled{opacity:.55}.msg{min-height:24px;margin:14px 2px 0;color:#c5161d;font-size:14px;font-weight:750;line-height:1.5}.msg.ok{color:#16733b}.back{display:block;text-align:center;margin-top:15px;color:#b71920;font-weight:800}.note{border-top:1px solid #eee;padding:16px 24px 22px;color:#777;font-size:12px;line-height:1.6}
  </style>
</head>
<body>
  <main class="box">
    <header class="brand"><small>MACHI ORDER · STAFF</small><h1>新しいパスワード</h1></header>
    <form class="form" id="reset-form">
      <p class="lead" id="lead">新しく使うパスワードを2回入力してください。</p>
      <label class="field" for="password">新しいパスワード（8文字以上）</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <label class="field" for="confirm">新しいパスワードをもう一度</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
      <button id="submit" type="submit">このパスワードに変更する</button>
      <div class="msg" id="message" role="alert"></div>
      <a class="back" href="/login.html?next=/kitchen.html">ログイン画面へ戻る</a>
    </form>
    <div class="note">メールから開いたこの画面でのみ、パスワードを変更できます。</div>
  </main>
  <script>
    const SUPABASE='https://tejglrlkaqolbghoagqj.supabase.co';
    const KEY='sb_publishable_beZla85Y6Ngrx0hji9I9rg_FbcRSUoT';
    const hash=new URLSearchParams(location.hash.slice(1));
    const query=new URLSearchParams(location.search);
    let accessToken=hash.get('access_token')||sessionStorage.getItem('machi_recovery_access_token')||'';
    let refreshToken=hash.get('refresh_token')||sessionStorage.getItem('machi_recovery_refresh_token')||'';
    const m=document.getElementById('message'),form=document.getElementById('reset-form'),submit=document.getElementById('submit');
    async function prepare(){
      const tokenHash=query.get('token_hash'),type=query.get('type');
      if(!accessToken&&tokenHash&&type==='recovery'){
        const r=await fetch(SUPABASE+'/auth/v1/verify',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({token_hash:tokenHash,type:'recovery'})});
        const j=await r.json().catch(()=>({}));if(r.ok){accessToken=j.access_token||'';refreshToken=j.refresh_token||''}
      }
      if(accessToken){sessionStorage.setItem('machi_recovery_access_token',accessToken);if(refreshToken)sessionStorage.setItem('machi_recovery_refresh_token',refreshToken)}
      history.replaceState(null,'',location.pathname);
      if(!accessToken){m.textContent='この再設定リンクは無効か、期限が切れています。ログイン画面からもう一度メールを送ってください。';submit.disabled=true}
    }
    prepare().catch(()=>{m.textContent='再設定リンクを確認できませんでした。もう一度メールを送り直してください。';submit.disabled=true});
    form.addEventListener('submit',async e=>{
      e.preventDefault();m.className='msg';m.textContent='';
      const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
      if(password.length<8){m.textContent='8文字以上のパスワードを入力してください';return}
      if(password!==confirm){m.textContent='2つのパスワードが一致していません';return}
      submit.disabled=true;submit.textContent='変更しています…';
      try{
        const r=await fetch(SUPABASE+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({password})});
        const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.msg||j.error_description||'パスワードを変更できませんでした');
        localStorage.setItem('machi_access_token',accessToken);localStorage.setItem('mo_staff_token',accessToken);localStorage.setItem('machi_refresh_token',refreshToken);localStorage.setItem('machi_token_expires_at',String(Date.now()+3600*1000));
        sessionStorage.removeItem('machi_recovery_access_token');sessionStorage.removeItem('machi_recovery_refresh_token');
        m.className='msg ok';m.textContent='変更できました。厨房画面を開きます。';setTimeout(()=>location.replace('/kitchen.html'),700);
      }catch(err){m.textContent=err.message||'パスワードを変更できませんでした';submit.disabled=false;submit.textContent='このパスワードに変更する'}
    });
  </script>
</body>
</html>
