<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>申告準備の確認｜博多油そば151</title><link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#1b252a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.55}main{max-width:870px;margin:auto;padding:18px 15px 80px}h1{font-size:26px;margin:12px 0 3px}h2{font-size:19px;margin:0 0 12px}.muted{color:#56636b;font-size:13px}.card{background:#fff;border:1px solid #e4e8eb;border-radius:15px;padding:17px;margin:12px 0}.notice{background:#fff8e8;border-color:#ecdcae}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.controls label{flex:1;min-width:150px;font-weight:700;font-size:13px}.controls select,.controls input{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #c9d2d7;border-radius:9px;font-size:16px}.controls button{border:0;border-radius:9px;background:#173b43;color:#fff;padding:10px 17px;min-height:44px;font:inherit;font-weight:700}.check{border-top:1px solid #e8ebed;padding:13px 0}.check:first-child{border:0}.check b{display:block}.check a{display:inline-block;margin-top:6px;color:#126077}.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 8px;margin-right:6px;background:#e8eef1}.tag.action{background:#ffe7da}.tag.blocked{background:#f7dfe2}.tag.unknown{background:#e6e8ed}.error{color:#a71920}
</style></head><body><main><a id="back" href="/manager.html">← 店長ホーム</a><h1>申告準備の確認</h1><p class="muted">博多油そば151の店舗別データを確認します。申告書や確定した決算書を作る画面ではありません。</p>
<section class="card notice"><h2>現在の状態：準備中</h2><p>売上や参考利益を記録していますが、申告者・開始残高、現金と銀行の照合、棚卸、複式仕訳の実取引への適用がまだ必要です。画面上の利益を申告所得として使わないでください。</p></section>
<section class="card"><div class="controls"><label>店舗<select id="store"><option value="1">151 長浜店</option><option value="2">151 白木原店</option></select></label><label>対象年<input id="year" type="number" min="2000" max="2100"></label><button id="refresh" type="button">確認</button></div><p id="status" class="muted" role="status" aria-live="polite"></p></section>
<section class="card"><h2 id="summary-heading">数字の記録</h2><div id="summary" class="muted">読み込み中…</div><p class="muted">税込の管理用概算です。店舗別の数字であり、申告者全体の確定値ではありません。</p></section>
<section class="card"><h2>確認する項目</h2><div id="checks" role="status" aria-live="polite">読み込み中…</div></section>
</main><script src="/filing-readiness-rules.js"></script><script src="/filing-readiness.js" defer></script></body></html>
