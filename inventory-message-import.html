<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f2"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/machi-design-system.css"><script src="/inventory-text-parser.js"></script><title>在庫文章読み取り｜MACHI ORDER</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.top{padding:18px;border-bottom:1px solid #e4e4df;background:#f5f5f2ef;position:sticky;top:0;z-index:5}.top a{color:#555;text-decoration:none;font-weight:800}.top h1{font-size:27px;margin:10px 0 2px}.top small{color:#777}.wrap{max-width:760px;margin:auto;padding:14px 14px 80px}.card{background:#fff;border:1px solid #e4e4df;border-radius:20px;padding:16px;margin-bottom:12px}select,textarea{width:100%;border:1px solid #d8d8d2;border-radius:14px;padding:13px;background:#fff;font-size:16px}select{min-height:48px;margin:10px 0}textarea{min-height:270px;font:15px/1.6 -apple-system,sans-serif;resize:vertical}.primary{width:100%;min-height:52px;border:0;border-radius:14px;background:#171717;color:#fff;font-size:16px;font-weight:950;margin-top:10px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border-radius:16px;padding:14px;border:1px solid #e4e4df}.stat b{display:block;font-size:23px}.stat small,.meta,.raw{color:#777}.meta{font-size:13px;margin:0 0 12px}.group{margin:18px 0 7px;font-size:17px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 2px;border-top:1px solid #eee}.name{font-weight:900}.raw{font-size:12px;margin-top:3px}.value{font-weight:950;text-align:right}.pill{font-size:11px;background:#fff0c8;color:#704600;padding:4px 7px;border-radius:999px;display:inline-block;margin-top:4px}.unknown{background:#fff4e5;border-color:#efc27b}.empty{color:#777;padding:18px;text-align:center}.notice{background:#eef6ff;border-color:#b7d7f6;line-height:1.55}.notice b{display:block;margin-bottom:4px}@media(max-width:460px){.summary{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}</style></head>
<body><header class="top"><a href="/inventory.html">← 在庫へ戻る</a><h1>在庫文章を読み取る</h1><small>白木原・長浜 · LINE報告対応</small></header><main class="wrap"><section class="card"><b>在庫報告をそのまま貼り付け</b><p class="meta">コロンなし、全角記号、昼・夜、「1段目」「5P+6個」などの表記も原文のまま読み取ります。</p><select id="store"><option value="shirakibaru">白木原店</option><option value="nagahama">長浜店</option></select><textarea id="source" placeholder="9/20白木原 よる&#10;【冷蔵庫仕込み在庫】&#10;青ネギ:0.8（カットなし 3束）&#10;…"></textarea><button class="primary" id="parse">内容を分解する</button></section><div class="summary"><div class="stat"><b id="recognized">0</b><small>認識</small></div><div class="stat"><b id="unknown-count">0</b><small>要確認</small></div><div class="stat"><b id="attention">0</b><small>残り僅か</small></div></div><section class="card notice"><b>安全確認</b>ここでは文章を分解するだけで、実際の在庫数はまだ変更しません。一覧を確認してから登録する方式です。</section><div id="result"></div></main>
<script>const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));$('parse').onclick=()=>{const template=$('store').value,parsed=MachiInventoryParser.parseReport($('source').value,{template,store:MachiInventoryParser.TEMPLATES[template].store});$('recognized').textContent=parsed.summary.recognized;$('unknown-count').textContent=parsed.summary.unknown;$('attention').textContent=parsed.summary.attention;let html=parsed.header?`<p class="meta">${parsed.header.month}/${parsed.header.day} · ${parsed.header.store} · ${parsed.header.session==='midday'?'昼':parsed.header.session==='night'?'夜':'時間帯未判定'}</p>`:'<p class="meta">日付・店舗・昼夜を読み取れませんでした</p>';let current='';for(const row of parsed.rows){if(row.category!==current){current=row.category;html+=`<h2 class="group">${esc(current)}</h2>`}const value=row.quantity===null?row.status:(Number(row.quantity).toLocaleString()+(row.unit||'')+(row.detail?' · '+row.detail:''));html+=`<section class="card row"><div><div class="name">${esc(row.name)}</div><div class="raw">${esc(row.raw)}</div>${row.attention?'<span class="pill">残り僅か・要確認</span>':''}</div><div class="value">${esc(value||'数量なし')}</div></section>`}if(parsed.unknown.length){html+='<section class="card unknown"><b>読み取れなかった行</b>'+parsed.unknown.map(item=>`<div class="row"><span>${esc(item.line)}</span><span>要確認</span></div>`).join('')+'</section>'}if(!parsed.rows.length&&!parsed.unknown.length)html+='<div class="card empty">文章を貼り付けて「内容を分解する」を押してください</div>';$('result').innerHTML=html};if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></body></html>
