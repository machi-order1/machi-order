<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>顔確認の履歴｜MACHI ORDER</title>
<style>body{margin:0;background:#f5f2ed;color:#171717;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{background:#d92d2d;color:white;padding:20px}main{max-width:1000px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0}button,a{font-size:16px}button{padding:12px;border-radius:12px;border:0;background:#171717;color:white}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px}th,td{text-align:left;padding:12px;border-bottom:1px solid #ddd}small{color:#666}#message{color:#b42318}</style></head>
<body><header><h1>顔確認の履歴</h1></header><main><a href="/staff-management.html">← スタッフ名簿</a>
<p>直近100件。開始時刻は、名前が分からない段階の端末利用記録です。出勤時刻は勤怠画面で確認してください。履歴は30日を目安に、次の顔確認開始時に古い記録を削除します。</p>
<button id="refresh">履歴を更新</button><p id="message" role="status"></p><div class="card scroll"><table><thead><tr><th>店舗・開始時刻</th><th>顔の確認</th><th>PINで確認した本人</th></tr></thead><tbody id="rows"></tbody></table></div>
</main><script>
(() => {
  const token = () => localStorage.machi_access_token || localStorage.mo_staff_token || '';
  const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const time = s => s ? new Date(s).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}) : '—';
  async function load() {
    const button = document.getElementById('refresh'), message = document.getElementById('message');
    if (!token()) { message.textContent = '店長ログインが必要です。'; const link = document.createElement('a'); link.href='/login.html?next=/attendance-face-log.html'; link.textContent='ログインする'; message.append(' ',link); return; }
    button.disabled = true; message.textContent='読み込んでいます…';
    const controller = new AbortController(), timer = setTimeout(()=>controller.abort(),8000);
    try {
      const response = await fetch('https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/attendance-kiosk-api', {
        method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({action:'face_attempts'})
      });
      const data = await response.json(); if (!response.ok) throw Error(data.error || '読み込めませんでした');
      const names = new Map(data.people.map(x=>[x.id,x.display_name])), stores = new Map(data.stores.map(x=>[x.id,x.name]));
      document.getElementById('rows').innerHTML = data.attempts.map(x=>`<tr><td>${esc(stores.get(x.store_id) || x.store_id)}<br><small>${esc(time(x.started_at))}</small></td><td>${x.outcome==='matched' ? '候補：'+esc(names.get(x.matched_staff_id) || '—') : x.outcome==='fallback' ? '名前・PINへ切替' : '完了記録なし'}<br><small>${esc({timeout:'顔確認の時間切れ',camera_unavailable:'カメラを利用できず',model_unavailable:'顔確認の準備未完了',multiple_faces:'複数の顔',manual:'名前選択へ',no_confident_match:'一致する顔を確認できず'}[x.reason] || '')}</small></td><td>${esc(names.get(x.verified_staff_id) || '未確認')}<br><small>${esc(time(x.verified_at))}</small></td></tr>`).join('') || '<tr><td colspan="3">まだ顔確認の履歴はありません。</td></tr>';
      message.textContent='';
    } catch(e) { message.textContent=e.name==='AbortError' ? '通信を確認し、もう一度更新してください。' : e.message; }
    finally { clearTimeout(timer);button.disabled=false; }
  }
  document.getElementById('refresh').onclick=load; load();
})();
</script></body></html>
