<link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script><!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>原価入力</title><style>body{font-family:-apple-system,sans-serif;background:#f5f5f5;margin:0}main{max-width:800px;margin:auto;padding:16px}.c{background:#fff;padding:16px;border-radius:15px;margin:10px 0}input,select,button{font-size:16px;padding:10px;box-sizing:border-box;width:100%;margin:4px 0}.row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px}.warn{background:#fff8df}</style><main><h1>🧮 原価入力</h1><div class=c><input id=t placeholder="ログイントークン"><button onclick=load()>読込</button></div><div class="c warn">実際に分かっている数字だけ入力。単位換算が必要な材料は、仕入単位とレシピ使用単位を揃えてから登録してください。</div><h2>⓪ 仕入価格から自動換算</h2><div class=c><select id=pi></select><input id=pp type=number step=.01 placeholder="仕入価格（円）"><input id=pu placeholder="仕入単位（例 袋・ケース）"><input id=cq type=number step=.001 placeholder="1個あたり内容量"><select id=cu><option>g</option><option>kg</option><option>ml</option><option>L</option><option>個</option><option>本</option><option>枚</option><option>玉</option><option>食</option></select><input id=pc type=number step=.001 value=1 placeholder="入数"><input id=yr type=number step=.1 value=100 placeholder="歩留まり %"><button onclick=purchase()>1g・1ml・1個あたり原価へ換算</button><div id=pr></div></div><h2>① 材料単価</h2><div id=items></div><h2>② 商品レシピ</h2><div class=c><select id=p></select><select id=i></select><input id=q type=number step=0.001 placeholder="使用量"><select id=u><option>g</option><option>kg</option><option>ml</option><option>L</option><option>個</option><option>本</option><option>枚</option><option>玉</option><option>食</option></select><button onclick=component()>材料を追加・更新</button></div><h2>③ 商品原価へ反映</h2><div class=c><button onclick=recalc()>レシピから全商品を再計算</button><div id=res></div></div></main><script>const A='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/costing-api?store_id=1';t.value=localStorage.mo_staff_token||'';let J;async function api(b){let r=await fetch(A,{method:'POST',headers:{Authorization:'Bearer '+localStorage.mo_staff_token,'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)alert(j.error||'エラー');return j}async function load(){localStorage.mo_staff_token=t.value.trim();let r=await fetch(A,{headers:{Authorization:'Bearer '+localStorage.mo_staff_token}});J=await r.json();items.innerHTML=(J.items||[]).map(x=>`<div class="c row"><b>${x.name}<small> / ${x.unit||''}</small></b><input id="c${x.id}" type=number step=.01 value="${x.unit_cost||0}"><button onclick="cost(${x.id})">保存</button></div>`).join('');pi.innerHTML=(J.items||[]).map(x=>`<option value=${x.id}>${x.name}</option>`).join('');p.innerHTML=(J.products||[]).map(x=>`<option value=${x.id}>${x.name}（現在 ¥${x.cost_price||0}）</option>`).join('');i.innerHTML=(J.items||[]).map(x=>`<option value=${x.id}>${x.name}</option>`).join('')}async function purchase(){let j=await api({action:'set_purchase_unit',inventory_item_id:Number(pi.value),purchase_price:Number(pp.value),purchase_unit:pu.value,content_quantity:Number(cq.value),content_unit:cu.value,pieces_per_pack:Number(pc.value||1),yield_rate:Number(yr.value||100)});if(j.ok){pr.textContent='換算原価：¥'+j.unit_cost+' / '+j.content_unit+'（kg→g、L→ml は自動変換済み）';load()}}async function cost(id){await api({action:'set_material_cost',inventory_item_id:id,unit_cost:Number(document.getElementById('c'+id).value)});alert('保存しました')}async function component(){await api({action:'set_component',product_id:Number(p.value),inventory_item_id:Number(i.value),quantity:Number(q.value),unit:u.value});alert('レシピ保存')}async function recalc(){let j=await api({action:'recalculate'});res.innerHTML='更新商品数：'+(j.updated||0)+'<br>保留商品数：'+(j.blocked_products||0)+(j.issues?.length?'<br><b>⚠️ 原価未設定・単位不一致がある商品は更新していません。</b>':'<br>✅ 原価チェックOK');load()}load()</script></html>
