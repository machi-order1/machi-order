<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e51b23">
  <meta name="robots" content="index,follow">
  <title>テイクアウト注文｜博多油そば151 長浜店</title>
  <style>
    :root{--red:#e51b23;--ink:#171717;--paper:#f7f4ef;--line:#ddd6cf}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button,input,textarea{font:inherit}header{background:#111;color:#fff;padding:22px 18px}.head{max-width:760px;margin:auto;display:flex;align-items:center;gap:18px}.logo{width:118px}.head h1{font-size:24px;margin:0 0 4px}.head p{margin:0;color:#bbb;font-size:13px}main{max-width:760px;margin:auto;padding:16px 14px 120px}.notice{background:#fff4ce;border:1px solid #e5c04e;padding:13px 15px;border-radius:14px;line-height:1.55;font-size:13px}.tabs{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:#f7f4eff2;padding:12px 0;z-index:5}.tab,.secondary{border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 15px;font-weight:800;white-space:nowrap}.tab.on{background:#111;color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;margin:10px 0;display:grid;grid-template-columns:82px 1fr auto;gap:12px;align-items:center}.photo{width:82px;height:82px;border-radius:12px;object-fit:cover;background:#eee}.name{font-weight:900}.desc{font-size:12px;color:#777;margin-top:4px}.price{font-weight:950;color:#b71920}.pick{border:0;background:var(--red);color:#fff;border-radius:11px;padding:10px 12px;font-weight:900;margin-top:7px}.pick:disabled{background:#aaa}.cart{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:736px;margin:auto;background:#111;color:#fff;border-radius:17px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;z-index:9;box-shadow:0 9px 30px #0005}.cart button,.primary{border:0;background:var(--red);color:#fff;border-radius:12px;padding:13px 16px;font-weight:900}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end}.sheet{background:var(--paper);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}.sheet h2{margin-top:0}.choice{width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin:6px 0}.choice.on{border-color:var(--red);background:#fff0f0}.qty{display:flex;align-items:center;gap:10px}.qty button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px}.line{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px}.field{margin:12px 0}.field label{display:block;font-weight:900;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #aaa;background:#fff;border-radius:10px;padding:13px}.field textarea{min-height:80px}.primary{width:100%;min-height:54px;font-size:17px}.primary:disabled{opacity:.5}.error{color:#a41017;font-weight:800}.success{text-align:center;padding:28px 8px}.success b{display:block;font-size:28px}.success .num{font-size:42px;color:var(--red);margin:15px}.sold{opacity:.5}@media(max-width:480px){.head{gap:12px}.logo{width:96px}.head h1{font-size:20px}.card{grid-template-columns:72px 1fr auto;gap:9px}.photo{width:72px;height:72px}.name{font-size:14px}.pick{padding:9px}}
  </style>
<link rel="stylesheet" href="/customer-menu.css"><script src="/customer-options.js"></script></head>
<body>
  <header><div class="head"><img class="logo" src="/assets/brand/151-logo-white.webp" alt="博多油そば151"><div><h1>長浜店 テイクアウト</h1><p>受取時に店頭でお支払い（現金・PayPay）</p></div></div></header>
  <main><div id="notice" class="notice"><b>受取可能時刻を確認しています。</b><br>混雑状況により、受取時刻が前後する場合があります。</div><div id="tabs" class="tabs"></div><div id="menu">メニューを読み込んでいます…</div></main>
  <div id="cart" class="cart hidden"><b id="sum"></b><button id="open">注文内容へ</button></div><div id="modal" class="hidden"></div>
  <script>
  (()=>{'use strict';
    const API='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/takeout-api?store_id=1',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');let data,cart=[],current,selected={},qty=1,sending=false;
    const photos={1:'hakata-aburasoba.webp',2:'ebi-shio-aburasoba.webp',3:'iki-beef-hakata.webp',4:'iki-beef-ebi-shio.webp',5:'chashu-hakata.webp',6:'chashu-ebi-shio.webp',7:'double-aburasoba.webp',8:'double-aburasoba.webp',9:'extra-chashu.webp',10:'takana.webp',11:'spicy-takana.webp',12:'raw-egg.webp',13:'half-boiled-egg.webp',14:'iki-premium-beef.webp',15:'dashi.webp',16:'set-a.webp',17:'set-b.webp',18:'set-c.webp',19:'set-d.webp',20:'set-e.webp',21:'dumplings-3.webp',22:'dumplings-5.webp',23:'edamame.webp',24:'iriko-mayo.webp',25:'grilled-chashu.webp',29:'beer.webp',30:'highball.webp',31:'lemon-sour.webp',35:'cola.webp',36:'ginger-ale.webp',37:'orange-juice.webp',38:'calpis.webp',39:'oolong-tea.webp'};
    function roots(){return (data.categories||[]).filter(x=>!x.parent_id).flatMap(r=>{const c=data.categories.filter(x=>Number(x.parent_id)===Number(r.id));return c.length?c:[r]})}function groups(p){return(p.option_group_ids||[]).map(id=>data.option_groups.find(g=>Number(g.id)===Number(id))).filter(Boolean)}function options(ids){return ids.flatMap(id=>(data.option_groups||[]).flatMap(g=>(g.options||[]).filter(o=>Number(o.id)===Number(id))))}function delta(){return options(Object.values(selected).flat()).reduce((s,o)=>s+Number(o.price_delta||0),0)}function localValue(date){return new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16)}function roundUp(date){const value=new Date(date);value.setMinutes(Math.ceil(value.getMinutes()/10)*10,0,0);return value}function clearSubmission(){sessionStorage.removeItem('machi_takeout_pending')}
    async function load(){try{const r=await fetch(API),j=await r.json();if(!r.ok)throw Error(j.error);data=j;render()}catch(e){$('menu').innerHTML='<p class="error">現在、テイクアウト注文を読み込めません。時間をおいてお試しください。</p>'}}
    function render(){const lead=Number(data.settings?.min_lead_minutes||10);$('notice').innerHTML=`<b>受取希望時刻の${lead}分前まで注文できます。</b><br>混雑状況により、受取時刻が前後する場合があります。`;$('tabs').innerHTML=roots().map((c,i)=>`<button class="tab ${i?'':'on'}" data-c="${c.id}">${esc(c.name)}</button>`).join('');$('menu').innerHTML=roots().map(c=>{const ids=data.categories.filter(x=>Number(x.id)===Number(c.id)||Number(x.parent_id)===Number(c.id)).map(x=>Number(x.id));return`<section id="c${c.id}"><h2>${esc(c.name)}</h2>${data.products.filter(p=>ids.includes(Number(p.category_id))).map(card).join('')}</section>`}).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>pick(Number(b.dataset.p)));document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>document.getElementById('c'+b.dataset.c)?.scrollIntoView({behavior:'smooth',block:'start'}))}
    function card(p){const sold=p.sale_status!=='available',src=p.image_url||(`/assets/menu-items/web/${photos[Number(p.id)]||'hakata-aburasoba.webp'}`);return`<article class="card ${sold?'sold':''}"><img class="photo" src="${esc(src)}" alt="${esc(p.name)}" loading="lazy"><div><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||'')}</div></div><div><div class="price">${yen(p.price)}</div><button class="pick" data-p="${p.id}" ${sold?'disabled':''}>${sold?'売切':'選ぶ'}</button></div></article>`}
    function pick(id){current=data.products.find(p=>Number(p.id)===id);selected={};groups(current).forEach(g=>selected[g.id]=[]);qty=1;product()}
    function product(){const unit=Number(current.price)+delta();$('modal').className='modal';$('modal').innerHTML=`<div class="sheet"><h2>${esc(current.name)}</h2>${CustomerOptions.render(groups(current),selected,esc,yen)}<p class="desc">変更内容はこの一杯に反映します。内容が違う場合は別々に追加してください。</p><h3>数量</h3><div class="qty"><button data-q="-1">−</button><b>${qty}</b><button data-q="1">＋</button></div><button id="add" class="primary">${yen(unit*qty)}　カートに追加</button><button id="close" class="choice">閉じる</button></div>`;document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{const top=$('modal').querySelector('.sheet').scrollTop;const left=$('modal').querySelector('.topping-strip')?.scrollLeft||0;if(!CustomerOptions.toggle(groups(current),selected,Number(b.dataset.group),Number(b.dataset.option)))return;product();$('modal').querySelector('.sheet').scrollTop=top;const strip=$('modal').querySelector('.topping-strip');if(strip)strip.scrollLeft=left});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{qty=Math.max(1,Math.min(20,qty+Number(b.dataset.q)));product()});$('add').onclick=add;$('close').onclick=close}
    function add(){const error=CustomerOptions.validate(groups(current),selected);if(error)return alert(error);const ids=Object.values(selected).flat();clearSubmission();cart.push({product_id:current.id,name:current.name,quantity:qty,option_ids:ids,option_names:options(ids).map(o=>o.name),price:Number(current.price)+delta()});close();update()}
    function update(){const n=cart.reduce((s,x)=>s+x.quantity,0),t=cart.reduce((s,x)=>s+x.quantity*x.price,0);$('cart').classList.toggle('hidden',!n);$('sum').textContent=`${n}点　${yen(t)}`}
    function showCart(){const t=cart.reduce((s,x)=>s+x.quantity*x.price,0),lead=Number(data.settings?.min_lead_minutes||10),advance=Number(data.settings?.max_advance_minutes||1440),minimum=roundUp(new Date(Date.now()+lead*60000)),maximum=new Date(Date.now()+advance*60000),suggested=localValue(minimum),min=localValue(minimum),max=localValue(maximum);$('modal').className='modal';$('modal').innerHTML=`<div class="sheet"><h2>注文内容</h2>${cart.map((x,i)=>`<div class="line"><div><b>${esc(x.name)} ×${x.quantity}</b><div class="desc">${esc((x.option_names||[]).join('・'))}</div></div><div><b>${yen(x.price*x.quantity)}</b><br><button class="secondary" data-del="${i}">削除</button></div></div>`).join('')}<h2>合計 ${yen(t)}</h2><div class="field"><label>お名前</label><input id="name" autocomplete="name" maxlength="80" required></div><div class="field"><label>電話番号</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" required></div><div class="field"><label>受取希望時刻</label><input id="pickup" type="datetime-local" value="${suggested}" min="${min}" max="${max}" required><div class="desc">最短${lead}分後から選べます</div></div><div class="field"><label>ご要望（任意）</label><textarea id="note" maxlength="500" placeholder="アレルギー対応の確約はできません"></textarea></div><input id="website" class="hidden" tabindex="-1" autocomplete="off"><p id="err" class="error"></p><button id="send" class="primary">注文を確定する（店頭払い）</button><button id="close" class="choice">戻る</button></div>`;document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{clearSubmission();cart.splice(Number(b.dataset.del),1);update();cart.length?showCart():close()});$('send').onclick=send;$('close').onclick=close}
    async function send(){if(sending)return;const name=$('name').value.trim(),phone=$('phone').value.trim(),pickup=$('pickup').value;if(!name||!phone||!pickup){$('err').textContent='お名前・電話番号・受取時刻を入力してください。';return}if(pickup<$('pickup').min||pickup>$('pickup').max){$('err').textContent='選択できる範囲内の受取時刻を指定してください。';return}const base={name,phone,pickup_at:new Date(pickup).toISOString(),note:$('note').value,website:$('website').value,items:cart.map(x=>({product_id:x.product_id,quantity:x.quantity,option_ids:x.option_ids}))},signature=JSON.stringify(base);let pending;try{pending=JSON.parse(sessionStorage.getItem('machi_takeout_pending')||'null')}catch{pending=null}if(!pending||pending.signature!==signature){pending={requestId:crypto.randomUUID(),signature};sessionStorage.setItem('machi_takeout_pending',JSON.stringify(pending))}if(!confirm('この内容でテイクアウト注文を確定しますか？'))return;sending=true;$('send').disabled=true;$('send').textContent='送信しています…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:pending.requestId,...base})}),j=await r.json();if(!r.ok)throw Error(j.error||'failed');clearSubmission();cart=[];update();$('modal').innerHTML=`<div class="sheet success"><b>ご注文を受け付けました</b><div class="num">#${esc(j.order_id)}</div><p>受取時に注文番号とお名前をお伝えください。</p><p>お支払いは店頭で、現金またはPayPayをご利用いただけます。</p><button id="close" class="primary">閉じる</button></div>`;$('close').onclick=close}catch(e){const messages={outside_business_hours:'現在は営業時間外です。',item_unavailable:'売り切れの商品が含まれています。',takeout_unavailable:'現在、テイクアウト受付を停止しています。',too_many_requests:'短時間に注文が集中しています。しばらくしてからお試しください。',invalid_phone:'電話番号を確認してください。',invalid_pickup_time:'受取時刻を確認してください。'};$('err').textContent=messages[e.message]||'注文を確定できませんでした。内容と受取時刻をご確認ください。';$('send').disabled=false;$('send').textContent='もう一度送信する'}finally{sending=false}}
    function close(){$('modal').className='hidden';$('modal').innerHTML=''}$('open').onclick=showCart;load();
  })();
  </script>
</body>
</html>
