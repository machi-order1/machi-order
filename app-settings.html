<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script><title>アプリデザイン｜MACHI ORDER</title><style>body{margin:0;background:var(--mo-bg);color:var(--mo-ink)}main{max-width:720px;margin:auto;padding:28px 16px}.ey{font-size:11px;letter-spacing:.15em;color:var(--mo-muted);font-weight:900}h1{font-size:30px;margin:6px 0}.lead{color:var(--mo-muted);line-height:1.7}.box{padding:18px;margin-top:14px}.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--mo-line)}.row:first-child{border:0}.row b{display:block}.row small{color:var(--mo-muted)}input[type=color]{width:58px;height:44px;border:0;background:none}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1}.note{font-size:12px;color:var(--mo-muted);margin-top:16px}</style></head><body><main><div class="ey">MACHI ORDER · DESIGN SYSTEM</div><h1>アプリデザイン</h1><div class="lead">店舗やブランドが増えても、同じ設計ルールで見た目を更新できるようにするための設定プレビューです。</div><section class="mo-card box"><div class="row"><div><b>アクセント</b><small>主要ボタン・強調</small></div><input id="accent" type="color"></div><div class="row"><div><b>角丸</b><small>カードの印象</small></div><select id="radius"><option value="16px">シャープ</option><option value="20px">標準</option><option value="26px">やわらかい</option></select></div><div class="actions"><button class="mo-btn mo-btn-primary" id="save">プレビューを反映</button><button class="mo-btn mo-btn-secondary" id="reset">初期に戻す</button></div></section><div class="note">※ V65では端末内プレビュー。SaaSの正式なブランド設定はDB/APIへ接続して全端末へ配信する設計に進めます。</div></main><script>const c=MACHI_UI.get();accent.value=c.accent;radius.value=c.radius;save.onclick=()=>MACHI_UI.set({accent:accent.value,radius:radius.value});reset.onclick=()=>MACHI_UI.reset();</script></body></html>
