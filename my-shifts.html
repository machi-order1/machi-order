<script src="/machi-ui-config.js"></script>
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e51b23">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/machi-design-system.css"><title>マイシフト｜MACHI ORDER</title>
  <style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;margin:0;background:#f7f3ee;color:#171717}main{max-width:680px;margin:auto;padding:24px 16px 96px}.back{display:inline-block;margin-bottom:14px;color:#555;text-decoration:none;font-weight:800}.ey{font-size:11px;letter-spacing:.16em;font-weight:950;color:#8a8179}h1{font-size:31px;margin:7px 0 18px}.card{padding:18px;margin:12px 0}.next{border-top:6px solid #e51b23}.date{font-size:25px;font-weight:950;margin:5px 0}.time{font-size:18px;font-weight:850}.muted{color:#777}.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid #eee}.row:first-child{border-top:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions a{text-align:center;padding:14px 8px;border-radius:14px;background:#fff;border:1px solid #ddd;color:#171717;text-decoration:none;font-weight:850}.msg{color:#b71920;font-weight:800}</style>
</head>
<body><main><a class="back" href="/staff.html">← マイページ</a><div class="ey">MACHI ORDER · SHIFT</div><h1>マイシフト</h1><section class="mo-card card next" id="next">確認しています…</section><section class="mo-card card"><b>今後45日間</b><div id="list" class="muted" style="margin-top:10px">確認しています…</div></section><div class="actions"><a href="/time-clock.html">勤怠を打刻</a><a href="/shift-request.html">希望を提出</a></div><p class="msg" id="message"></p></main>
<script>
const API='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/workforce-api?store_id=1',token=()=>localStorage.machi_access_token||localStorage.mo_staff_token||'',day=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo'}).format(d),jp=d=>new Date(d+'T00:00:00+09:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});
function login(){location.replace('/login.html?next='+encodeURIComponent('/my-shifts.html'))}
async function load(){if(!token())return login();const start=new Date(),end=new Date(start);end.setDate(end.getDate()+45);try{const r=await fetch(API+'&from='+day(start)+'&to='+day(end),{headers:{Authorization:'Bearer '+token()}}),j=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('machi_access_token');localStorage.removeItem('mo_staff_token');return login()}if(!r.ok)throw Error(j.error||'シフトを確認できませんでした');const ss=(j.shifts||[]).filter(x=>['scheduled','working'].includes(x.status)).sort((a,b)=>(a.shift_date+a.scheduled_start).localeCompare(b.shift_date+b.scheduled_start));next.innerHTML=ss.length?`<div class="muted">次の勤務</div><div class="date">${jp(ss[0].shift_date)}</div><div class="time">${String(ss[0].scheduled_start).slice(0,5)}〜${String(ss[0].scheduled_end).slice(0,5)}</div>`:'<div class="muted">次の勤務</div><div class="date">予定なし</div>';list.innerHTML=ss.length?ss.map(x=>`<div class="row"><b>${jp(x.shift_date)}</b><span>${String(x.scheduled_start).slice(0,5)}〜${String(x.scheduled_end).slice(0,5)}</span></div>`).join(''):'今後の確定シフトはありません。'}catch(e){message.textContent=e.message;next.textContent='確認できません';list.textContent='—'}}
load();document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
