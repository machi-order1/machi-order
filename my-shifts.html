<link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MACHI"><style>.mo-appnav{position:sticky;bottom:0;z-index:40;display:flex;justify-content:space-around;gap:4px;background:rgba(255,255,255,.96);border-top:1px solid #ddd;padding:7px max(7px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));backdrop-filter:blur(12px)}.mo-appnav a{min-width:58px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#555;font:700 11px -apple-system,sans-serif;border-radius:12px}.mo-appnav b{font-size:20px;line-height:22px}.mo-install{display:none;margin:10px auto;padding:12px 16px;border:0;border-radius:14px;background:#111;color:#fff;font-weight:800}</style><!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>マイシフト</title><style>body{font-family:-apple-system,sans-serif;margin:0;background:#f6f6f6;color:#222}main{max-width:700px;margin:auto;padding:16px}.c{background:white;border-radius:16px;padding:16px;margin:12px 0}.big{font-size:24px;font-weight:800}.muted{color:#666}button,input{font-size:16px;padding:12px;border-radius:10px;border:1px solid #ccc;width:100%;box-sizing:border-box}</style><main><h1>👤 マイシフト</h1><div class=c><input id=token placeholder="ログイントークン"><button onclick=load()>シフトを表示</button></div><div id=next class=c>読み込み前</div><div id=list></div></main><script>const A='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/workforce-api?store_id=1';token.value=localStorage.mo_staff_token||'';async function load(){localStorage.mo_staff_token=token.value.trim();let d=new Date(),f=d.toISOString().slice(0,10),e=new Date(d);e.setDate(e.getDate()+30);let r=await fetch(A+'&from='+f+'&to='+e.toISOString().slice(0,10),{headers:{Authorization:'Bearer '+localStorage.mo_staff_token}}),j=await r.json();if(!r.ok){next.textContent=j.error||'読み込めません';return}let me=j.user_id||j.user?.id,ss=(j.shifts||[]).filter(x=>!me||x.user_id===me).filter(x=>['scheduled','working'].includes(x.status)).sort((a,b)=>(a.shift_date+a.scheduled_start).localeCompare(b.shift_date+b.scheduled_start));next.innerHTML=ss.length?`<div class=muted>次の勤務</div><div class=big>${ss[0].shift_date}</div><b>${String(ss[0].scheduled_start).slice(0,5)}〜${String(ss[0].scheduled_end).slice(0,5)}</b>`:'次の勤務はありません';list.innerHTML=ss.map(x=>`<div class=c><b>${x.shift_date}</b>　${String(x.scheduled_start).slice(0,5)}〜${String(x.scheduled_end).slice(0,5)}</div>`).join('')} </script></html>
