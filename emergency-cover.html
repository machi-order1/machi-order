<!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>急な欠勤対応</title><style>body{font-family:-apple-system,sans-serif;background:#f5f5f5;margin:0}header{background:#111;color:#fff;padding:18px}.w{max-width:700px;margin:auto;padding:12px}.c{background:#fff;border-radius:16px;padding:15px;margin:10px 0}.r{display:flex;gap:8px;flex-wrap:wrap}input,select,button{padding:11px;border:1px solid #ddd;border-radius:10px;font-size:16px}button{font-weight:700}.p{background:#111;color:#fff}.warn{background:#fff4e5;padding:12px;border-radius:12px}</style><header><b>MACHI ORDER</b><div>急な欠勤・代打募集 V36</div></header><main class=w><div class=c><div class=warn><b>前日・当日の欠勤は「全員へ個別確認」しない。</b><br>条件に合う人へ代打募集を出し、入れる人だけ返答する運用。</div></div><div class=c><b>代打を募集する</b><p>休みになるシフト</p><div class=r><input id=d type=date><input id=f type=time value=17:00><span>〜</span><input id=e type=time value=22:00></div><div class=r><select id=s><option value="">通常枠</option><option value=night_solo>夜ワンオペ可が必要</option></select><select id=why><option value=illness>体調不良</option><option value=emergency>急用</option><option value=absence>欠勤</option><option value=other>その他</option></select></div><p><input id=n placeholder="メモ（任意）"></p><p><input id=t type=password placeholder="アクセストークン"><button onclick=sv()>端末に保存</button></p><button class=p id=go>対象スタッフへ代打募集</button><p id=msg></p><div id=open></div><p>募集後は「入れます」を押した人だけ候補表示 → 店長が1人確定 → 他の募集は自動終了、という流れにします。</p></div><div class=c><a href=shift-builder.html>← シフト画面へ</a></div></main><script>document.getElementById('d').value=new Date().toISOString().slice(0,10) ;const A='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/workforce-api?store_id=1';document.getElementById('t').value=localStorage.mo_staff_token||'';function sv(){localStorage.mo_staff_token=document.getElementById('t').value}document.getElementById('go').addEventListener('click',async()=>{sv();let b={action:'coverage_create',work_date:document.getElementById('d').value,start_time:document.getElementById('f').value,end_time:document.getElementById('e').value,required_skill_code:document.getElementById('s').value||null,reason_category:document.getElementById('why').value,note:document.getElementById('n').value};let r=await fetch(A,{method:'POST',headers:{Authorization:'Bearer '+localStorage.mo_staff_token,'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await r.json();document.getElementById('msg').textContent=r.ok?'✓ 代打募集を開始しました':(j.error||'開始できませんでした')});async function openReq(){let f=document.getElementById('d').value,to=f;let r=await fetch(A+'&from='+f+'&to='+to,{headers:{Authorization:'Bearer '+localStorage.mo_staff_token}}),j=await r.json();if(!j.planning)return;let ps=j.planning.profiles||[],rs=j.planning.coverage_requests||[],ans=j.planning.coverage_responses||[];document.getElementById('open').innerHTML=rs.filter(x=>x.status==='open').map(q=>{let yy=ans.filter(a=>a.request_id===q.id&&a.response==='can_work');return `<hr><b>${q.work_date} ${String(q.start_time).slice(0,5)}〜${String(q.end_time).slice(0,5)}</b><br>入れます：${yy.length}人<br>${yy.map(a=>{let p=ps.find(x=>x.user_id===a.user_id);return `<button type=button onclick="fill(${q.id},'${a.user_id}')">${p?.display_name||'スタッフ'}を確定</button>`}).join('')}`}).join('')||'<p>現在、募集中の代打はありません</p>'}async function fill(id,uid){let r=await fetch(A,{method:'POST',headers:{Authorization:'Bearer '+localStorage.mo_staff_token,'Content-Type':'application/json'},body:JSON.stringify({action:'coverage_fill',request_id:id,user_id:uid})}),j=await r.json();document.getElementById('msg').textContent=r.ok?'✓ 代打を確定しシフトを差し替えました':(j.error||'確定できませんでした');openReq()}setTimeout(openReq,200)</script>
