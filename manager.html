<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>MACHI ORDER 店長</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#f5f5f7;color:#111}header{position:sticky;top:0;background:#111;color:#fff;padding:14px 16px;z-index:5}h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.7;margin-top:4px}.wrap{max-width:920px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 5px #0001}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45}.big{font-size:24px;font-weight:800}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#eee;font-size:12px}.warn{background:#fff4d8}.danger{background:#ffe7e7}.ok{background:#e8f8ec}input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap}.muted{color:#666;font-size:13px}.hidden{display:none}</style><link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script></head><body><header><h1>MACHI ORDER 店長</h1><div class='sub'>MACHI ORDER V31 · 長浜店</div></header><main class='wrap'><div class="card"><div class="row"><div><b>長浜店 店長ホーム</b><div class="muted">売上と店舗運営を1画面で確認</div></div><button class="btn" onclick="load()">更新</button></div><input id="tok" type="hidden"><button class="btn" onclick="save()" hidden>端末に保存</button><span id="status" class="muted"></span></div><div id="cards" class="grid"></div><div class="card"><b>店舗運営</b><div class="grid" style="margin-top:10px"><a class="btn" href="kitchen.html">厨房</a><a class="btn" href="cashier.html">会計</a><a class="btn" href="staff.html">勤怠</a><a class="btn" href="inventory.html">在庫・仕込み</a><a class="btn" href="hygiene.html">衛生</a><a class="btn" href="closing.html">引継ぎ・締め</a></div></div><div class="card"><a href="labor-dashboard.html">💰 今日の売上・実働人件費を見る</a></div><div class="card"><a href="daily-profit.html">📈 今日の店舗利益〈速報〉を見る</a></div><div class="card"><a href="loss-policy.html">🍜 賄い・食材ロスの運用</a></div><div class="card"><a href="recipe-cost.html">🧮 レシピから商品原価を作る</a></div><div class="card"><a href="cost-editor.html">✍️ 実原価・レシピを入力する</a></div><div class="card"><a href="staff-meal.html">🍜 賄い・スタッフ消費を記録</a></div><div class="card"><a href="store-command.html">🚀 長浜店 今日の司令塔</a></div>
<div class="card"><a href="growth.html">↗ 151 GROWTH〈SNS・口コミ・SEO/MEO〉</a></div>
</main>
<script>
const BASE='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/',STORE_ID=[1,2].includes(Number(new URLSearchParams(location.search).get('store_id')))?Number(new URLSearchParams(location.search).get('store_id')):1,$=x=>document.getElementById(x);
$('tok').hidden=true;document.querySelector('button[onclick="save()"]').hidden=true;
function accessToken(){return localStorage.machi_access_token||localStorage.mo_staff_token||localStorage.access_token||localStorage.sb_access_token||''}
function save(){const value=$('tok').value.trim();if(value){localStorage.machi_access_token=value;localStorage.mo_staff_token=value}load()}
async function get(name,extra=''){const token=accessToken();if(!token){location.replace('/login.html?next='+encodeURIComponent('/manager.html?store_id='+STORE_ID));throw Error('ログインしてください')}const r=await fetch(BASE+name+'?store_id='+STORE_ID+extra,{headers:{Authorization:'Bearer '+token}}),j=await r.json().catch(()=>({}));if(r.status===401){location.replace('/login.html?next='+encodeURIComponent('/manager.html?store_id='+STORE_ID));throw Error('ログインし直してください')}if(!r.ok)throw Error(j.error||'取得できません');return j}
function yen(n){return '¥'+Number(n||0).toLocaleString()}
async function load(){try{const [d,c,o]=await Promise.all([get('dashboard-api','&range=today'),get('closing-api'),get('operations-api','&mode=summary')]),s=c.summary||{},m=d.summary||{},storeName=STORE_ID===2?'白木原店':'長浜店';document.querySelector('header .sub').textContent='MACHI ORDER V71 · '+storeName;document.querySelector('main .card b').textContent=storeName+' 店長ホーム';const cards=[['本日売上',yen(s.net_sales)],['注文数',(s.order_count||0)+'件'],['客数',(s.guest_count||0)+'人'],['現金',yen(s.cash_sales)],['PayPay',yen(s.paypay_sales)],['実働人件費',yen(m.labor_cost)],['人件費率',Number(m.labor_ratio||0).toLocaleString()+'%'],['1人時売上',yen(m.sales_per_labor_hour)],['未完了タスク',(o.tasks||[]).length+'件'],['未解決引継ぎ',(o.handoffs||[]).length+'件'],['衛生記録',(o.hygiene||[]).length+'件']];$('cards').innerHTML=cards.map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('');$('status').textContent='更新 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}catch(e){$('status').textContent=e.message}}
document.querySelectorAll('a[href="labor-dashboard.html"],a[href="daily-profit.html"]').forEach(link=>link.href+='?store_id='+STORE_ID);
load();
</script><div style="padding:12px"><a href="shift-builder.html">📅 シフトを作る</a></div><div style="padding:12px"><a href="shift-collection.html">📣 希望シフト回収状況</a></div><div style="padding:12px"><a href="emergency-cover.html">🚨 急な欠勤・代打募集</a></div></body></html>
