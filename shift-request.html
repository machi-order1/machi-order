<!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>希望シフト</title><style>body{font-family:sans-serif;background:#f5f5f5;margin:0}header{background:#111;color:#fff;padding:18px}.w{max-width:650px;margin:auto;padding:12px}.c{background:#fff;padding:15px;margin:10px 0;border-radius:15px}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input{padding:10px;border-radius:9px;border:1px solid #ddd}button{font-weight:bold}.yes{background:#111;color:#fff}</style><header><b>MACHI ORDER</b><div>希望シフトを出す V33</div></header><main class=w><div class=c><b>長浜店・希望シフト</b><p>入れる日と時間を選ぶだけ。あとから変更できます。</p><input id=d type=date><button onclick=load()>1週間表示</button><br><input id=t type=password placeholder=アクセストークン><button onclick=sv()>保存</button><span id=m></span></div><div id=days></div></main><script>
const A='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/workforce-api?store_id=1',$=x=>document.getElementById(x),N=['日','月','火','水','木','金','土'];$('t').value=localStorage.mo_staff_token||'';let q=new Date();q.setDate(q.getDate()-((q.getDay()+6)%7));$('d').value=q.toISOString().slice(0,10);function ad(s,n){let d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function sv(){localStorage.mo_staff_token=$('t').value;load()}async function send(dt,p){let f=$('f'+dt).value,e=$('e'+dt).value,r=await fetch(A,{method:'POST',headers:{Authorization:'Bearer '+localStorage.mo_staff_token,'Content-Type':'application/json'},body:JSON.stringify({action:'availability',work_date:dt,preference:p,available_from:p==='unavailable'?null:f,available_to:p==='unavailable'?null:e})}),j=await r.json();if(!r.ok)return alert(j.error||'保存失敗');load()}async function load(){let f=$('d').value,e=ad(f,6),r=await fetch(A+'&from='+f+'&to='+e,{headers:{Authorization:'Bearer '+localStorage.mo_staff_token}}),j=await r.json();if(!r.ok){$('m').textContent=j.error;return}let h='';for(let i=0;i<7;i++){let dt=ad(f,i),a=(j.availability||[]).find(v=>v.work_date===dt),dw=new Date(dt+'T00:00').getDay();h+=`<div class=c><b>${dt}（${N[dw]}）</b><div class=r><input id=f${dt} type=time value="${(a?.available_from||'10:30').slice(0,5)}">〜<input id=e${dt} type=time value="${(a?.available_to||'15:00').slice(0,5)}"></div><div class=r><button class=yes onclick="send('${dt}','available')">入れます</button><button onclick="send('${dt}','unavailable')">休み希望</button><span>${a?(a.preference==='unavailable'?'休み希望':'提出済み'):''}</span></div></div>`}$('days').innerHTML=h}load()</script>
