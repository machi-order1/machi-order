<!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>賄い・スタッフ消費</title><style>body{font-family:-apple-system,sans-serif;background:#f5f5f5;margin:0}main{max-width:650px;margin:auto;padding:16px}.c{background:white;border-radius:16px;padding:16px;margin:10px 0}button,input,select{width:100%;font-size:17px;padding:12px;margin:5px 0;box-sizing:border-box}.meal{font-size:22px;font-weight:800}.note{background:#fff8df}</style><main><h1>🍜 賄い・スタッフ消費</h1><div class="c note">普段の廃棄入力は不要。賄い・失敗品を食べた時だけサッと記録。実際に捨てた食材は在庫側の「廃棄」で記録します。</div><div class=c><select id=type><option value=staff_meal>🍜 賄い</option><option value=staff_consumption>🥚 仕込み失敗などをスタッフが消費</option></select><input id=name placeholder="品目（例：油そば、ゆで卵）"><input id=qty type=number value=1 min=.001 step=.001><textarea id=note placeholder="メモ（任意）" style="width:100%;min-height:70px"></textarea><button class=meal onclick=save()>記録する</button><div id=msg></div></div><div id=list></div></main><script>const A='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/loss-api?store_id=1';async function api(method,body){let r=await fetch(A,{method,headers:{Authorization:'Bearer '+(localStorage.mo_staff_token||''),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});return r.json()}async function save(){let j=await api('POST',{event_type:type.value,item_name:name.value,quantity:Number(qty.value),note:note.value});msg.textContent=j.ok?(j.cost_complete?'✅ 記録しました':'✅ 記録しました（原価未登録のため金額は保留）'):(j.error||'エラー');if(j.ok){name.value='';note.value='';load()}}async function load(){let j=await api('GET');list.innerHTML=(j.events||[]).map(x=>`<div class=c><b>${x.event_type==='staff_meal'?'🍜 賄い':'🥚 スタッフ消費'} ${x.item_name}</b> × ${x.quantity}<br>${x.cost_complete?'原価 ¥'+x.cost_amount:'⚠️ 原価未確定'}</div>`).join('')}load()</script></html>
