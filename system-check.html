きません'}}}finally{clearTimeout(timer)}}async function run(){const rows=[];rows.push(row(navigator.onLine?'ok':'ng',navigator.onLine?'✓':'×','インターネット通信',navigator.onLine?'この端末はオンラインです':'Wi-Fi・モバイル通信を確認してください',navigator.onLine?'接続':'切断'));const hasStorage=(()=>{try{const key='machi_storage_test';localStorage.setItem(key,'1');localStorage.removeItem(key);return true}catch{return false}})();rows.push(row(hasStorage?'ok':'ng',hasStorage?'✓':'×','端末保存',hasStorage?'ログイン情報と画面設定を保存できます':'プライベートブラウズ等を確認してください',hasStorage?'正常':'要確認'));const registration='serviceWorker'in navigator?await navigator.serviceWorker.getRegistration():null;rows.push(row(registration?'ok':'wait',registration?'✓':'!','オフライン画面',registration?'画面キャッシュが有効です':'この画面を一度再読み込みしてください',registration?'有効':'準備中'));const access=await token();const expiry=Number(localStorage.machi_token_expires_at||0);rows.push(row(access?'ok':'ng',access?'✓':'×','スタッフログイン',access?(expiry?'有効期限を自動更新できます':'ログイン情報があります'):'スタッフログインが必要です',access?'有効':'未ログイン'));let apiResults=[];if(access&&navigator.onLine)apiResults=await Promise.all([probe('menu-admin-api',access),probe('kitchen-api',access),probe('cashier-api',access),probe('closing-api',access)]);const names=['店舗管理','厨房','会計','日次締め'];if(apiResults.length)apiResults.forEach((item,index)=>rows.push(row(item.ok?'ok':'ng',item.ok?'✓':'×',names[index]+'接続',item.ok?'正常に応答しています':item.status===401?'ログインし直してください':item.data.error||'応答がありません',item.ok?'正常':String(item.status||'停止'))));else names.forEach(name=>rows.push(row('wait','!',name+'接続',access?'通信回復後に自動確認できます':'ログイン後に確認できます','未確認')));rows.push(row('ok','日','営業日',localDay()+'（日本時間）','JST'));$('checks').innerHTML=rows.join('');const failures=rows.filter(html=>html.includes('check ng')).length;$('summary').textContent=failures?'確認が必要な項目があります':'システムは利用できます';$('summary-detail').textContent=failures?'赤い項目を上から確認してください。営業データは変更していません。':'通信・ログイン・主要API・端末保存を確認しました。'}$('rerun').onclick=run;$('cache').onclick=async()=>{if(!confirm('注文データは消さず、保存済みの画面だけ更新し
