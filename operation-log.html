<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <title>操作履歴｜MACHI ORDER</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f3ee;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.top{position:sticky;top:0;z-index:10;background:#e51b23;color:#fff;padding:18px 16px 14px}.ey{font-size:10px;letter-spacing:.16em;font-weight:900;opacity:.8}.head{display:flex;align-items:end;justify-content:space-between;gap:12px}.top h1{font-size:27px;margin:4px 0 0}.back{color:#fff;text-decoration:none;font-weight:850}.page{max-width:760px;margin:auto;padding:15px 14px 90px}.tools{display:grid;grid-template-columns:1fr 150px;gap:8px;position:sticky;top:82px;z-index:8;background:#f7f3ee;padding:5px 0 12px}.tools input,.tools select{min-height:46px;border:1px solid #d9cec5;border-radius:13px;background:#fff;padding:0 12px;font-size:15px}.day{font-size:13px;color:#786c64;margin:20px 4px 8px;font-weight:900}.log{background:#fff;border:1px solid #eadfd6;border-radius:17px;padding:14px;margin-bottom:9px}.line{display:flex;justify-content:space-between;gap:12px;align-items:start}.action{font-size:16px;font-weight:950}.time{font-size:13px;font-weight:850;white-space:nowrap;color:#786c64}.meta{font-size:13px;color:#786c64;margin-top:5px}.detail{font-size:13px;background:#f7f3ee;border-radius:11px;padding:9px 10px;margin-top:9px;line-height:1.5}.empty{text-align:center;padding:70px 15px;color:#786c64}.empty b{display:block;font-size:21px;color:#222;margin-bottom:7px}@media(max-width:540px){.tools{grid-template-columns:1fr 122px}}
  </style>
</head>
<body>
  <header class="top"><div class="head"><div><div class="ey">博多油そば151 · 長浜店</div><h1>操作履歴</h1></div><a class="back" href="/store-command.html">店舗ホーム ›</a></div></header>
  <main class="page"><div class="tools"><input id="search" type="search" placeholder="担当者・注文番号で検索"><select id="filter"><option value="">すべての操作</option><option value="sale_status_changed">商品・売切</option><option value="ordering_changed">注文受付</option><option value="happy_hour_changed">ハッピーアワー</option><option value="payment_completed">会計完了</option><option value="payment_reverted">会計取消</option><option value="opening_check_completed">営業前チェック</option></select></div><div id="list"><div class="empty"><b>読み込み中</b>操作履歴を確認しています</div></div></main>
  <script>
    const BASE='https://tejglrlkaqolbghoagqj.supabase.co',KEY='sb_publishable_beZla85Y6Ngrx0hji9I9rg_FbcRSUoT',API=BASE+'/functions/v1/operations-api?store_id=1',AUTH=BASE+'/auth/v1/token';let logs=[];const list=document.getElementById('list'),esc=value=>String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));function rawToken(){return localStorage.machi_access_token||localStorage.mo_staff_token||''}async function token(){let access=rawToken(),expires=Number(localStorage.machi_token_expires_at||0),refresh=localStorage.machi_refresh_token||'';if(access&&(!expires||Date.now()<expires-60000))return access;if(!refresh)return access;const response=await fetch(AUTH+'?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh})});if(!response.ok)return access;const result=await response.json();localStorage.machi_access_token=result.access_token;localStorage.mo_staff_token=result.access_token;localStorage.machi_refresh_token=result.refresh_token||refresh;localStorage.machi_token_expires_at=String(Date.now()+Number(result.expires_in||3600)*1000);return result.access_token}const labels={sale_status_changed:'商品状態を変更',ordering_changed:'注文受付を変更',happy_hour_changed:'ハッピーアワーを変更',payment_completed:'会計を完了',payment_reverted:'会計完了を取消',opening_check_completed:'営業前チェック完了'};const status={available:'販売中',sold_out:'売切',stopped:'停止'};function detail(log){const d=log.details||{};if(log.action==='sale_status_changed')return (status[d.from]||d.from||'販売中')+' → '+(status[d.to]||d.to);if(log.action==='ordering_changed')return d.enabled?'注文受付を再開':'注文受付を停止';if(log.action==='happy_hour_changed')return (d.active?'開催':'停止')+' · '+String(d.start_time||'').slice(0,5)+'〜'+String(d.end_time||'').slice(0,5);if(log.action==='payment_completed')return '注文 #'+log.entity_id+' · '+(d.payment_method==='cash'?'現金':d.payment_method==='paypay'?'PayPay':'その他')+' · ¥'+Number(d.amount||0).toLocaleString();if(log.action==='payment_reverted')return '注文 #'+log.entity_id+' · ¥'+Number(d.amount||0).toLocaleString()+(d.external_refund_required?' · PayPay返金は別途':'');if(log.action==='opening_check_completed')return (d.score||8)+'/'+(d.total||8)+'項目';return ''}function dayKey(value){return new Date(value).toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'})}function render(){const query=document.getElementById('search').value.trim().toLowerCase(),filter=document.getElementById('filter').value;const rows=logs.filter(log=>(!filter||log.action===filter)&&(!query||[log.staff_name,log.entity_id,labels[log.action],detail(log)].join(' ').toLowerCase().includes(query)));let day='',html='';for(const log of rows){const key=dayKey(log.created_at);if(key!==day){day=key;html+='<div class="day">'+esc(key)+'</div>'}html+='<article class="log"><div class="line"><div class="action">'+esc(labels[log.action]||log.action)+'</div><div class="time">'+new Date(log.created_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'</div></div><div class="meta">'+esc(log.staff_name||'スタッフ')+'</div><div class="detail">'+esc(detail(log))+'</div></article>'}list.innerHTML=html||'<div class="empty"><b>該当する履歴がありません</b>これからの重要操作がここに記録されます</div>'}async function load(){const access=await token();if(!access){location.replace('/login.html?next='+encodeURIComponent('/operation-log.html'));return}const response=await fetch(API,{headers:{apikey:KEY,Authorization:'Bearer '+access}}),result=await response.json().catch(()=>({}));if(response.status===401){location.replace('/login.html?next='+encodeURIComponent('/operation-log.html'));return}if(!response.ok){list.innerHTML='<div class="empty"><b>履歴を表示できません</b>'+esc(result.error||'もう一度お試しください')+'</div>';return}logs=result.logs||[];render()}document.getElementById('search').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);load();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  </script>
</body>
</html>
