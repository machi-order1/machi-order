<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/machi-design-system.css">
  <script src="/machi-ui-config.js"></script>
  <title>今日の利益速報｜MACHI ORDER</title>
  <style>body{font-family:-apple-system,sans-serif;background:#f5f5f5;margin:0;color:#222}main{max-width:760px;margin:auto;padding:16px 16px 90px}.c{background:white;border-radius:16px;padding:16px;margin:10px 0}.hero{font-size:36px;font-weight:900}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}button{width:100%;padding:12px;box-sizing:border-box;font-size:16px;border:0;border-radius:12px;background:#171717;color:#fff;font-weight:900}.note{color:#666;font-size:13px;line-height:1.6}.error{color:#b71920}</style>
</head>
<body>
<main>
  <h1>📈 今日の店舗利益〈速報〉</h1>
  <div class="c"><button id="refresh" type="button">最新の数字に更新</button><div id="msg" class="note"></div></div>
  <div class="c"><div>今日の利益速報</div><div id="op" class="hero">—</div><div id="rate"></div></div>
  <div class="c" id="rows"></div>
  <div class="c" id="quality"><b>⚠️ 利益精度チェック</b><p>原価・経費・廃棄データを確認しています。</p></div>
  <div class="c note">速報値です。未登録原価や未入力経費がある場合、会計上の確定利益とは一致しません。</div>
  <div class="c"><a href="/recipe-cost.html">🧮 レシピから商品原価を作る</a></div>
</main>
<script>
const STORE_ID=[1,2].includes(Number(new URLSearchParams(location.search).get('store_id')))?Number(new URLSearchParams(location.search).get('store_id')):1;
const API='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/pl-api?store_id='+STORE_ID+'&date=';
const yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const token=()=>localStorage.machi_access_token||localStorage.mo_staff_token||localStorage.access_token||localStorage.sb_access_token||'';
const login=()=>location.replace('/login.html?next='+encodeURIComponent(location.pathname+location.search));
async function load(){
  const access=token();if(!access){login();return}
  const msg=document.getElementById('msg');msg.className='note';msg.textContent='確認中…';
  try{
    const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo'}).format(new Date());
    const response=await fetch(API+date,{headers:{Authorization:'Bearer '+access}});
    const data=await response.json().catch(()=>({}));
    if(response.status===401){login();return}
    if(!response.ok)throw Error(data.error||'読込に失敗しました');
    document.getElementById('op').textContent=yen(data.operating_profit);
    document.getElementById('rate').textContent='利益率 '+Number(data.ratios?.operating||0).toLocaleString()+'%';
    document.getElementById('rows').innerHTML=[['売上',data.sales],['商品原価',-data.cogs],['実働人件費',-data.labor_cost],['廃棄',-data.waste_cost],['賄い・スタッフ消費',-data.staff_consumption_cost],['販売チャネル手数料',-data.channel_fees],['その他経費',-data.expenses]].map(x=>`<div class="row"><span>${x[0]}</span><b>${yen(x[1])}</b></div>`).join('')+`<div class="row"><span>FL比率</span><b>${Number(data.ratios?.fl||0).toLocaleString()}%</b></div>`;
    const q=data.data_quality||{};
    document.getElementById('quality').innerHTML=`<b>⚠️ 現在は利益の参考値</b><p>商品原価 ${q.costed_products||0}/${q.active_products||0}件登録・原価未確定 ${q.uncosted_products||0}件・未原価の賄い/消費 ${q.uncosted_staff_consumption||0}件</p>`;
    msg.textContent=(STORE_ID===2?'白木原店':'長浜店')+'・更新 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  }catch(error){msg.className='note error';msg.textContent=error.message}
}
document.getElementById('refresh').addEventListener('click',load);load();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
