<link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script><!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>今日の利益速報</title><style>body{font-family:-apple-system,sans-serif;background:#f5f5f5;margin:0;color:#222}main{max-width:760px;margin:auto;padding:16px}.c{background:white;border-radius:16px;padding:16px;margin:10px 0}.hero{font-size:36px;font-weight:900}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}button,input{width:100%;padding:12px;box-sizing:border-box;font-size:16px}.note{color:#666;font-size:13px}</style><main><h1>📈 今日の店舗利益〈速報〉</h1><div class=c><input id=t placeholder="ログイントークン"><button onclick=load()>更新</button></div><div class=c><div>今日の利益速報</div><div id=op class=hero>—</div><div id=rate></div></div><div class=c id=rows></div><div class="c" id="quality"><b>⚠️ 利益精度チェック</b><p>現在、商品原価・経費・廃棄データの登録状況を確認中です。</p></div><div class="c note">速報値です。商品原価は登録済み cost_price、実働人件費は打刻−休憩、経費・廃棄・チャネル手数料は登録済みデータから計算します。未登録原価や未入力経費がある場合、会計上の確定利益とは一致しません。</div><div class="card"><a href="recipe-cost.html">🧮 レシピから商品原価を作る</a></div><div class="card"><b>利益数字の品質</b><div id="dq">原価・経費の登録状況をAPIで確認します</div></div></main><script>const A='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/pl-api?store_id=1&date=';t.value=localStorage.mo_staff_token||'';const yen=n=>'¥'+Number(n||0).toLocaleString();async function load(){localStorage.mo_staff_token=t.value.trim();let d=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo'}).format(new Date()),r=await fetch(A+d,{headers:{Authorization:'Bearer '+localStorage.mo_staff_token}}),j=await r.json();if(!r.ok){alert(j.error||'読込失敗');return}op.textContent=yen(j.operating_profit);document.getElementById('quality').innerHTML='<b>⚠️ 現在は利益の参考値</b><p>原価・経費の入力が揃うほど精度が上がります。廃棄は例外記録、賄い・スタッフ消費は売上と分けて管理します。未登録項目を0円として確定利益扱いしない設計です。</p>';rate.textContent='利益率 '+j.ratios.operating+'%';rows.innerHTML=[['売上',j.sales],['商品原価',-j.cogs],['実働人件費',-j.labor_cost],['廃棄',-j.waste_cost],['賄い・スタッフ消費',-j.staff_consumption_cost],['販売チャネル手数料',-j.channel_fees],['その他経費',-j.expenses]].map(x=>`<div class=row><span>${x[0]}</span><b>${yen(x[1])}</b></div>`).join('')+'<div class=row><span>FL比率</span><b>'+j.ratios.fl+'%</b></div>'};try{if(typeof j!=="undefined"&&j.data_quality){dq.textContent=`商品原価 ${j.data_quality.costed_products}/${j.data_quality.active_products}件登録・原価未確定 ${j.data_quality.uncosted_products}件・未原価の賄い/消費 ${j.data_quality.uncosted_staff_consumption}件`}}catch(e){}</script></html>
