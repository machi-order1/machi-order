<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script><title>今日｜MACHI ORDER</title><style>body{margin:0;background:var(--mo-bg);color:var(--mo-ink)}.top{padding:24px 16px 12px}.ey{font-size:11px;letter-spacing:.15em;color:var(--mo-muted);font-weight:900}.top h1{font-size:30px;margin:5px 0}.top p{margin:0;color:var(--mo-muted)}main{padding-bottom:94px}.section{margin-top:20px}.section h2{font-size:14px;margin:0 0 9px;color:var(--mo-muted)}.task{display:flex;align-items:center;gap:12px;padding:15px;margin-bottom:9px}.task .icon{width:44px;height:44px;border-radius:14px;background:var(--mo-surface-2);display:grid;place-items:center;font-size:20px;flex:none}.task .txt{min-width:0;flex:1}.task b{display:block;font-size:16px}.task small{color:var(--mo-muted)}.task button{min-width:82px}.done{opacity:.5}.empty{text-align:center;padding:60px 15px;color:var(--mo-muted)}.empty b{display:block;font-size:22px;color:var(--mo-ink);margin-bottom:7px}.mo-appnav{position:sticky;bottom:0;z-index:40;display:flex;justify-content:space-around;background:#fffffff5;border-top:1px solid var(--mo-line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.mo-appnav a{min-width:58px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--mo-muted);font:700 11px var(--mo-font)}.mo-appnav b{font-size:20px}.mo-appnav a:nth-child(3){color:var(--mo-ink);background:var(--mo-surface-2);border-radius:12px}</style></head><body><header class="top mo-page"><div class="ey">MACHI ORDER · TODAY</div><h1>今日やること</h1><p id="summary">必要なことだけ、順番に。</p></header><main class="mo-page"><section class="section"><h2>いま優先</h2><div id="tasks"><div class="empty"><b>確認しています</b>今日のタスクを読み込んでいます</div></div></section><section class="section"><h2>店舗チェック</h2><a class="mo-card task" href="/hygiene.html" style="text-decoration:none;color:inherit"><div class="icon">✦</div><div class="txt"><b>衛生チェック</b><small>温度・清掃など</small></div><span>›</span></a><a class="mo-card task" href="/inventory.html" style="text-decoration:none;color:inherit"><div class="icon">▦</div><div class="txt"><b>在庫を確認</b><small>必要な時だけ棚卸し</small></div><span>›</span></a></section></main><nav class="mo-appnav"><a href="/store-command.html"><b>⌂</b>ホーム</a><a href="/kitchen.html"><b>🍳</b>厨房</a><a href="/today.html"><b>✓</b>今日</a><a href="/cashier.html"><b>¥</b>会計</a><a href="/staff.html"><b>☰</b>その他</a></nav><script>
const API='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/operations-api?store_id=1';const tok=()=>localStorage.getItem('access_token')||localStorage.getItem('sb_access_token')||localStorage.getItem('machi_access_token')||'';const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let data=[];function icon(t){const s=(t.title||'')+(t.task_type||'');return /衛生|温度|清掃/.test(s)?'✦':/在庫|発注|購入/.test(s)?'▦':/引継/.test(s)?'↗':'✓'}function render(){const open=data.filter(x=>x.status!=='done'&&x.status!=='completed');summary.textContent=open.length?`残り ${open.length}件。上から進めればOK。`:'今日の必須タスクは完了しています。';tasks.innerHTML=open.length?open.map(t=>`<div class="mo-card task"><div class=icon>${icon(t)}</div><div class=txt><b>${esc(t.title||t.task_name||'店舗タスク')}</b><small>${esc(t.description||t.note||'')}</small></div><button class="mo-btn mo-btn-primary" data-id="${t.id}">できた！</button></div>`).join(''):'<div class=empty><b>完了！</b>いま追加でやることはありません</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>done(Number(b.dataset.id),b))}async function load(){if(!tok()){tasks.innerHTML='<div class=empty><b>ログインが必要です</b>スタッフ画面からログインしてください</div>';return}try{const r=await fetch(API,{headers:{Authorization:'Bearer '+tok()}}),j=await r.json();if(!r.ok)throw Error(j.error||'取得できません');data=j.tasks||j.store_tasks||[];render()}catch(e){tasks.innerHTML='<div class=empty><b>再接続しています</b>'+esc(e.message)+'</div>'}}async function done(id,b){b.disabled=true;b.textContent='更新中…';try{const r=await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+tok(),'Content-Type':'application/json'},body:JSON.stringify({action:'task_done',task_id:id})}),j=await r.json();if(!r.ok)throw Error(j.error||'更新できません');await load()}catch(e){alert(e.message);b.disabled=false;b.textContent='できた！'}}load();setInterval(load,20000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
