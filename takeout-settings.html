<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>テイクアウト受付設定｜MACHI ORDER</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:620px;margin:auto;padding:24px 16px 100px}.ey{font-size:11px;letter-spacing:.15em;color:#777;font-weight:900}h1{font-size:29px;margin:6px 0 18px}.card{background:#fff;border:1px solid #e1e1dc;border-radius:22px;padding:18px;margin:12px 0}.state{font-size:24px;font-weight:950}.state.on{color:#137333}.state.off{color:#b71920}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:15px 0;border-top:1px solid #eee}.row:first-child{border-top:0}.row b{display:block}.row small{color:#777}select{font:inherit;padding:10px;border:1px solid #bbb;border-radius:10px;background:#fff}.save{width:100%;border:0;border-radius:14px;background:#e51b23;color:#fff;padding:16px;font-size:17px;font-weight:950}.save:disabled{opacity:.5}.msg{min-height:24px;margin-top:10px;font-weight:800}.back{color:#555;text-decoration:none}.switch{position:relative;width:62px;height:36px}.switch input{opacity:0}.switch i{position:absolute;inset:0;background:#bbb;border-radius:99px}.switch i:after{content:"";position:absolute;width:28px;height:28px;left:4px;top:4px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+i{background:#137333}.switch input:checked+i:after{transform:translateX(26px)}</style></head><body><main class="wrap"><a class="back" href="/store-command.html">← 店舗ホーム</a><div class="ey">MACHI ORDER · TAKEOUT</div><h1>テイクアウト受付設定</h1><section class="card"><div id="state" class="state">読み込み中…</div><p>休止すると公式サイトから新しい注文は入らなくなります。</p><div class="row"><div><b>注文受付</b><small>混雑時はすぐ停止できます</small></div><label class="switch"><input id="enabled" type="checkbox"><i></i></label></div><div class="row"><div><b>最短受取時間</b><small>注文時点から何分後か</small></div><select id="lead"><option>10</option><option>15</option><option>20</option><option>30</option><option>45</option><option>60</option></select></div><div class="row"><div><b>受付可能な先の時間</b><small>当日運用は24時間がおすすめ</small></div><select id="advance"><option value="360">6時間</option><option value="720">12時間</option><option value="1440">24時間</option><option value="2880">48時間</option></select></div><button id="save" class="save">設定を保存</button><div id="msg" class="msg"></div></section></main><script>const API='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/takeout-admin-api?store_id=1',token=()=>localStorage.machi_access_token||localStorage.mo_staff_token||'';function show(s){state.textContent=s?'受付中':'受付停止中';state.className='state '+(s?'on':'off')}async function load(){if(!token())return location.replace('/login.html?next=/takeout-settings.html');const r=await fetch(API,{headers:{Authorization:'Bearer '+token()}}),j=await r.json();if(r.status===401)return location.replace('/login.html?next=/takeout-settings.html');if(!r.ok){msg.textContent='設定を読み込めませんでした';return}enabled.checked=j.enabled;lead.value=j.min_lead_minutes;advance.value=j.max_advance_minutes;show(j.enabled)}save.onclick=async()=>{save.disabled=true;msg.textContent='保存中…';try{const r=await fetch(API,{method:'PATCH',headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify({enabled:enabled.checked,min_lead_minutes:Number(lead.value),max_advance_minutes:Number(advance.value)})}),j=await r.json();if(!r.ok)throw Error(j.error);show(j.enabled);msg.textContent='保存しました'}catch{msg.textContent='保存できませんでした。再度お試しください'}finally{save.disabled=false}};enabled.onchange=()=>show(enabled.checked);load();</script></body></html>
