<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e51b23"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/machi-design-system.css"><title>仕込み・期限管理｜MACHI ORDER</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f3ee;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:780px;margin:auto;padding:22px 16px 100px}.back{color:#555;text-decoration:none;font-weight:850}.ey{margin-top:20px;color:#8a8179;font-size:11px;font-weight:950;letter-spacing:.16em}h1{font-size:31px;margin:7px 0 17px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.card{background:#fff;border-radius:18px;padding:15px}.stat{text-align:center}.stat b{display:block;font-size:24px}.stat small,.meta{color:#777}.card{margin:11px 0;box-shadow:0 2px 12px #0000000a}.card h2{font-size:20px;margin:0 0 12px}.field{display:block;font-weight:900;margin:10px 0}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:13px;font:inherit;margin-top:6px;background:#fff}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick{display:flex;gap:7px;margin-top:7px}.quick button,.waste{border:0;border-radius:10px;padding:9px 11px;font-weight:900;background:#eee}.primary{width:100%;border:0;border-radius:14px;padding:15px;background:#e51b23;color:#fff;font-size:17px;font-weight:950;margin-top:10px}.primary:disabled{opacity:.5}.lot{border-top:1px solid #eee;padding:13px 0}.lot:first-child{border:0}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.name{font-size:17px;font-weight:950}.qty{font-size:18px;font-weight:950;white-space:nowrap}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:950;margin-top:5px}.safe{background:#e5f4e9;color:#19622d}.soon{background:#fff0bd;color:#755500}.today{background:#ffe0bd;color:#8a3e00}.expired{background:#ffdadd;color:#ae1920}.none{color:#777;text-align:center;padding:20px}.history{font-size:13px;border-top:1px solid #eee;padding:10px 0}.msg{min-height:24px;color:#b71920;font-weight:850}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px;z-index:100}.modal.open{display:grid}.sheet{background:#fff;border-radius:22px;padding:20px;width:min(100%,500px)}.sheet input,.sheet textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:13px;font:inherit;margin:6px 0 12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{border:0;border-radius:13px;padding:14px;font-weight:950}.cancel{background:#eee}.confirm{background:#e51b23;color:#fff}@media(max-width:430px){.pair{grid-template-columns:1fr}.stat b{font-size:21px}}</style></head>
<body><main><a class="back" href="/store-command.html">← 店舗ホーム</a><div class="ey" id="store-name">博多油そば151</div><h1>仕込み・期限管理</h1><div class="summary"><div class="stat"><b id="expired">—</b><small>期限切れ</small></div><div class="stat"><b id="today">—</b><small>本日期限</small></div><div class="stat"><b id="tomorrow">—</b><small>明日期限</small></div></div>
<section class="card"><h2>仕込みを記録</h2><label class="field">仕込み前の品目<select id="input-item"></select></label><div class="pair"><label class="field">使用した量<input id="input-qty" type="number" min="0.01" step="0.01" inputmode="decimal"></label><label class="field">仕込み後の品目<select id="output-item"></select></label></div><div class="pair"><label class="field">できた量<input id="output-qty" type="number" min="0.01" step="0.01" inputmode="decimal"></label><label class="field">消費期限<input id="expires-on" type="date"></label></div><div class="quick"><button data-days="0">今日</button><button data-days="1">明日</button><button data-days="2">＋2日</button></div><label class="field">メモ（任意）<textarea id="note" rows="2" maxlength="500"></textarea></label><button class="primary" id="save">仕込み完了を記録</button></section>
<section class="card"><h2>先に使う順</h2><div id="lots"><div class="none">読み込み中…</div></div></section><section class="card"><h2>最近の仕込み</h2><div id="history"></div></section><p class="msg" id="msg" role="alert"></p></main>
<div class="modal" id="waste-modal"><div class="sheet"><h2 id="waste-title">廃棄を記録</h2><div class="meta" id="waste-meta"></div><label><b>廃棄量</b><input id="waste-qty" type="number" min="0.01" step="0.01" inputmode="decimal"></label><label><b>理由</b><textarea id="waste-reason" rows="2" maxlength="500">期限・品質</textarea></label><div class="actions"><button class="cancel" id="waste-cancel">戻る</button><button class="confirm" id="waste-save">廃棄を確定</button></div></div></div>
<script>
const BASE='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/inventory-api',params=new URLSearchParams(location.search),storeId=Number(params.get('store_id')||localStorage.machi_store_id||1),API=BASE+'?store_id='+storeId,$=id=>document.getElementById(id);let items=[],lots=[],history=[],selectedLot=null;const token=()=>localStorage.machi_access_token||localStorage.mo_staff_token||'';function login(){location.replace('/login.html?next='+encodeURIComponent('/prep.html?store_id='+storeId))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function num(x){return Number(x).toLocaleString('ja-JP',{maximumFractionDigits:2})}function localDate(add=0){const d=new Date(Date.now()+add*86400000);return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo'}).format(d)}async function api(method='GET',body){if(!token())return login();const r=await fetch(API,{method,headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}),j=await r.json().catch(()=>({}));if(r.status===401)return login();if(!r.ok)throw Error(j.error||'処理できません');return j}
function expiry(lot){if(!lot.expires_on)return {label:'期限未設定',cls:'soon',days:null};const today=localDate(),tomorrow=localDate(1);if(lot.expires_on<today)return {label:'期限切れ',cls:'expired',days:-1};if(lot.expires_on===today)return {label:'本日まで',cls:'today',days:0};if(lot.expires_on===tomorrow)return {label:'明日まで',cls:'soon',days:1};return {label:lot.expires_on.replaceAll('-','/'),cls:'safe',days:2}}
function render(){const raw=items.filter(x=>x.item_type!=='prepared'),prepared=items.filter(x=>x.item_type==='prepared');$('input-item').innerHTML=raw.map(x=>`<option value="${x.id}">${esc(x.name)}（${x.stock_known?num(x.stock_quantity)+esc(x.unit):'未棚卸'}）</option>`).join('');$('output-item').innerHTML=prepared.map(x=>`<option value="${x.id}">${esc(x.name)}（${esc(x.unit)}）</option>`).join('');const states=lots.map(expiry);$('expired').textContent=states.filter(x=>x.days===-1).length;$('today').textContent=states.filter(x=>x.days===0).length;$('tomorrow').textContent=states.filter(x=>x.days===1).length;$('lots').innerHTML=lots.length?lots.map(l=>{const e=expiry(l);return `<div class="lot"><div class="row"><div><div class="name">${esc(l.name)}</div><div class="meta">仕込 ${l.prepared_at?new Date(l.prepared_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):esc(l.received_on||'—')} ／ ${esc(l.lot_code||'')}</div><span class="badge ${e.cls}">${esc(e.label)}</span></div><div><div class="qty">${num(l.quantity)}${esc(l.unit)}</div><button class="waste" data-waste="${l.id}">廃棄</button></div></div></div>`}).join(''):'<div class="none">仕込み済みロットはありません</div>';$('history').innerHTML=history.length?history.map(h=>`<div class="history"><b>${esc(h.output_name)} ${num(h.completed_quantity)}${esc(h.output_unit)}</b><div class="meta">${esc(h.input_name)} ${num(h.input_quantity)}${esc(h.input_unit)}を使用 ／ ${h.completed_at?new Date(h.completed_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):''}</div></div>`).join(''):'<div class="none">仕込み履歴はありません</div>';document.querySelectorAll('[data-waste]').forEach(b=>b.onclick=()=>openWaste(Number(b.dataset.waste)))}
async function load(){try{const j=await api();items=j.items||[];lots=j.lots||[];history=j.prep_history||[];$('store-name').textContent='博多油そば151 · '+(j.store?.name||'店舗');render();$('msg').textContent='最終更新 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}catch(e){$('msg').textContent=e.message}}
async function save(){const body={action:'prep_complete',input_item_id:Number($('input-item').value),input_quantity:Number($('input-qty').value),output_item_id:Number($('output-item').value),output_quantity:Number($('output-qty').value),expires_on:$('expires-on').value,note:$('note').value};if(!body.input_quantity||body.input_quantity<=0||!body.output_quantity||body.output_quantity<=0||!body.expires_on)return alert('使用量・できた量・消費期限を入力してください');const input=items.find(x=>x.id===body.input_item_id),output=items.find(x=>x.id===body.output_item_id);if(!confirm(`${input?.name} ${num(body.input_quantity)}${input?.unit}を使い\n${output?.name} ${num(body.output_quantity)}${output?.unit}を仕込み済みにしますか？`))return;$('save').disabled=true;try{await api('POST',body);$('input-qty').value='';$('output-qty').value='';$('note').value='';await load()}catch(e){alert(e.message)}finally{$('save').disabled=false}}
function openWaste(id){selectedLot=lots.find(x=>x.id===id);if(!selectedLot)return;$('waste-title').textContent=selectedLot.name+'を廃棄';$('waste-meta').textContent='残量 '+num(selectedLot.quantity)+selectedLot.unit+' ／ '+expiry(selectedLot).label;$('waste-qty').value=selectedLot.quantity;$('waste-modal').classList.add('open')}
async function waste(){const qty=Number($('waste-qty').value),reason=$('waste-reason').value.trim();if(!qty||qty<=0||qty>Number(selectedLot.quantity))return alert('ロット残量以内で廃棄量を入力してください');if(!confirm(`${selectedLot.name} ${num(qty)}${selectedLot.unit}を廃棄記録しますか？`))return;$('waste-save').disabled=true;try{await api('POST',{action:'lot_waste',lot_id:selectedLot.id,quantity:qty,reason});$('waste-modal').classList.remove('open');await load()}catch(e){alert(e.message)}finally{$('waste-save').disabled=false}}
document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{$('expires-on').value=localDate(Number(b.dataset.days))});$('expires-on').value=localDate(1);$('save').onclick=save;$('waste-cancel').onclick=()=>$('waste-modal').classList.remove('open');$('waste-save').onclick=waste;$('waste-modal').onclick=e=>{if(e.target===$('waste-modal'))$('waste-modal').classList.remove('open')};if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load();
</script></body></html>
