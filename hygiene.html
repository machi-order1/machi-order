<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>衛生・HACCP</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#f5f5f7;color:#111}header{position:sticky;top:0;background:#111;color:#fff;padding:14px 16px;z-index:5}h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.7;margin-top:4px}.wrap{max-width:980px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 5px #0001}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.big{font-size:24px;font-weight:800}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#eee;font-size:12px}.muted{color:#666;font-size:13px}input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin:5px 0}a.btn{display:inline-block;text-decoration:none;color:#111;background:#eee}.warn{background:#fff4d8}.ok{background:#e8f8ec}</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MACHI"><style>.mo-appnav{position:sticky;bottom:0;z-index:40;display:flex;justify-content:space-around;gap:4px;background:rgba(255,255,255,.96);border-top:1px solid #ddd;padding:7px max(7px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));backdrop-filter:blur(12px)}.mo-appnav a{min-width:58px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#555;font:700 11px -apple-system,sans-serif;border-radius:12px}.mo-appnav b{font-size:20px;line-height:22px}.mo-install{display:none;margin:10px auto;padding:12px 16px;border:0;border-radius:14px;background:#111;color:#fff;font-weight:800}</style><link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script></head><body><header><h1>衛生・HACCP</h1><div class='sub'>MACHI ORDER V31 · 長浜店 Store OS</div></header><main class='wrap'><div class='card'><b>衛生・HACCP</b><p class='muted'>本日の必須チェックをその場で記録。</p><input id='tok' type='password' placeholder='アクセストークン'><button class='btn' onclick='saveToken();load()'>保存して更新</button><span id='msg' class='muted'></span></div><div id='list' class='grid'></div></main><script>
const API_BASE='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1';
const $=x=>document.getElementById(x);
function token(){return localStorage.mo_staff_token||''}
function initToken(){let e=$('tok');if(e)e.value=token()}
function saveToken(){let e=$('tok');if(e)localStorage.mo_staff_token=e.value.trim();}
async function api(name,method='GET',body=null){
 const r=await fetch(API_BASE+'/'+name+'?store_id=1',{method,headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({})); if(!r.ok) throw Error(j.error||'処理できません'); return j;
}
initToken();
async function load(){try{let j=await api('operations-api'),done=new Set((j.hygiene||[]).map(x=>x.template_id));$('list').innerHTML=(j.hygiene_templates||[]).map(x=>`<div class="card ${done.has(x.id)?'ok':''}"><div class="row"><b>${x.name}</b><span class="pill">${done.has(x.id)?'記録済':'未記録'}</span></div><div class="muted">${x.expected_value||''}</div><input id="v${x.id}" placeholder="温度・確認内容など"><textarea id="n${x.id}" placeholder="メモ（任意）"></textarea><div class="row"><button class="btn" onclick="record(${x.id},true)">OKで記録</button><button class="btn" onclick="record(${x.id},false)">異常あり</button></div></div>`).join('')}catch(e){$('msg').textContent=e.message}}
async function record(id,passed){try{await api('operations-api','POST',{action:'hygiene_check',template_id:id,session:'current',value_text:$('v'+id).value,passed,note:$('n'+id).value});$('msg').textContent='記録しました';load()}catch(e){alert(e.message)}}load();</script></body></html>
