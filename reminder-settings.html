<!doctype html><html lang=ja><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel=stylesheet href=/machi-design-system.css><script src=/machi-ui-config.js></script><title>リマインド設定｜MACHI ORDER</title><style>body{margin:0;background:var(--mo-bg);color:var(--mo-ink)}main{max-width:780px;margin:auto;padding:28px 16px 80px}.ey{font-size:11px;letter-spacing:.15em;color:var(--mo-muted);font-weight:900}h1{font-size:30px;margin:6px 0}.lead{color:var(--mo-muted);line-height:1.6}.card{padding:18px;margin-top:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{background:var(--mo-surface-2);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:850}.msg{margin:13px 0;line-height:1.6}.actions{display:flex;gap:8px}.actions button{flex:1}.add{width:100%;margin-top:14px}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:end center;z-index:50}.sheet{background:var(--mo-bg);width:min(100%,780px);border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:850;color:var(--mo-muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--mo-line);border-radius:14px;background:#fff;padding:13px;font:inherit}.field textarea{min-height:100px}.save{width:100%}</style></head><body><main><div class=ey>MACHI ORDER · REMINDERS</div><h1>リマインド設定</h1><div class=lead>店長が時間・対象・文章をいつでも変更。店舗オペレーションが変わってもアプリを作り直しません。</div><div id=list></div><button class="mo-btn mo-btn-primary add" id=add>＋ リマインドを追加</button></main><div class=modal id=modal><div class=sheet><h2 id=ttl>リマインドを編集</h2><input type=hidden id=rid><div class=field><label>名前</label><input id=name placeholder="例：オープン準備"></div><div class=field><label>時間</label><input id=time type=time></div><div class=field><label>対象</label><select id=target><option value=working_staff>その時間に働くスタッフ</option><option value=store>店舗タブレット</option><option value=manager>店長</option></select></div><div class=field><label>タイミング</label><select id=trigger><option value=clock>指定時刻</option><option value=shift_previous_day>シフト前日の指定時刻</option></select></div><div class=field><label>メッセージ</label><textarea id=message></textarea></div><button class="mo-btn mo-btn-primary save" id=save>保存する</button><button class="mo-btn mo-btn-secondary save" style="margin-top:8px" id=cancel>閉じる</button></div></div><script>
const API='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/reminder-api?store_id=1',tok=()=>localStorage.getItem('access_token')||localStorage.getItem('sb_access_token')||localStorage.getItem('machi_access_token')||'',esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let rules=[];function fmt(t){return t?String(t).slice(0,5):'時間未設定'}function render(){list.innerHTML=rules.map(r=>`<section class="mo-card card"><div class=top><b>🔔 ${esc(r.name)}</b><span class=pill>${r.trigger_type==='shift_previous_day'?'前日 ':''}${fmt(r.time_of_day)}</span></div><div class=msg>${esc(r.message)}</div><div class=actions><button class="mo-btn mo-btn-secondary" onclick="edit(${r.id})">編集</button><button class="mo-btn ${r.active?'mo-btn-primary':'mo-btn-secondary'}" onclick="toggle(${r.id},${!r.active})">${r.active?'ON':'OFF'}</button></div></section>`).join('')}async function load(){const r=await fetch(API,{headers:{Authorization:'Bearer '+tok()}}),j=await r.json();if(!r.ok){list.innerHTML='<p>'+esc(j.error||'取得できません')+'</p>';return}rules=j.rules||[];render()}function open(r={}){rid.value=r.id||'';name.value=r.name||'';time.value=fmt(r.time_of_day)==='時間未設定'?'20:00':fmt(r.time_of_day);target.value=r.target_type||'working_staff';trigger.value=r.trigger_type||'clock';message.value=r.message||'';modal.style.display='grid'}function edit(id){open(rules.find(x=>x.id===id)||{})}async function toggle(id,active){await patch(id,{active});await load()}async function patch(id,b){const r=await fetch(API,{method:'PATCH',headers:{Authorization:'Bearer '+tok(),'Content-Type':'application/json'},body:JSON.stringify({id,...b})}),j=await r.json();if(!r.ok)alert(j.error||'更新できません')}add.onclick=()=>open();cancel.onclick=()=>modal.style.display='none';save.onclick=async()=>{const body={name:name.value,time_of_day:time.value,target_type:target.value,trigger_type:trigger.value,message:message.value};const id=Number(rid.value);const r=await fetch(API,{method:id?'PATCH':'POST',headers:{Authorization:'Bearer '+tok(),'Content-Type':'application/json'},body:JSON.stringify(id?{id,...body}:body)}),j=await r.json();if(!r.ok){alert(j.error||'保存できません');return}modal.style.display='none';load()};load();
</script></body></html>
