<!doctype html><html lang=ja><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel=stylesheet href=/machi-design-system.css><script src=/machi-ui-config.js></script><title>MACHI POINT</title><style>body{margin:0;background:var(--mo-bg);color:var(--mo-ink)}main{max-width:720px;margin:auto;padding:28px 16px 90px}.ey{font-size:11px;letter-spacing:.15em;color:var(--mo-muted);font-weight:900}.hero{background:var(--mo-accent);color:#fff;border-radius:28px;padding:25px;margin:10px 0 18px}.hero small{opacity:.65}.pts{font-size:46px;font-weight:950;margin:7px 0}.yen{opacity:.8}.title{font-size:15px;color:var(--mo-muted);margin:20px 0 8px}.card{padding:16px;margin:9px 0;display:flex;align-items:center;gap:12px}.ico{width:44px;height:44px;border-radius:14px;background:var(--mo-surface-2);display:grid;place-items:center;font-size:21px}.txt{flex:1}.txt b{display:block}.txt small{color:var(--mo-muted)}.plus{font-size:18px;font-weight:950}.note{font-size:12px;color:var(--mo-muted);line-height:1.6;margin-top:18px}</style></head><body><main><div class=ey>MACHI ORDER · REWARDS</div><section class=hero><small>今月のMACHI POINT</small><div class=pts><span id=approved>0</span> <span style="font-size:18px">pt</span></div><div class=yen>承認済み · 1pt＝1円相当</div><div class=yen id=pending style="margin-top:5px"></div></section><div class=title>ポイントルール</div><div class="mo-card card"><div class=ico>🌙</div><div class=txt><b>夜ワンオペ</b><small>夜営業を一人で担当</small></div><div class=plus>+500</div></div><div class="mo-card card"><div class=ico>💰</div><div class=txt><b>夜売上20,000円達成</b><small>夜営業の売上目標</small></div><div class=plus>+500</div></div><div class="mo-card card"><div class=ico>🔥</div><div class=txt><b>5連勤</b><small>5日連続勤務</small></div><div class=plus>+500</div></div><div class="mo-card card"><div class=ico>👥</div><div class=txt><b>友達紹介</b><small>友達が来店・飲食</small></div><div class=plus>+100</div></div><div class="mo-card card"><div class=ico>⭐</div><div class=txt><b>店長GOOD</b><small>良い行動・頑張りを評価</small></div><div class=plus>+100〜</div></div><div class=note>ポイントは加点型。給与の基本給・深夜/残業等とは分離して管理し、給与反映前に店長承認する設計です。</div></main><script>
const API='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/points-api?store_id=1',tok=()=>localStorage.getItem('access_token')||localStorage.getItem('sb_access_token')||localStorage.getItem('machi_access_token')||'';
(async()=>{if(!tok())return;try{const r=await fetch(API,{headers:{Authorization:'Bearer '+tok()}}),j=await r.json();if(r.ok){approved.textContent=Number(j.approved_points||0).toLocaleString();pending.textContent=j.pending_points?`承認待ち ${Number(j.pending_points).toLocaleString()}pt`:''}}catch(e){}})();
</script></body></html>
