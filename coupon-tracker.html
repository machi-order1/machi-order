<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script><title>再来店券｜151 GROWTH</title><style>*{box-sizing:border-box}body{margin:0;background:var(--mo-bg,#f5f5f2);color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.top{background:#111;color:#fff;padding:22px 18px}.top a{color:#fff;text-decoration:none;font-size:13px}.top h1{font-size:30px;margin:15px 0 3px}.top p{margin:0;color:#bbb}.wrap{max-width:720px;margin:auto;padding:16px 14px 100px}.card{background:#fff;border:1px solid #e1ded8;border-radius:20px;padding:18px;margin:11px 0}.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shop button,.actions button{min-height:50px;border:0;border-radius:14px;font:900 16px inherit}.shop button{background:#eee;color:#222}.shop button.on{background:#111;color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{min-height:90px;color:#fff}.issue{background:#111}.redeem{background:#d40a17}.actions b{display:block;font-size:25px}.today,.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f5f4f1;border-radius:15px;padding:13px}.stat small{display:block;color:#777;font-weight:700}.stat b{display:block;font-size:24px;margin-top:4px}.period{display:flex;gap:7px;margin-bottom:12px}.period button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:8px 12px;font-weight:800}.period button.on{background:#111;color:#fff}.undo{background:none;border:0;text-decoration:underline;color:#555;padding:10px 0}.msg{min-height:24px;font-size:13px;color:#555}.note{font-size:12px;color:#777;line-height:1.6}@media(max-width:520px){.today,.summary{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}</style></head><body><header class="top"><a href="/growth.html">← 151 GROWTH</a><h1>餃子券の記録</h1><p>渡した時と、使われた時だけワンタップ。</p></header><main class="wrap"><section class="card"><b>店舗</b><div class="shop"><button data-shop="nagahama" class="on">長浜店</button><button data-shop="shirakibaru">白木原店</button></div></section><section class="card"><div class="actions"><button class="issue" data-action="issued"><b>＋1</b>券を渡した</button><button class="redeem" data-action="redeemed"><b>＋1</b>券を回収した</button></div><button id="undo" class="undo">直前の自分の入力を取り消す</button><div id="msg" class="msg"></div></section><section class="card"><h2>今日</h2><div class="today"><div class="stat"><small>発行</small><b id="today-issued">0</b></div><div class="stat"><small>回収</small><b id="today-redeemed">0</b></div><div class="stat"><small>回収率</small><b id="today-rate">0%</b></div></div></section><section class="card"><h2>効果</h2><div class="period"><button data-days="7">7日</button><button data-days="30" class="on">30日</button><button data-days="90">90日</button></div><div class="summary"><div class="stat"><small>発行</small><b id="sum-issued">0</b></div><div class="stat"><small>回収</small><b id="sum-redeemed">0</b></div><div class="stat"><small>回収率</small><b id="sum-rate">0%</b></div></div><p class="note">回収率＝期間内の回収枚数÷発行枚数。券の有効期限が30日のため、30日表示を基本にします。</p></section></main><script>(()=>{const base='https://tejglrlkaqolbghoagqj.supabase.co',key='sb_publishable_beZla85Y6Ngrx0hji9I9rg_FbcRSUoT',$=s=>document.querySelector(s),token=()=>localStorage.machi_access_token||localStorage.mo_staff_token||'',jpDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),headers=()=>({apikey:key,Authorization:'Bearer '+token(),'Content-Type':'application/json'});let shop=localStorage.machi_coupon_shop||'nagahama',days=30,userId='';if(!token()){location.replace('/login.html?next=/coupon-tracker.html');return}function rate(i,r){return i?Math.round(r/i*100)+'%':'0%'}function selected(){document.querySelectorAll('[data-shop]').forEach(b=>b.classList.toggle('on',b.dataset.shop===shop))}async function getUser(){const r=await fetch(base+'/auth/v1/user',{headers:headers()});if(r.status===401){location.replace('/login.html?next=/coupon-tracker.html');return}const j=await r.json();userId=j.id||''}async function rows(from){const r=await fetch(base+'/rest/v1/coupon_activity?select=id,action,quantity,occurred_on,created_at,created_by&store_slug=eq.'+shop+'&occurred_on=gte.'+from+'&order=created_at.desc&limit=5000',{headers:headers()});if(!r.ok)throw Error('集計を取得できません');return r.json()}async function load(){try{const now=new Date(),from=new Date(now.getTime()-(days-1)*864e5).toISOString().slice(0,10),list=await rows(from),today=jpDate(),sum=(a,n)=>a.filter(x=>x.action===n).reduce((v,x)=>v+x.quantity,0),ti=sum(list.filter(x=>x.occurred_on===today),'issued'),tr=sum(list.filter(x=>x.occurred_on===today),'redeemed'),si=sum(list,'issued'),sr=sum(list,'redeemed');$('#today-issued').textContent=ti;$('#today-redeemed').textContent=tr;$('#today-rate').textContent=rate(ti,tr);$('#sum-issued').textContent=si;$('#sum-redeemed').textContent=sr;$('#sum-rate').textContent=rate(si,sr)}catch(e){$('#msg').textContent=e.message}}async function add(action){document.querySelectorAll('[data-action]').forEach(b=>b.disabled=true);try{const r=await fetch(base+'/rest/v1/coupon_activity',{method:'POST',headers:{...headers(),Prefer:'return=minimal'},body:JSON.stringify({store_slug:shop,action,quantity:1,occurred_on:jpDate()})});if(!r.ok)throw Error('記録できませんでした');$('#msg').textContent=action==='issued'?'✓ 発行を1枚記録':'✓ 回収を1枚記録';await load()}catch(e){$('#msg').textContent=e.message}finally{document.querySelectorAll('[data-action]').forEach(b=>b.disabled=false)}}async function undo(){if(!userId)return;const q=base+'/rest/v1/coupon_activity?select=id,action&store_slug=eq.'+shop+'&created_by=eq.'+userId+'&order=created_at.desc&limit=1',r=await fetch(q,{headers:headers()}),list=await r.json();if(!r.ok||!list.length){$('#msg').textContent='取り消せる入力がありません';return}const del=await fetch(base+'/rest/v1/coupon_activity?id=eq.'+list[0].id,{method:'DELETE',headers:headers()});if(!del.ok){$('#msg').textContent='10分を過ぎた入力は取り消せません';return}$('#msg').textContent='✓ 直前の入力を取り消しました';load()}document.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>{shop=b.dataset.shop;localStorage.machi_coupon_shop=shop;selected();load()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>add(b.dataset.action));document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{days=Number(b.dataset.days);document.querySelectorAll('[data-days]').forEach(x=>x.classList.toggle('on',x===b));load()});$('#undo').onclick=undo;selected();getUser().then(load)})();</script></body></html>
