<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script>
  <title>151 GROWTH｜MACHI ORDER</title>
  <style>*{box-sizing:border-box}body{margin:0;background:var(--mo-bg,#f5f5f2);color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.top{background:#111;color:#fff;padding:25px 18px}.top a{color:#fff;text-decoration:none;font-size:13px}.ey{font-size:11px;letter-spacing:.16em;color:#aaa;font-weight:900;margin-top:16px}.top h1{font-size:34px;margin:5px 0}.top p{color:#bbb;margin:0}.wrap{max-width:860px;margin:auto;padding:18px 14px 100px}.section{margin:12px 0 20px}.section h2{font-size:19px;margin:0 0 10px}.card{background:#fff;border:1px solid #e2dfda;border-radius:20px;padding:18px;margin-bottom:10px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select,button{width:100%;min-height:48px;border:1px solid #d8d2cc;border-radius:13px;padding:10px 12px;background:#fff;font:inherit}button{border:0;background:#111;color:#fff;font-weight:900}.red{background:#e51b23}.full{grid-column:1/-1}.post{white-space:pre-wrap;line-height:1.7}.post-head{display:flex;justify-content:space-between;align-items:center}.post-head button{width:auto;min-height:38px}.links{display:grid;grid-template-columns:1fr 1fr;gap:9px}.links a{display:block;text-decoration:none;color:#111;background:#fff;border:1px solid #dedbd5;border-radius:16px;padding:15px;font-weight:850}.links span,.check small{display:block;font-size:12px;color:#777;margin-top:4px}.check{display:flex;gap:12px;padding:8px 0}.check input{width:24px;min-height:24px}.notice{padding:13px;background:#fff6d8;border-radius:14px;font-size:13px;line-height:1.6}@media(max-width:620px){.form,.links{grid-template-columns:1fr}}</style>
</head>
<body><header class="top"><a href="/store-command.html">← 店舗ホーム</a><div class="ey">MACHI ORDER · MARKETING</div><h1>151 GROWTH</h1><p>SNS・口コミ・SEO/MEOを、売上につなげる。</p></header>
<main class="wrap">
  <section class="section"><h2>今日の投稿をつくる</h2><div class="card"><div class="form"><select id="shop"><option>長浜店</option><option>白木原店</option></select><select id="focus"><option value="lunch">ランチ集客</option><option value="night">夜営業を強化</option><option value="review">口コミを増やす</option><option value="brand">151の魅力を伝える</option></select><input id="weather" placeholder="天気・気温（任意）"><input id="stock" placeholder="推したい商品（任意）"><button class="red full" id="generate">投稿案を3本つくる</button></div></div><div id="posts"></div></section>
  <section class="section"><h2>口コミ・店舗情報</h2><div class="links"><a href="https://hakata-aburasoba-151.katsuhiro-yokota.chatgpt.site/review/?shop=nagahama" target="_blank">長浜店 口コミ導線<span>お客様に見せるページ</span></a><a href="https://hakata-aburasoba-151.katsuhiro-yokota.chatgpt.site/review/?shop=shirakibaru" target="_blank">白木原店 口コミ導線<span>お客様に見せるページ</span></a><a href="https://www.google.com/maps/search/?api=1&amp;query=%E5%8D%9A%E5%A4%9A%E6%B2%B9%E3%81%9D%E3%81%B0151%20%E9%95%B7%E6%B5%9C%E5%BA%97" target="_blank">長浜店 Googleマップ<span>写真・営業時間・口コミ</span></a><a href="https://www.google.com/maps/search/?api=1&amp;query=%E5%8D%9A%E5%A4%9A%E6%B2%B9%E3%81%9D%E3%81%B0151%20%E7%99%BD%E6%9C%A8%E5%8E%9F%E5%BA%97" target="_blank">白木原店 Googleマップ<span>写真・営業時間・口コミ</span></a></div></section>
  <section class="section"><h2>SEO・MEOチェック</h2><div class="card" id="checks"></div><p class="notice">外部SNSへの自動投稿とGoogleの実績取得は、各アカウント接続後に有効化します。公式サイトの店舗別ページ・構造化データ・サイトマップ・口コミ導線は実装済みです。</p></section>
</main>
<script>(()=>{const $=s=>document.querySelector(s),key='machi_growth_checks_v1',items=[['営業時間・定休日を統一','Googleと公式サイトを一致'],['料理・外観・店内写真を追加','各店舗、毎月3枚以上'],['新しい口コミへ返信','評価を問わず誠実に返信'],['Google店舗投稿を更新','週1回を目安'],['公式サイト店舗情報を確認','住所・営業時間・注文リンク'],['SNSから店舗ページへ誘導','プロフィールリンクを設定']];let state=JSON.parse(localStorage.getItem(key)||'{}');items.forEach((x,i)=>{let row=document.createElement('div');row.className='check';row.innerHTML=`<input id=c${i} type=checkbox ${state[i]?'checked':''}><label for=c${i}><b>${x[0]}</b><small>${x[1]}</small></label>`;row.querySelector('input').onchange=e=>{state[i]=e.target.checked;localStorage.setItem(key,JSON.stringify(state))};$('#checks').append(row)});const posts={lunch:['昼休みに、ちゃんと満たす。\n麺大盛り無料。出汁で食べる博多油そば151、{shop}でお待ちしています。','濃くないのに、旨味がえぐい。\n午後まで重すぎない一杯。今日のランチは{shop}へ。','並・大盛り同価格。\n熱いうちに混ぜて、最後は自分好みに。{product}'],night:['仕事帰りの一杯に。\n油そばとハイボールで今日を締める。{shop}、夜も営業中。','夜こそ151。ガッツリ満たされるのに重すぎない。\n{product}','今夜は混ぜて、飲んで、仕上げる。\n{shop}でお待ちしています。'],review:['今日の一杯はいかがでしたか？\n率直なご感想が、次の一杯をもっと旨くします。','お気に入りの味変をぜひ教えてください。\nご来店ありがとうございました。','151を一緒に育ててください。\nGoogleマップで今日の感想をお聞かせください。'],brand:['油そばだから、油から考える。\n豚、鶏、葱。三種の油を独自配合。','濃くないのに、旨味がえぐい。\n醤油の濃さではなく、出汁の奥行きで食わせる。','最後の仕上げは、あなた。\nラー油、揚げ一味、煮干酢、にんにくで自分だけの一杯へ。']};function generate(){let shop=$('#shop').value,focus=$('#focus').value,weather=$('#weather').value.trim(),product=$('#stock').value.trim()||'博多油そば',tags='\n\n#博多油そば151 #油そば #福岡グルメ #'+(shop==='長浜店'?'長浜ランチ #福岡ランチ':'白木原グルメ #大野城ランチ');$('#posts').replaceChildren(...posts[focus].map((t,i)=>{let text=t.replaceAll('{shop}',shop).replaceAll('{product}',product)+(weather?'\n'+weather+'の日も熱々でお待ちしています。':'')+tags,el=document.createElement('article');el.className='card';el.innerHTML=`<div class=post-head><b>投稿案 ${i+1}</b><button>コピー</button></div><p class=post></p>`;el.querySelector('p').textContent=text;el.querySelector('button').onclick=async e=>{await navigator.clipboard.writeText(text);e.target.textContent='コピー済み'};return el}))}$('#generate').onclick=generate;generate()})();</script></body></html>
