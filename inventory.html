<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e51b23"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/machi-design-system.css"><title>在庫・棚卸｜MACHI ORDER</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f3ee;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:780px;margin:auto;padding:22px 16px 100px}.back{color:#555;text-decoration:none;font-weight:800}.ey{margin-top:20px;color:#8a8179;font-size:11px;font-weight:950;letter-spacing:.16em}h1{font-size:31px;margin:7px 0 17px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.card{background:#fff;border-radius:17px;padding:14px}.stat{text-align:center}.stat b{display:block;font-size:25px}.stat small,.meta{color:#777}.toolbar{display:flex;gap:8px;overflow:auto;padding:13px 0}.filter{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:10px 13px;border-radius:999px;font-weight:850}.filter.on{background:#171717;color:#fff;border-color:#171717}.card{border-radius:19px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0000000a}.card.alert{border-left:6px solid #e51b23}.card.unknown{border-left:6px solid #d9a400}.group{display:flex;justify-content:space-between;align-items:center;margin:25px 3px 8px}.group h2{font-size:20px;margin:0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.name{font-size:18px;font-weight:950}.stock{font-size:20px;font-weight:950;text-align:right}.meta{font-size:12px;margin-top:5px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee;font-size:11px;font-weight:900;margin:3px 3px 0 0}.badge.red{background:#ffe2e4;color:#b71920}.badge.yellow{background:#fff2c7;color:#805c00}.badge.green{background:#e2f5e8;color:#14612b}.count,.edit,.add{border:0;border-radius:11px;padding:10px 12px;font-weight:900}.count{background:#171717;color:#fff;margin-top:10px}.edit{background:#eee;margin:10px 0 0 5px}.add{background:#e51b23;color:#fff}.buy{background:#fff4df}.buyline{padding:10px 0;border-top:1px solid #eadac1}.buyline:first-child{border:0}.empty{text-align:center;color:#777;padding:24px}.msg{min-height:24px;font-weight:800;color:#b71920}.modal{position:fixed;inset:0;background:#0008;display:none;z-index:100;padding:20px;overflow:auto}.modal.open{display:grid;place-items:center}.sheet{width:min(100%,540px);background:#fff;border-radius:22px;padding:20px}.sheet input,.sheet select{width:100%;padding:13px;border:1px solid #ddd;border-radius:13px;font:inherit;margin:6px 0 12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{border:0;border-radius:13px;padding:14px;font-weight:950}.save{background:#e51b23;color:#fff}.danger{color:#b71920;background:#fff;border:1px solid #efb9bc!important;margin-top:12px;width:100%}@media(max-width:430px){.summary{grid-template-columns:repeat(3,1fr)}.stat b{font-size:21px}}</style></head>
<body><main><a class="back" href="/store-command.html">← 店舗ホーム</a><div class="ey" id="store-name">博多油そば151</div><div class="row"><h1>在庫・棚卸</h1><button class="add" id="add-item" hidden>＋ 品目追加</button></div><div class="summary"><div class="stat"><b id="known">—</b><small>確認済</small></div><div class="stat"><b id="unknown">—</b><small>未棚卸</small></div><div class="stat"><b id="reorder">—</b><small>発注候補</small></div></div><section class="card buy"><b>🛒 今日の発注候補</b><div id="buy"></div></section><div class="toolbar"><button class="filter on" data-filter="all">すべて</button><button class="filter" data-filter="reorder">発注候補</button><button class="filter" data-filter="unknown">未棚卸</button><button class="filter" data-filter="known">確認済</button></div><div id="all"></div><p class="msg" id="msg" role="alert"></p></main>
<div class="modal" id="count-modal" role="dialog" aria-modal="true"><div class="sheet"><h2 id="count-title">在庫数を入力</h2><div class="meta" id="count-meta"></div><label><b>現在の実在庫</b><input id="quantity" type="number" min="0" step="0.01" inputmode="decimal"></label><label><b>棚卸タイミング</b><select id="session"><option value="opening">営業前</option><option value="midday">昼営業後</option><option value="night" selected>閉店時</option></select></label><div class="actions"><button data-close="count-modal">戻る</button><button class="save" id="save-count">棚卸を記録</button></div></div></div>
<div class="modal" id="item-modal" role="dialog" aria-modal="true"><div class="sheet"><h2 id="item-title">在庫品目を追加</h2><label><b>品目名</b><input id="item-name" maxlength="80" placeholder="例：高菜漬け（未仕込み）"></label><label><b>グループ</b><select id="item-group"><option>冷蔵庫仕込み在庫</option><option>タレ系在庫</option><option>冷凍食材在庫</option><option>メイン食材在庫</option><option>買い出し系食材</option><option>飲み物</option><option>備品</option><option>その他</option></select></label><label><b>状態</b><select id="item-type"><option value="prepared">仕込み済み（先に使う）</option><option value="raw">仕込み前・未加工</option><option value="sauce">タレ・油</option><option value="frozen">冷凍</option><option value="drink">飲み物</option><option value="supply">備品</option></select></label><label><b>在庫単位</b><input id="item-unit" maxlength="20" placeholder="個・袋・本・容器など"></label><div class="actions"><label><b>発注点</b><input id="item-reorder" type="number" min="0" step="0.01"></label><label><b>適正在庫</b><input id="item-par" type="number" min="0" step="0.01"></label></div><label><b>購入先（任意）</b><input id="item-location" maxlength="100"></label><div class="actions"><button data-close="item-modal">戻る</button><button class="save" id="save-item">保存</button></div><button class="danger" id="deactivate-item" hidden>この品目を停止する</button></div></div>
<script>
const BASE='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/inventory-api',params=new URLSearchParams(location.search),storeId=Number(params.get('store_id')||localStorage.machi_store_id||1),API=BASE+'?store_id='+storeId,$=id=>document.getElementById(id);let items=[],filter='all',selected=null,editing=null,busy=false,canManage=false;const token=()=>localStorage.machi_access_token||localStorage.mo_staff_token||'';
function login(){location.replace('/login.html?next='+encodeURIComponent('/inventory.html?store_id='+storeId))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function num(x){return Number(x).toLocaleString('ja-JP',{maximumFractionDigits:2})}async function api(method='GET',body){if(!token())return login();const r=await fetch(API,{method,headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}),j=await r.json().catch(()=>({}));if(r.status===401)return login();if(!r.ok)throw Error(j.error||'処理できません');return j}
function badges(x){return `${x.item_type==='prepared'?'<span class="badge green">先に使う・仕込み済み</span>':''}${x.needs_reorder?'<span class="badge red">発注候補</span>':!x.stock_known?'<span class="badge yellow">数量未確認</span>':'<span class="badge">確認済</span>'}`}
function render(){const visible=items.filter(x=>filter==='all'||filter==='reorder'&&x.needs_reorder||filter==='unknown'&&!x.stock_known||filter==='known'&&x.stock_known);$('known').textContent=items.filter(x=>x.stock_known).length;$('unknown').textContent=items.filter(x=>!x.stock_known).length;$('reorder').textContent=items.filter(x=>x.needs_reorder).length;const suggestions=items.filter(x=>x.needs_reorder);$('buy').innerHTML=suggestions.length?suggestions.map(x=>`<div class="buyline"><div class="row"><b>${esc(x.name)}</b><strong>${num(x.suggested_purchase_quantity)}${esc(x.unit)}</strong></div><div class="meta">現在 ${num(x.stock_quantity)}${esc(x.unit)} ／ 発注点 ${num(x.reorder_level)}${esc(x.unit)}${x.purchase_location?' ／ '+esc(x.purchase_location):''}</div></div>`).join(''):'<div class="empty">発注候補はありません</div>';let html='',group='';for(const x of visible){const g=x.inventory_group||'その他';if(g!==group){group=g;html+=`<div class="group"><h2>${esc(g)}</h2><small>${visible.filter(y=>(y.inventory_group||'その他')===g).length}項目</small></div>`}html+=`<article class="card ${x.needs_reorder?'alert':!x.stock_known?'unknown':''}"><div class="row"><div><div class="name">${esc(x.name)}</div><div class="meta">基準 ${x.par_level==null?'未設定':num(x.par_level)+esc(x.unit)}</div>${badges(x)}</div><div class="stock">${x.stock_known?num(x.stock_quantity)+esc(x.unit):'未棚卸'}</div></div><button class="count" data-count="${x.id}">棚卸入力</button>${canManage?`<button class="edit" data-edit="${x.id}">設定変更</button>`:''}</article>`}$('all').innerHTML=html||'<div class="empty">該当する在庫はありません</div>';document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>openCount(Number(b.dataset.count)));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openItem(Number(b.dataset.edit)))}
async function load(){try{const j=await api();items=j.items||[];canManage=!!j.can_manage_items;$('store-name').textContent='博多油そば151 · '+(j.store?.name||'店舗');$('add-item').hidden=!canManage;render();$('msg').textContent='最終更新 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}catch(e){$('msg').textContent=e.message}}
function openCount(id){selected=items.find(x=>x.id===id);if(!selected)return;$('count-title').textContent=selected.name;$('count-meta').textContent='単位：'+selected.unit+' ／ 現在：'+(selected.stock_known?num(selected.stock_quantity):'未棚卸');$('quantity').value=selected.stock_known?selected.stock_quantity:'';$('count-modal').classList.add('open');setTimeout(()=>$('quantity').focus(),50)}
async function saveCount(){const qty=Number($('quantity').value);if($('quantity').value===''||!Number.isFinite(qty)||qty<0)return alert('0以上の在庫数を入力してください');if(!confirm(selected.name+' の実在庫を '+num(qty)+selected.unit+' で記録しますか？'))return;busy=true;$('save-count').disabled=true;try{await api('POST',{action:'count',inventory_item_id:selected.id,quantity:qty,session:$('session').value});$('count-modal').classList.remove('open');await load()}catch(e){alert(e.message)}finally{busy=false;$('save-count').disabled=false}}
function openItem(id=null){editing=id?items.find(x=>x.id===id):null;$('item-title').textContent=editing?'在庫品目を変更':'在庫品目を追加';$('item-name').value=editing?.name||'';$('item-group').value=editing?.inventory_group||'冷蔵庫仕込み在庫';$('item-type').value=editing?.item_type||'prepared';$('item-unit').value=editing?.unit||'';$('item-reorder').value=editing?.reorder_level??'';$('item-par').value=editing?.par_level??'';$('item-location').value=editing?.purchase_location||'';$('deactivate-item').hidden=!editing;$('item-modal').classList.add('open')}
async function saveItem(){const body={action:editing?'item_update':'item_create',inventory_item_id:editing?.id,name:$('item-name').value,inventory_group:$('item-group').value,item_type:$('item-type').value,unit:$('item-unit').value,reorder_level:$('item-reorder').value,par_level:$('item-par').value,purchase_location:$('item-location').value};$('save-item').disabled=true;try{await api('POST',body);$('item-modal').classList.remove('open');await load()}catch(e){alert(e.message)}finally{$('save-item').disabled=false}}
async function deactivate(){if(!editing||!confirm(editing.name+' を一覧から停止しますか？\n過去の棚卸履歴は残ります。'))return;try{await api('POST',{action:'item_deactivate',inventory_item_id:editing.id});$('item-modal').classList.remove('open');await load()}catch(e){alert(e.message)}}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{if(!busy)$(b.dataset.close).classList.remove('open')});document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m&&!busy)m.classList.remove('open')});$('save-count').onclick=saveCount;$('add-item').onclick=()=>openItem();$('save-item').onclick=saveItem;$('deactivate-item').onclick=deactivate;if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load();
</script></body></html>
