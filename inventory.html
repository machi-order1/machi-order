<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e51b23"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/machi-design-system.css"><title>在庫・棚卸｜MACHI ORDER</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f3ee;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:780px;margin:auto;padding:22px 16px 100px}.back{color:#555;text-decoration:none;font-weight:800}.ey{margin-top:20px;color:#8a8179;font-size:11px;font-weight:950;letter-spacing:.16em}h1{font-size:31px;margin:7px 0 17px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border-radius:17px;padding:14px 8px;text-align:center}.stat b{display:block;font-size:25px}.stat small{color:#777}.toolbar{display:flex;gap:8px;overflow:auto;padding:13px 0}.filter{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:10px 13px;border-radius:999px;font-weight:850}.filter.on{background:#171717;color:#fff;border-color:#171717}.card{background:#fff;border-radius:19px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0000000a}.card.alert{border-left:6px solid #e51b23}.card.unknown{border-left:6px solid #d9a400}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.name{font-size:18px;font-weight:950}.stock{font-size:20px;font-weight:950;text-align:right}.meta{font-size:12px;color:#777;margin-top:5px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee;font-size:11px;font-weight:900}.badge.red{background:#ffe2e4;color:#b71920}.badge.yellow{background:#fff2c7;color:#805c00}.count{border:0;background:#171717;color:#fff;border-radius:11px;padding:9px 12px;font-weight:900;margin-top:10px}.buy{background:#fff4df}.buyline{padding:10px 0;border-top:1px solid #eadac1}.buyline:first-child{border:0}.empty{text-align:center;color:#777;padding:24px}.msg{min-height:24px;font-weight:800;color:#b71920}.modal{position:fixed;inset:0;background:#0008;display:none;z-index:100;padding:20px}.modal.open{display:grid;place-items:center}.sheet{width:min(100%,520px);background:#fff;border-radius:22px;padding:20px}.sheet input,.sheet select{width:100%;padding:14px;border:1px solid #ddd;border-radius:13px;font:inherit;margin:6px 0 12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{border:0;border-radius:13px;padding:14px;font-weight:950}.save{background:#e51b23;color:#fff}</style></head>
<body><main><a class="back" href="/store-command.html">← 店舗ホーム</a><div class="ey">博多油そば151 · 長浜店</div><h1>在庫・棚卸</h1><div class="summary"><div class="stat"><b id="known">—</b><small>在庫確認済</small></div><div class="stat"><b id="unknown">—</b><small>未棚卸</small></div><div class="stat"><b id="reorder">—</b><small>発注候補</small></div></div><section class="card buy"><b>🛒 今日の発注候補</b><div id="buy"></div></section><div class="toolbar"><button class="filter on" data-filter="all">すべて</button><button class="filter" data-filter="reorder">発注候補</button><button class="filter" data-filter="unknown">未棚卸</button><button class="filter" data-filter="known">確認済</button></div><div id="all"></div><p class="msg" id="msg" role="alert"></p></main>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet"><h2 id="count-title">在庫数を入力</h2><div class="meta" id="count-meta"></div><label for="quantity"><b>現在の実在庫</b></label><input id="quantity" type="number" min="0" step="0.01" inputmode="decimal"><label for="session"><b>棚卸タイミング</b></label><select id="session"><option value="opening">営業前</option><option value="midday">昼営業後</option><option value="night" selected>閉店時</option></select><div class="actions"><button id="cancel">戻る</button><button class="save" id="save-count">棚卸を記録</button></div></div></div>
<script>
const API='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/inventory-api?store_id=1',$=id=>document.getElementById(id);let items=[],filter='all',selected=null,busy=false;const token=()=>localStorage.machi_access_token||localStorage.mo_staff_token||'';
function login(){location.replace('/login.html?next='+encodeURIComponent('/inventory.html'))}function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function num(x){return Number(x).toLocaleString('ja-JP',{maximumFractionDigits:2})}
async function api(method='GET',body){if(!token())return login();const r=await fetch(API,{method,headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}),j=await r.json().catch(()=>({}));if(r.status===401)return login();if(!r.ok)throw Error(j.error||'処理できません');return j}
function render(){const visible=items.filter(x=>filter==='all'||filter==='reorder'&&x.needs_reorder||filter==='unknown'&&!x.stock_known||filter==='known'&&x.stock_known);$('known').textContent=items.filter(x=>x.stock_known).length;$('unknown').textContent=items.filter(x=>!x.stock_known).length;$('reorder').textContent=items.filter(x=>x.needs_reorder).length;const suggestions=items.filter(x=>x.needs_reorder);$('buy').innerHTML=suggestions.length?suggestions.map(x=>`<div class="buyline"><div class="row"><b>${esc(x.name)}</b><strong>${num(x.suggested_purchase_quantity)}${esc(x.unit)}</strong></div><div class="meta">現在 ${num(x.stock_quantity)}${esc(x.unit)} ／ 発注点 ${num(x.reorder_level)}${esc(x.unit)}${x.purchase_location?' ／ '+esc(x.purchase_location):''}</div></div>`).join(''):'<div class="empty">発注候補はありません</div>';$('all').innerHTML=visible.length?visible.map(x=>`<article class="card ${x.needs_reorder?'alert':!x.stock_known?'unknown':''}"><div class="row"><div><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.inventory_class||'その他')} · 基準 ${x.par_level==null?'未設定':num(x.par_level)+esc(x.unit)}</div></div><div><div class="stock">${x.stock_known?num(x.stock_quantity)+esc(x.unit):'未棚卸'}</div>${x.needs_reorder?'<span class="badge red">発注候補</span>':!x.stock_known?'<span class="badge yellow">数量未確認</span>':'<span class="badge">確認済</span>'}</div></div><button class="count" data-count="${x.id}">棚卸入力</button></article>`).join(''):'<div class="empty">該当する在庫はありません</div>';document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>openCount(Number(b.dataset.count)))}
async function load(){try{const j=await api();items=j.items||[];render();$('msg').textContent='最終更新 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}catch(e){$('msg').textContent=e.message}}
function openCount(id){selected=items.find(x=>x.id===id);if(!selected)return;$('count-title').textContent=selected.name;$('count-meta').textContent='単位：'+selected.unit+' ／ 現在：'+(selected.stock_known?num(selected.stock_quantity):'未棚卸');$('quantity').value=selected.stock_known?selected.stock_quantity:'';$('modal').classList.add('open');setTimeout(()=>$('quantity').focus(),50)}function closeCount(){if(!busy)$('modal').classList.remove('open')}
async function saveCount(){const qty=Number($('quantity').value);if($('quantity').value===''||!Number.isFinite(qty)||qty<0)return alert('0以上の在庫数を入力してください');if(!confirm(selected.name+' の実在庫を '+num(qty)+selected.unit+' で記録しますか？'))return;busy=true;$('save-count').disabled=true;try{await api('POST',{action:'count',inventory_item_id:selected.id,quantity:qty,session:$('session').value});$('modal').classList.remove('open');$('msg').textContent='✓ '+selected.name+' の棚卸を記録しました';await load()}catch(e){alert(e.message)}finally{busy=false;$('save-count').disabled=false}}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()});$('cancel').onclick=closeCount;$('save-count').onclick=saveCount;$('modal').onclick=e=>{if(e.target===$('modal'))closeCount()};if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load();
</script></body></html>
