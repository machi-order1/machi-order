<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>在庫・発注</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#f5f5f7;color:#111}header{position:sticky;top:0;background:#111;color:#fff;padding:14px 16px;z-index:5}h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.7;margin-top:4px}.wrap{max-width:980px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 5px #0001}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.big{font-size:24px;font-weight:800}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#eee;font-size:12px}.muted{color:#666;font-size:13px}input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin:5px 0}a.btn{display:inline-block;text-decoration:none;color:#111;background:#eee}.warn{background:#fff4d8}.ok{background:#e8f8ec}</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MACHI"><style>.mo-appnav{position:sticky;bottom:0;z-index:40;display:flex;justify-content:space-around;gap:4px;background:rgba(255,255,255,.96);border-top:1px solid #ddd;padding:7px max(7px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));backdrop-filter:blur(12px)}.mo-appnav a{min-width:58px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#555;font:700 11px -apple-system,sans-serif;border-radius:12px}.mo-appnav b{font-size:20px;line-height:22px}.mo-install{display:none;margin:10px auto;padding:12px 16px;border:0;border-radius:14px;background:#111;color:#fff;font-weight:800}</style><link rel="stylesheet" href="/machi-design-system.css"><script src="/machi-ui-config.js"></script></head><body><header><h1>MACHI ORDER 在庫</h1><div class='sub'>V31 · 長浜店</div></header><main class='wrap'><div class="card"><div class="row"><div><b>在庫・発注</b><div class="muted">発注が必要なものを上に表示</div></div><button class="btn" onclick="load()">更新</button></div><input id="tok" type="password" placeholder="アクセストークン"><button class="btn" onclick="save()">端末に保存</button><span id="msg" class="muted"></span></div><div class="card warn"><b>🛒 今日の発注おすすめ</b><div id="buy"></div></div><div class="card"><b>全在庫</b><div id="all"></div></div></main><script>const API='https://tejglrlkaqolbghoagqj.supabase.co/functions/v1/inventory-api?store_id=1',$=x=>document.getElementById(x);$('tok').value=localStorage.mo_staff_token||'';function save(){localStorage.mo_staff_token=$('tok').value.trim();load()}function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function get(){let r=await fetch(API,{headers:{Authorization:'Bearer '+(localStorage.mo_staff_token||'')}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'取得できません');return j}async function load(){try{let j=await get(),s=j.reorder_suggestions||[],items=j.items||[];$('buy').innerHTML=s.length?s.map(x=>`<div class="card"><b>${esc(x.name)}</b><div>現在 ${x.current_stock}${esc(x.unit)} → <b>推奨 ${x.suggested_quantity}${esc(x.unit)}</b></div>${x.purchase_location?`<div class="muted">購入先 ${esc(x.purchase_location)}</div>`:''}</div>`).join(''):'<p class="ok">発注おすすめなし</p>';$('all').innerHTML=items.map(x=>`<div class="row"><span>${esc(x.name)}</span><span>${x.stock_quantity}${esc(x.unit)}${x.needs_reorder?' ⚠️':''}</span></div>`).join('');$('msg').textContent='更新 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}catch(e){$('msg').textContent=e.message}}load();</script></body></html>
